     <p class="tiny mt8">将创建行程「${esc(data.title)}」（${start} 起 ${days} 天，币种 ${data.currency}），生成后可自由编辑。</p>
     <div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px">
       <button class="btn small" data-act="closeOverlay">放弃</button>
       <button class="btn primary small" id="aiCreate">${I('check',14)}创建行程</button></div>`);
    sm.el.querySelector('#aiCreate').onclick=()=>{
      const nt={id:'trp_'+uid(),title:data.title,destination:data.destination,startDate:start,
        endDate:addDays(start,days-1),currency:data.currency,budget:0,
        coverColor:DAY_COLORS[Math.floor(Math.random()*6)],notes:'',archived:false,companions:[],createdAt:Date.now(),updatedAt:Date.now()};
      DB.trips.push(nt);
      DB.packingLists.push({tripId:nt.id,categories:defaultPackingCategories()});
      data.days.forEach((d2,i2)=>{ for(const it of d2.items){
        const ni={id:'itm_'+uid(),tripId:nt.id,dayIndex:i2,time:it.time,type:it.type,title:it.title,note:it.note,
          cost:it.cost,currency:it.type==='transport'||it.type==='hotel'?data.currency:'',address:it.address,
          lat:null,lng:null,duration:0,bookingRef:'',attachments:[],visited:false,locked:false,
          includedInAnotherTicket:false,status:'idea',arriveTime:'',origin:'',dest:'',transMode:'',seatClass:'',
          checkInDate:'',checkOutDate:'',subs:[],photo:'',review:'',priority:''};
        if(it.type==='sight'&&it.time)ni.entryTime=it.time;
        DB.items.push(ni); repositionByTime(ni); } });
      save('trips'); save('items'); save('packingLists'); sm.close(); renderApp();
      goTo('tripDetail',{tripId:nt.id,tab:'timeline'}); toast('AI 草稿行程已创建'); }; }
  catch(e){ toast('AI 生成失败：'+e.message); btn.disabled=false; btn.textContent='生成'; } }

/* ==================== GPX 路线导出 ==================== */
function buildTripGpx(t){
  const wpts=[],trks=[];
  for(let d=0;d<tripDays(t);d++){
    const pts=itemsOfDay(t.id,d).filter(x=>x.lat!=null)
      .sort((a,b)=>(a.time?toMin(a.time):9999)-(b.time?toMin(b.time):9999));
    for(const x of pts)
      wpts.push('  <wpt lat="'+x.lat.toFixed(6)+'" lon="'+x.lng.toFixed(6)+'"><name>'+esc((x.time?x.time+' ':'')+x.title)+'</name></wpt>');
    if(pts.length>1)
      trks.push('  <trk><name>Day '+(d+1)+' · '+fmtMD(dayDate(t,d))+'</name><trkseg>'+
        pts.map(x=>'<trkpt lat="'+x.lat.toFixed(6)+'" lon="'+x.lng.toFixed(6)+'"></trkpt>').join('')+'</trkseg></trk>');
  }
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="XingGui HuiJuan" xmlns="http://www.topografix.com/GPX/1/1">\n'
    +wpts.join('\n')+'\n'+trks.join('\n')+'\n</gpx>';
}

/* ==================== 集合时间换算器 ==================== */
function tzWallToUtc(today,hhmm,tz){ const guess=Date.parse(today+'T'+hhmm+':00Z');
  return guess-(tzOffsetMin(tz)||0)*60000; }
function renderTzConverter(){ const box=$('#tzConvBox'); if(!box)return;
  const cities=[{name:'本地',tz:homeTZ()}].concat(Object.entries(COUNTRY_INFO).map(e=>({name:e[0],tz:e[1].tz})));
  const uniq=[]; const seen={};
  for(const c of cities){ if(!seen[c.tz]){ seen[c.tz]=1; uniq.push(c); } }
  box.innerHTML='<label class="f-label">出发城市</label><select id="tzSrc">'
    +uniq.map((c,i)=>'<option value="'+i+'"'+(i===0?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>'
    +'<div class="f-2 mt8"><div><label class="f-label">集合时间</label><input id="tzTime" type="time" value="'+nowHM()+'"></div>'
    +'<div><label class="f-label">日期</label><input id="tzDate" type="date" value="'+todayStr()+'"></div></div>'
    +'<div id="tzOut" class="tiny mt8" style="line-height:2"></div>';
  const upd=()=>{ const src=uniq[Number(box.querySelector('#tzSrc').value)||0];
    const hhmm=box.querySelector('#tzTime').value||'12:00';
    const date=box.querySelector('#tzDate').value||todayStr();
    const utc=tzWallToUtc(date,hhmm,src.tz);
    const outRows=uniq.filter(c=>c.tz!==src.tz).map(c=>{
      const d=new Date(utc); const loc=new Intl.DateTimeFormat('zh-CN',{timeZone:c.tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
      const day=new Intl.DateTimeFormat('zh-CN',{timeZone:c.tz,month:'numeric',day:'numeric'}).format(d);
      return '<div class="row" style="padding:2px 0"><span style="flex:1">'+esc(c.name)+'</span><b style="font-variant-numeric:tabular-nums">'+loc+'</b><span class="tiny" style="width:56px;text-align:right">'+day+'</span></div>'; }).join('');
    box.querySelector('#tzOut').innerHTML=outRows||'<div class="tiny">暂无其他城市</div>'; };
  box.querySelector('#tzSrc').addEventListener('change',upd);
  box.querySelector('#tzTime').addEventListener('input',upd);
  box.querySelector('#tzDate').addEventListener('change',upd);
  upd(); }

/* ==================== 语音输入（日记等，电脑 Chrome/Edge） ==================== */
function attachSpeech(btn,ta,tip){
  if(!btn)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ btn.style.display='none'; if(tip)tip.textContent='当前浏览器不支持语音输入'; return; }
  let rec=null,on=false;
  btn.onclick=()=>{ if(on){ try{rec.stop();}catch(e){} on=false; btn.textContent='🎤 语音输入'; return; }
    rec=new SR(); rec.lang='zh-CN'; rec.continuous=true; rec.interimResults=false;
    rec.onresult=e=>{ let txt='';
      for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)txt+=e.results[i][0].transcript;
      if(txt&&ta){ ta.value=(ta.value?ta.value:'')+(ta.value&&!ta.value.endsWith('\n')?'\n':'')+txt;
        ta.dispatchEvent(new Event('input',{bubbles:true})); } };
    rec.onerror=ev=>{ if(tip)tip.textContent='语音识别出错（'+(ev.error||'未知')+'）'; on=false; btn.textContent='🎤 语音输入'; };
    rec.onend=()=>{ on=false; btn.textContent='🎤 语音输入'; };
    try{ rec.start(); on=true; btn.textContent='⏹ 停止语音'; if(tip)tip.textContent='正在聆听，再说一遍内容即可续写'; }catch(e){} };
}

function renderCalendarTab(t){
  const months=[]; const seenM={};
  for(let d=0;d<tripDays(t);d++){ const ym=dayDate(t,d).slice(0,7);
    if(!seenM[ym]){ seenM[ym]=1; months.push(ym); } }
  const topP=navStack[navStack.length-1].params;
  const curYm=topP.calYm||months[0];
  const items=itemsOf(t.id);
  const dayInfo={};
  for(let d=0;d<tripDays(t);d++){ const date=dayDate(t,d);
    dayInfo[date]={count:itemsOfDay(t.id,d).length,color:DAY_COLORS[d%DAY_COLORS.length],day:d}; }
  const cy=Number(curYm.slice(0,4)), cm=Number(curYm.slice(5,7));
  const first=new Date(cy,cm-1,1); const dim=new Date(cy,cm,0).getDate();
  const today=todayStr();
  let cells='';
  for(let i=0;i<first.getDay();i++)cells+='<span class="cal-cell" style="visibility:hidden"></span>';
  for(let d2=1;d2<=dim;d2++){ const date=cy+'-'+pad2(cm)+'-'+pad2(d2);
    const info=dayInfo[date];
    const isTrip=date>=t.startDate&&date<=t.endDate;
    const dow=new Date(cy,cm-1,d2).getDay(); const we=dow===0||dow===6;
    let cls='cal-cell'; if(we)cls+=' cal-we';
    if(info&&info.count>0)cls+=' cal-has';
    if(date===today)cls+=' cal-today';
    cells+=`<span class="${cls}" style="${isTrip?'border-color:var(--primary-soft)':''};${info&&info.count?'cursor:pointer':'pointer-events:none'}"
      ${info&&info.count?`data-act="calGoDay" data-day="${info.day}"`:''}>
      <span class="cal-num">${d2}</span>
      ${info&&info.count?`<span class="cal-dot" style="background:${info.color}"></span><span class="cal-cnt">${info.count}</span>`:''}</span>`; }
  const monthNav=months.length>1?`<div class="chips" style="margin-bottom:6px">${months.map(m2=>`<button class="chip ${m2===curYm?'active':''}" data-act="calMonth" data-ym="${m2}">${m2}</button>`).join('')}</div>`:'';
  return `<div class="card" style="padding:10px">
    <div class="card-h" style="margin-bottom:6px"><h3>${I('calendar',15)} ${cy} 年 ${cm} 月</h3><span class="tiny">${esc(t.title)}</span></div>
    ${monthNav}
    <div class="cal-grid">
      ${'一二三四五六日'.split('').map(w2=>'<span class="cal-wd">'+w2+'</span>').join('')}
      ${cells}
    </div>
    <div class="tiny mt8" style="text-align:center">点有数字的日期跳到对应天的时间轴</div></div>`; }

function checkTripOverlaps(){ const act=DB.trips.filter(t=>!t.archived&&tripStatus(t)!=='past');
  for(let a=0;a<act.length;a++)for(let b2=a+1;b2<act.length;b2++){

/* ==================== 回忆收藏馆 · 相簿 / 手账 ==================== */
function memHue(k){ let h=0; for(const c of String(k))h=(h*31+c.charCodeAt(0))>>>0; return DAY_COLORS[h%DAY_COLORS.length]; }
const memCoverKey=id=>'membook_'+id;
const memPhotoKey=k=>'mp_'+encodeURIComponent(k);
const memOrderKey=id=>'mem_order_'+id;
function memBookInit(t){
  const d=(t.destination||'').trim();
  if(d){ const ps=d.split(/[·•]/).map(x=>x.trim()).filter(Boolean);
    return (ps.length>1?ps[ps.length-1]:ps[0]).slice(0,2); }
  return (t.title||'·').slice(0,2); }
function memBooks(){ const out=[];
  for(const t of DB.trips){ if(t.archived)continue; const items=itemsOf(t.id);
    const placeN=(DB.visitedPlaces||[]).filter(v=>v.tripId===t.id).length+items.filter(i=>i.visited).length;
    const jr=DB.journal.filter(j=>j.tripId===t.id);
    out.push({t,places:placeN,journals:jr.length,empty:!placeN&&!jr.length}); }
  return out.sort((a,b)=>{ if(a.empty!==b.empty)return a.empty?1:-1;
    return a.t.startDate<b.t.startDate?1:-1; }); }
/* 册内条目：地点 + 日记混排；顺序可自定义并持久化 */
function memBookItems(tripId){ const t=DB.trips.find(x=>x.id===tripId); if(!t)return null;
  const arr=[];
  for(const vp of (DB.visitedPlaces||[])){ if(vp.tripId!==tripId)continue;
    const d=(vp.dateRange&&vp.dateRange.start)||t.startDate;
    arr.push({key:'p:'+vp.id,kind:'place',date:d,time:'99:99',name:vp.name||'未命名地点',
      sub:vp.category||'',note:'',fb:'',src:'vp',ref:vp}); }
  for(const it of itemsOf(tripId)){ if(!it.visited)continue;
    arr.push({key:'i:'+it.id,kind:'place',date:dayDate(t,it.dayIndex||0),time:it.time||'99:99',
      name:it.title||'未命名条目',sub:it.address||'',note:it.note||'',
      fb:it.photo?'item:'+it.id:'',src:'it',ref:it}); }
  for(const j of DB.journal){ if(j.tripId!==tripId)continue;
    const d=(j.dayIndex!=null)?dayDate(t,j.dayIndex):(fmtDay(j.createdAt)||t.startDate);
    const ph=(j.photos||[]).find(p=>p&&p.id&&!p.live);
    arr.push({key:'d:'+j.id,kind:'diary',date:d,time:'99:99',name:j.title||'无题日记',
      sub:[j.mood,j.weather].filter(Boolean).join(' · '),note:j.content||'',
      fb:ph?'jp_'+ph.id:'',src:'d',ref:j}); }
  arr.sort((a,b)=>{ if(a.date!==b.date)return a.date<b.date?-1:1;
    if(a.kind!==b.kind)return a.kind==='place'?-1:1;
    return (a.time||'99:99')<(b.time||'99:99')?-1:1; });
  const saved=getLS(memOrderKey(tripId),null);
  if(Array.isArray(saved)&&saved.length){
    const pool=new Map(arr.map(x=>[x.key,x])); const out=[];
    for(const k of saved){ const x=pool.get(k); if(x){ out.push(x); pool.delete(k); } }
    for(const x of arr){ if(pool.has(x.key))out.push(x); }
    return {t,items:out}; }
  return {t,items:arr}; }
/* 照片优先级：自定义上传 > 原始照片（条目照片 / 日记首图） */
async function fillMemPhotos(root){
  for(const el of root.querySelectorAll('[data-memph]')){
    const k=el.dataset.memph, fb=el.dataset.memfb||''; let src='';

    if(!src&&fb){
      if(fb.indexOf('item:')===0){ const it=DB.items.find(x=>x.id===fb.slice(5)); src=it&&it.photo||''; }
      else { try{ src=await idbGet(fb)||''; }catch(e){} } }
    if(src){ const img=el.tagName==='IMG'?el:el.querySelector('img');
      if(img){ img.src=src; img.classList.add('ok'); }
      const box=el.closest('.mr-ph'); if(box)box.classList.add('has-photo'); } } }

  const key=localStorage.getItem('ai_key');
  if(!key){ toast('请先在「设置」配置 AI Key（仅存本地）'); return; }
  if(!navigator.onLine){ toast('需要联网'); return; }
  const endpoint=localStorage.getItem('ai_endpoint')||'https://api.openai.com/v1/chat/completions';
  const model=localStorage.getItem('ai_model')||'gpt-4o-mini';
  toast('正在分析行程…');
  const items=itemsOf(t.id).map(x=>({day:x.dayIndex+1,time:x.time,type:x.type,title:x.title,
    cost:x.cost,currency:x.currency,address:x.address,duration:x.duration}));
  const days=tripDays(t); const dates=[]; for(let i2=0;i2<days;i2++)dates.push(dayDate(t,i2));
  const prompt='你是旅行规划专家。分析以下行程数据，给出 3-5 条具体改进建议（时间安排/路线/预算/遗漏项等）。只输出 JSON：{"suggestions":[{"category":"时间安排|路线优化|预算|遗漏建议","text":"具体建议"}]}。\n'+
    '目的地：'+(t.destination||'')+'\n天数：'+days+'\n日期：'+dates[0]+' ~ '+dates[days-1]+'\n条目：'+JSON.stringify(items);
  try{ const r2=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,temperature:0.5,messages:[{role:'system',content:prompt},{role:'user',content:'请分析以上行程'}]})});
    const j=await r2.json();
    const raw=(j.choices[0].message.content||'').replace(/```json|```/g,'').trim();
    const data=JSON.parse(raw);
    const suggestions=(data.suggestions||[]).slice(0,5);
    const rows=suggestions.map(s2=>'<div style="margin-bottom:8px;padding:8px;border-left:3px solid var(--primary);background:var(--card2);border-radius:0 8px 8px 0">'+
      '<b style="font-size:13px;color:var(--primary)">'+esc(s2.category)+'</b>'+
      '<div class="tiny" style="margin-top:2px;line-height:1.6">'+esc(s2.text)+'</div></div>').join('');
    openModal('<h2>AI 行程优化建议</h2><div style="max-height:50dvh;overflow:auto">'+rows+'</div>'+
      '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn small" data-act="closeOverlay">关闭</button></div>');
  }catch(e){ toast('AI 分析失败：'+e.message); } };

/* ==================== 足迹热力图模式 ==================== */
let _heatOn=false,_heatLayer=null;
function applyHeatLayer(){
  const map=window._fpMapIns; if(!map)return false;
  if(_heatLayer){ try{ map.removeLayer(_heatLayer); }catch(e){} _heatLayer=null; }
  if(!_heatOn)return true;
  const pts=(typeof wlPoints==='function'?wlPoints():[]).filter(p=>p.lat!=null);
  if(!pts.length)return true;
  _heatLayer=L.layerGroup();
  for(const p of pts){
    L.circle([p.lat,p.lng],{radius:900,color:'#FF6B6B',weight:1,fillColor:'#FF6B6B',fillOpacity:.22}).addTo(_heatLayer);
    L.circle([p.lat,p.lng],{radius:320,color:'#FFD93D',weight:0,fillColor:'#FFD93D',fillOpacity:.32}).addTo(_heatLayer); }
  _heatLayer.addTo(map);
  return true; }
ACTIONS.fpHeatToggle=()=>{
  _heatOn=!_heatOn;
  const ok=applyHeatLayer();
  const btn=document.querySelector('[data-act="fpHeatToggle"]');
  if(btn){ btn.style.background=_heatOn?'var(--primary-soft)':''; btn.style.color=_heatOn?'var(--primary)':''; }
  if(!ok){ toast('地图还在加载，稍后再点一次'); return; }
  if(_heatOn){ const wrap=document.getElementById('fpMapWrap');
    if(wrap)wrap.scrollIntoView({behavior:'smooth',block:'center'}); }
  toast(_heatOn?'热力已开启：每个到访点在地图上叠一层光圈':'热力已关闭'); };

async function renderAboutStorage(){ const s1=document.querySelector('#aboutStore'); const s2=document.querySelector('#aboutCap');
  if(!s1||!s2)return;
  try{
    const est=await navigator.storage.estimate();
    const usageB=est.usage||0; const quotaB=est.quota||0;
    const usedMB=usageB/1048576; const quotaGB=quotaB/1073741824;
    const pctTxt=quotaB>0?('约 '+Math.max(0.1,Math.round(usageB/quotaB*100000)/1000)+'%'):'—';
    s1.innerHTML=(usedMB>=1?usedMB.toFixed(1)+' MB':Math.round(usageB/1024)+' KB')+' / '+quotaGB.toFixed(2)+' GB（'+pctTxt+'）（已用 / 本机可用配额）';
    const cnt=(DB.items||[]).length;
    const cap=quotaB>0?Math.floor(quotaB/2048):0;
    const capTxt=cap>=10000?(cap/10000).toFixed(0)+' 万':String(cap);
    s2.innerHTML=cnt+' 条 / 约 '+capTxt+' 条（按每条约 2.0 KB 估算）（已用 / 本机可用）';
  }catch(e){ s1.textContent='—'; s2.textContent='—'; } }

/* ==================== PWA 与离线 ==================== */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e;
  if(!localStorage.getItem('a2hs_dismissed'))maybeA2hsGuide(); });
async function initPWA(){ try{
  if(!document.querySelector('link[rel="icon"]')){ const fav=document.createElement('link');
    fav.rel='icon'; fav.type='image/svg+xml'; fav.href=APP_ICON_URI; document.head.appendChild(fav); }
  if(!location.protocol.startsWith('http')){ console.info('file:// 打开：PWA（Manifest/ServiceWorker）不激活，普通功能正常'); return; }
  const icon=APP_ICON_URI;
  const raster=async size=>{ try{ const img=new Image();
      await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=icon; });
      const c=document.createElement('canvas'); c.width=c.height=size;
      c.getContext('2d').drawImage(img,0,0,size,size); return c.toDataURL('image/png'); }catch(e){ return null; } };
  const [p192,p512,p180]=await Promise.all([raster(192),raster(512),raster(180)]);
  const icons=[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}];
  if(p512)icons.unshift({src:p512,sizes:'512x512',type:'image/png',purpose:'any'});
  if(p192)icons.unshift({src:p192,sizes:'192x192',type:'image/png',purpose:'any'});
  const manifest={name:'星轨绘卷',short_name:'星轨绘卷',description:'星轨绘卷 · 单文件本地旅行规划工具',start_url:'.',scope:'.',
    display:'standalone',background_color:'#0E1430',theme_color:'#0E1430',icons};
  const mLink=document.createElement('link'); mLink.rel='manifest';
  mLink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  document.head.appendChild(mLink);
  const aLink=document.createElement('link'); aLink.rel='apple-touch-icon'; aLink.href=p180||icon; document.head.appendChild(aLink);
  if('serviceWorker' in navigator){
    // 离线缓存必须依赖同源 HTTPS 下的 ./sw.js；blob: 脚本 URL 不被 ServiceWorker 规范接受，不做无效兜底
    navigator.serviceWorker.register('./sw.js')
      .then(()=>console.info('ServiceWorker 已注册'))
      .catch(err=>console.warn('离线缓存未启用：请确认 sw.js 与 index.html 在同一目录，且通过 HTTPS 访问',err&&err.message));
  }
 }catch(e){ console.info('PWA 初始化跳过：',e&&e.message); } }
function updatePill(){ let p=$('#netPill');
  if(navigator.onLine){ if(p)p.remove(); return; }
  if(!p){ p=document.createElement('div'); p.id='netPill'; p.className='pill-offline';
    p.innerHTML=I('offline',13)+'<span>离线模式 · 本地数据可用</span>'; document.body.appendChild(p); } }
function maybeA2hsGuide(){ if(localStorage.getItem('a2hs_dismissed'))return;
  if(matchMedia('(display-mode:standalone)').matches||navigator.standalone)return;
  if($('#a2hsCard'))return;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const card=document.createElement('div'); card.id='a2hsCard'; card.className='a2hs-card';
  card.innerHTML=`<div style="flex:1;font-size:13px;line-height:1.5">${isIOS?'在 Safari「分享」菜单中选择「添加到主屏幕」，联网打开一次后即可离线使用。':'添加到主屏幕，联网打开一次后即可离线使用。'}</div>
   <button class="btn tiny primary" id="a2hsGo">${deferredPrompt?'安装':'知道了'}</button>
   <button class="btn tiny" id="a2hsX">关闭</button>`;
  document.body.appendChild(card);
  card.querySelector('#a2hsGo').onclick=()=>{ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; }
    localStorage.setItem('a2hs_dismissed','1'); card.remove(); };
  card.querySelector('#a2hsX').onclick=()=>{ localStorage.setItem('a2hs_dismissed','1'); card.remove(); }; }
