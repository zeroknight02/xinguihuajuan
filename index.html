<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f9f">
<meta name="app-build" content="34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星轨绘卷">
<meta name="description" content="星轨绘卷 · 单文件本地旅行规划工具，离线可用">
<title>星轨绘卷 · 旅行规划</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
:root{
  --radius:16px;--radius-s:11px;
  --ok:#2e8b57;--warn:#c07f2d;--err:#bf5b4d;
  --bar:rgba(255,255,255,.82);
  --deco:none;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  min-height:100dvh;overscroll-behavior-y:none;
}
body::before{content:'';position:fixed;inset:0;z-index:-2;background-image:var(--deco);background-size:cover;background-position:center 0;pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:-3;
  background:radial-gradient(640px 420px at 88% -6%,var(--glow1),transparent 70%),
             radial-gradient(560px 420px at -12% 34%,var(--glow2),transparent 72%),
             linear-gradient(168deg,var(--grad1) 0%,var(--grad2) 48%,var(--bg) 94%);
  pointer-events:none}
body.lock{overflow:hidden}
#app{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
a{color:var(--primary);text-decoration:none}
a.grayed{color:var(--text-sub);opacity:.6;pointer-events:none}
h1,h2,h3{font-weight:650;letter-spacing:.2px}
button{font-family:inherit}
::selection{background:var(--primary-soft)}

/* ============ 顶栏 ============ */
.topbar{position:relative;z-index:60;display:flex;align-items:center;gap:10px;
  padding:calc(18px + env(safe-area-inset-top)) 2px 12px}
.topbar .tb-title{flex:1;min-width:0}
.topbar h1{font-size:25px;line-height:1.22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.topbar .tb-date{font-size:13px;color:var(--text-sub);margin-bottom:3px}
.topbar .tb-sub{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--on-primary);
  font-size:19px;font-weight:700;box-shadow:0 2px 8px var(--shadow)}
.logo.logo-app{padding:0;background:#0E1430;overflow:hidden}
.logo.logo-app svg{width:100%;height:100%;display:block}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid transparent;border-radius:20px;
  box-shadow:0 6px 22px var(--shadow);padding:15px}
.card+.card{margin-top:12px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h h3{font-size:15px;flex:1}
.card-h .h-act{display:flex;gap:6px;align-items:center}
.sub{color:var(--text-sub);font-size:13px}
.tiny{font-size:12px;color:var(--text-sub)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}

.btn{min-height:44px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);
  color:var(--text);font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;
  gap:7px;cursor:pointer;transition:filter .12s}
.btn:active{filter:brightness(.94)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));border-color:transparent;color:var(--on-primary);box-shadow:0 4px 14px var(--shadow)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.danger{color:var(--err)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn.small{min-height:32px;padding:0 11px;font-size:13px;border-radius:9px;gap:5px}
.btn.tiny{min-height:26px;padding:0 8px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text);cursor:pointer;flex:none}
.icon-btn:active{background:var(--primary-soft)}
.icon-btn.small{width:32px;height:32px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:2px 13px;border-radius:99px;
  border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.plain{border-color:transparent;background:var(--primary-soft);color:var(--primary);cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--primary-soft);border:1px solid transparent;border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border:none;background:transparent;border-radius:9px;color:var(--text-sub);
  font-size:14px;cursor:pointer;padding:0 10px;white-space:nowrap}
.seg button.active{background:var(--card);color:var(--primary);font-weight:600;box-shadow:0 1px 3px var(--shadow)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;
  background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.badge.warn{background:rgba(192,127,45,.14);color:var(--warn)}
.badge.err{background:rgba(191,91,77,.14);color:var(--err)}
.badge.ok{background:rgba(46,139,87,.13);color:var(--ok)}
.badge.plain{background:var(--card2);color:var(--text-sub)}

.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .25s}
.progress>i.warn{background:var(--warn)}
.progress>i.err{background:var(--err)}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px var(--shadow);border:none;z-index:40;cursor:pointer}
.fab:active{filter:brightness(.92)}

/* ============ 表单 ============ */
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);background:var(--card2);
  border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;outline:none;min-height:44px;
  box-shadow:0 2px 8px var(--shadow)}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--primary)}
label.f-label{display:block;font-size:13px;color:var(--text-sub);margin:12px 2px 5px}
.f-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}

/* 开关 */
.switch{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);border:none;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--ok)}
.switch.on::after{left:23px}

/* ============ 抽屉 / 弹窗 / 提示 ============ */
#ovl{position:fixed;inset:0;z-index:2000;pointer-events:none}
.leaflet-container{z-index:0!important}
.backdrop{position:absolute;inset:0;background:rgba(20,24,28,.4);pointer-events:auto;
  opacity:0;transition:opacity .18s}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s;box-shadow:0 -8px 30px rgba(0,0,0,.18);pointer-events:auto}
.sheet.show{transform:translateY(0)}
.sheet .grabber{width:40px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 10px}
.sheet h2{font-size:17px;margin:4px 0 2px}
.modal-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:auto}
.modal{background:var(--card);border:1px solid transparent;border-radius:22px;max-width:520px;width:100%;
  max-height:86dvh;overflow:auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25);pointer-events:auto}
.modal h2{font-size:17px;margin-bottom:10px}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:200;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(30,34,38,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:99px;
  max-width:86%;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:toastIn .2s}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid transparent;
  border-left:4px solid var(--primary);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;
  box-shadow:0 4px 14px var(--shadow)}
.banner.warn{border-left-color:var(--warn)}
.banner.err{border-left-color:var(--err)}
.banner .b-txt{flex:1}
.banner .b-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.empty{padding:44px 20px;text-align:center;color:var(--text-sub)}
.empty svg{opacity:.5;margin-bottom:10px}
.empty p{font-size:14px;margin-bottom:14px}

/* 全屏展示（常用语大字） */
.fullview{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 24px calc(40px + env(safe-area-inset-bottom));text-align:center}
.fullview .fv-zh{font-size:34px;font-weight:700;line-height:1.4;margin-bottom:14px}
.fullview .fv-en{font-size:24px;color:var(--primary);font-weight:600;margin-bottom:12px}
.fullview .fv-pron{font-size:17px;color:var(--text-sub);margin-bottom:18px}

/* 键盘提示 */
.kbd-hint{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.kbd-hint span{font-size:12px;color:var(--text-sub)}
kbd{background:var(--card2);border:1px solid var(--card-border);border-bottom-width:2px;border-radius:6px;
  padding:1px 6px;font-size:11px;font-family:inherit;color:var(--text-sub)}

/* 离线胶囊 */
.pill-offline{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:90;
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--on-primary);background:var(--text-sub);
  padding:6px 12px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pill-offline.ok{background:var(--ok)}

/* 响应式 */
@media (max-width:480px){
 .tile.wide{flex-direction:column;align-items:flex-start;gap:8px}
 .tile.wide .cd-acts{width:100%}
 .tile.wide .cd-line3{white-space:nowrap}
}
/* ===== iPad / 平板（≥700px）===== */
@media (min-width:700px){
  #app{max-width:760px;padding:0 28px calc(72px + env(safe-area-inset-bottom))}
  .topbar{padding-top:calc(24px + env(safe-area-inset-top))}
  .topbar h1{font-size:29px}
  .card{padding:17px}
  .card+.card{margin-top:16px}
  .modal{width:600px}
}
/* ===== 桌面网页（≥1080px）===== */
@media (min-width:1080px){
  #app{max-width:920px;padding:0 32px calc(72px + env(safe-area-inset-bottom))}
  .topbar{padding-top:calc(30px + env(safe-area-inset-top))}
  .topbar h1{font-size:32px}
  .card{padding:18px}
  /* 底部抽屉 → 居中浮层 */
  .sheet{left:50%;right:auto;bottom:32px;top:auto;max-width:640px;width:calc(100% - 64px);
    border-radius:24px;transform:translateX(-50%) translateY(36px);opacity:0;
    transition:transform .2s,opacity .2s;box-shadow:0 24px 64px rgba(0,0,0,.22)}
  .sheet.show{transform:translateX(-50%) translateY(0);opacity:1}
  .sheet .grabber{display:none}
  .fab{right:calc(30px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom))}
}
/* ===== 悬停反馈（真实指针设备）===== */
@media (hover:hover){
  .tile,.fcard,.trip-card,.item-card{transition:transform .16s,box-shadow .16s}
  .tile:hover,.fcard:hover,.trip-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px var(--shadow)}
  .btn:hover{filter:brightness(.96)}
  .chip:hover{border-color:var(--primary)}
  .fab:hover{filter:brightness(1.05)}
  .icon-btn:hover{background:var(--primary-soft)}
}
@media (orientation:landscape) and (max-height:520px){
  .topbar{padding-top:calc(6px + env(safe-area-inset-top))}
  .sheet{max-height:94dvh}
  .map-wrap{height:240px}
  .map-wrap.tall{height:300px}
}
</style>
<style>
/* ============ 首页 ============ */
.home-status{display:flex;align-items:center;gap:8px;padding:14px 2px 6px;font-size:13px;color:var(--text-sub)}
.dot-live{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,139,87,.4)}55%{box-shadow:0 0 0 7px rgba(46,139,87,0)}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px}
.tile{background:var(--card);border:1px solid transparent;border-radius:18px;padding:14px 15px;
  box-shadow:0 5px 18px var(--shadow);cursor:pointer;text-align:left}
.tile:active{filter:brightness(.97)}
.tile .t-num{font-size:26px;font-weight:750;color:var(--text);line-height:1.2;font-variant-numeric:tabular-nums}
.tile .t-num small{font-size:13px;font-weight:500;color:var(--text-sub)}
.tile .t-label{font-size:12px;color:var(--text-sub);margin-top:2px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--primary-soft),transparent 65%),var(--card)}
.tile-cd{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(120deg,var(--primary-soft),transparent 75%),var(--card)}
.tile-cd .cd-line1{font-size:15px;font-weight:650;color:var(--text)}
.tile-cd .cd-line2{font-size:13px;color:var(--text-sub)}
.tile-cd .cd-line3{font-size:15px;font-weight:600;color:var(--primary);margin-top:2px;white-space:nowrap}
.tile.wide .cd-info{flex:1;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.fcard{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--card-border);
  border-radius:20px;padding:16px 14px 14px;box-shadow:0 6px 20px var(--shadow);cursor:pointer;text-align:left;color:var(--text);
  overflow:hidden;transition:transform .12s ease}
.fcard::after{content:'';position:absolute;right:-26px;top:-26px;width:86px;height:86px;border-radius:50%;
  background:var(--fc,#3d7ea6);opacity:.10;pointer-events:none}
@supports (background: color-mix(in srgb, red 10%, white)){
  .fcard{background:linear-gradient(155deg,color-mix(in srgb,var(--fc,#3d7ea6) 17%,var(--card)) 0%,color-mix(in srgb,var(--fc,#3d7ea6) 5%,var(--card)) 62%,var(--card) 100%)}
  .fcard::after{background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--fc,#3d7ea6) 45%,transparent),transparent 70%);opacity:.5}
}
.fcard:active{transform:scale(.975)}
.fcard .fc-ico{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--fc,#3d7ea6) 20%,transparent);color:var(--fc,#3d7ea6);position:relative;z-index:1}
@supports not (background: color-mix(in srgb, red 10%, white)){
  .fcard .fc-ico{background:var(--primary-soft);color:var(--primary)}
}
.fcard .fc-name{font-size:15px;font-weight:650;position:relative;z-index:1}
.fcard .fc-sub{font-size:11px;color:var(--text-sub);position:relative;z-index:1;margin-top:-4px}
.mini-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mini-links .chip{min-height:36px}
.data-acts{display:flex;justify-content:space-around;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.data-acts button{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;
  color:var(--text-sub);font-size:11px;cursor:pointer;min-width:60px}
.data-acts button svg{color:var(--text-sub)}

/* 主题切换条 */
.theme-pop{position:absolute;top:calc(58px + env(safe-area-inset-top));right:2px;z-index:80;background:var(--card);
  border:1px solid var(--card-border);border-radius:16px;padding:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);width:236px}
.theme-pop .tp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tp-item{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.tp-sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;position:relative}
.tp-item.cur .tp-sw{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--primary)}
.tp-item .tp-name{font-size:10px;color:var(--text-sub);display:flex;align-items:center;gap:2px}
.tp-item .tp-name svg{width:10px;height:10px;color:var(--primary)}

/* 倒计时卡片预览 */
.cd-preview{width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px var(--shadow)}
.cd-preview img,.cd-preview canvas{width:100%;height:100%;display:block}

/* ============ 行程列表 ============ */
.trip-card{position:relative;display:flex;gap:12px;background:var(--card);border:1px solid transparent;
  border-radius:18px;padding:13px;box-shadow:0 5px 18px var(--shadow);cursor:pointer;overflow:hidden}
.trip-card .tc-cover{width:86px;height:86px;border-radius:12px;flex:none;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.trip-card .tc-cover img{width:100%;height:100%;object-fit:cover}
.trip-card .tc-body{flex:1;min-width:0}
.trip-card h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-card .tc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.trip-card .tc-foot{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text-sub)}
.trip-card .tc-foot .progress{flex:1;height:6px}
.archive-fold{margin-top:14px}
.archive-fold>button{width:100%;background:none;border:1px dashed var(--card-border);border-radius:12px;
  color:var(--text-sub);font-size:13px;min-height:40px;cursor:pointer}

/* ============ 行程详情 / 地铁时间轴 ============ */
.trip-head{padding:6px 2px 10px}
.trip-head h2{font-size:20px;line-height:1.3}
.trip-head .th-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.day-block{margin:18px 0}
.day-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding-left:6px}
.day-head .d-num{font-size:15px;font-weight:700;color:var(--dayc)}
.day-head .d-date{font-size:12px;color:var(--text-sub)}
.day-head .d-cost{margin-left:auto;font-size:12px;color:var(--text-sub);text-align:right}
.day-acts{display:flex;gap:6px;margin:0 0 8px 34px;flex-wrap:wrap}
.metro{position:relative;padding-left:26px}
.metro::before{content:'';position:absolute;left:9px;top:14px;bottom:14px;width:3px;border-radius:99px;
  background:linear-gradient(180deg,var(--dayc),color-mix(in srgb,var(--dayc) 40%,transparent));opacity:.55}
.station{position:relative;margin-bottom:10px}
.station::before{content:'';position:absolute;left:-24px;top:16px;width:13px;height:13px;border-radius:50%;
  background:var(--card);border:3px solid var(--typec,var(--dayc));box-shadow:0 0 0 3px var(--bg)}
.station.is-hotel::before{border-radius:4px}

<script>
'use strict';
/* ==================== 工具函数 ==================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const WD=['日','一','二','三','四','五','六'];
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const parseD=s=>{if(!s)return null;const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const fmtMD=s=>{const d=parseD(s);return d?(d.getMonth()+1)+'月'+d.getDate()+'日':'';};
const fmtYMD=s=>{const d=parseD(s);return d?d.getFullYear()+'.'+pad2(d.getMonth()+1)+'.'+pad2(d.getDate()):'';};
const wdCN=s=>{const d=parseD(s);return d?'周'+WD[d.getDay()]:'';};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
/* 统一日期格式化：兼容 13/10 位时间戳（Number 或数字字符串）与 'YYYY-MM-DD…' 字符串，非法值返回 '' */
const fmtDay=v=>{ if(v==null||v==='')return '';
  const s0=String(v);
  const n=(typeof v==='number')?v:(/^\d{10,13}$/.test(s0)?Number(s0):NaN);
  if(!isNaN(n)&&n>0){ const d=new Date(n); return isNaN(d.getTime())?'':d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  return /^\d{4}-\d{2}-\d{2}/.test(s0)?s0.slice(0,10):''; };
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const nowHM=()=>{const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());};
const toMin=hm=>{if(!hm)return null;const p=hm.split(':').map(Number);return p[0]*60+(p[1]||0);};
const fromMin=m=>pad2(Math.floor(m/60)%24)+':'+pad2(Math.round(m%60));

function drawConstellationBG(x,w,h,seed){
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#0B1026'); g.addColorStop(.55,'#141238'); g.addColorStop(1,'#2A1D52');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  let sd=0; for(const ch of String(seed))sd=(sd*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };
  x.fillStyle='rgba(255,255,255,.5)';
  const tiny=Math.round(w*h/9000);
  for(let i=0;i<tiny;i++){ const px=rnd()*w,py=rnd()*h;
    x.globalAlpha=.2+rnd()*.5; x.beginPath(); x.arc(px,py,rnd()*1.3+.4,0,7); x.fill(); }
  x.globalAlpha=1;
  const stars=[]; const n=Math.max(10,Math.round(w/105));
  for(let i=0;i<n;i++)stars.push({x:rnd()*(w-80)+40,y:rnd()*(h-80)+40,r:rnd()*2.6+2.2});
  x.strokeStyle='rgba(165,195,255,.38)'; x.lineWidth=1.2;
  for(let i=0;i<stars.length;i++){ const a=stars[i];
    const ds=stars.map((b,j)=>({j,d:Math.hypot(a.x-b.x,a.y-b.y)})).filter(o=>o.j!==i).sort((p,q)=>p.d-q.d);
    const links=(i%3===0)?2:1;
    for(let k2=0;k2<links&&k2<ds.length;k2++){ const b=stars[ds[k2].j];
      x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } }
  for(const st of stars){ const g2=x.createRadialGradient(st.x,st.y,0,st.x,st.y,st.r*4.2);
    g2.addColorStop(0,'rgba(255,255,255,.9)'); g2.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g2; x.beginPath(); x.arc(st.x,st.y,st.r*4.2,0,7); x.fill();
    x.fillStyle='#fff'; x.beginPath(); x.arc(st.x,st.y,st.r,0,7); x.fill(); } }

    const fail=()=>{ _idbCool=Date.now()+15000; _idbP=null; done(null); };
    const timer=setTimeout(fail,6000);
  try{ const rq=indexedDB.open('tvlFiles',1);
  rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
  rq.onsuccess=()=>{ clearTimeout(timer); done(rq.result); };

let _geoProv=null;
async function geoProvinces(){ if(_geoProv)return _geoProv;

  _geoProv=j.features||[]; return _geoProv; }
async function geoRegionOf(lat,lng){
  const [glat,glng]=wgs2gcj(lat,lng);
  const provs=await geoProvinces();
  for(const f of provs){ const bb=geoFeatBBox(f);
    if(glng<bb[0]||glng>bb[2]||glat<bb[1]||glat>bb[3])continue;
    if(geoFeatHas(f,glng,glat))return { adcode:f.properties.adcode, name:f.properties.name, level:'province' }; }
  return null; }
async function geoCityOf(provAdcode,lat,lng){
  const [glat,glng]=wgs2gcj(lat,lng);
  const j=await geoFetchJSON('https://geo.datav.aliyun.com/areas_v3/bound/'+provAdcode+'_full.json');
  for(const f of (j.features||[])){ const bb=geoFeatBBox(f);
    if(glng<bb[0]||glng>bb[2]||glat<bb[1]||glat>bb[3])continue;
    if(geoFeatHas(f,glng,glat))return { adcode:f.properties.adcode, name:f.properties.name, level:'city' }; }
  return null; }
async function geoVisitedScan(){
  const out={ provinces:{}, cities:{}, points:[] };
  const pts=[];
  for(const t of DB.trips){ for(const it of itemsOf(t.id)){ if(it.lat!=null)pts.push([it.lat,it.lng]); }
    for(const j2 of DB.journal.filter(j3=>j3.tripId===t.id)){
      for(const ph of (j2.photos||[])){ if(ph.lat!=null)pts.push([ph.lat,ph.lng]); } } }
  for(const v of (DB.visitedPlaces||[])){ if(v.lat!=null)pts.push([v.lat,v.lng]); }
  out.points=pts;
  for(const [lat,lng] of pts){ try{
    const pr=await geoRegionOf(lat,lng); if(!pr)continue;
    out.provinces[pr.adcode]=out.provinces[pr.adcode]||{name:pr.name,count:0};
    out.provinces[pr.adcode].count++;
    const ct=await geoCityOf(pr.adcode,lat,lng);
    if(ct){ out.cities[ct.adcode]=out.cities[ct.adcode]||{name:ct.name,prov:pr.adcode,count:0};
      out.cities[ct.adcode].count++; }
  }catch(e){} }
  return out; }

function dayLoad(t,d){ const its=itemsOfDay(t.id,d); let min=0;

function repositionByTime(item){ const arr=DB.items; const idx=arr.indexOf(item); if(idx<0)return;
  arr.splice(idx,1); let insertAt=arr.length;
  if(item.time){ for(let i=0;i<arr.length;i++){ const o=arr[i];
    if(o.tripId!==item.tripId)continue;
    if((o.dayIndex||0)!==(item.dayIndex||0))continue;
    if(!o.time){ insertAt=i; break; }
    if(toMin(o.time)>toMin(item.time)){ insertAt=i; break; } } }
  arr.splice(insertAt,0,item); }

const navStack=[]; const PAGES={}; const KEYS={}; const ACTIONS={};
let _popBusy=false;

  window.addEventListener('popstate',()=>{ if(_popBusy){_popBusy=false;return;}
    if(navStack.length>1){ navStack.pop(); renderApp(); } }); }
function goTo(page,params={}){ if(navStack.length){ navStack[navStack.length-1].scroll=window.scrollY; }
  navStack.push({page,params,scroll:0}); try{ history.pushState({i:navStack.length},''); }catch(e){} bindHistory(); renderApp(); }
function goBack(){ if(navStack.length<=1){ renderApp(); return; }
  try{ _popBusy=true; history.back(); setTimeout(()=>{ _popBusy=false; },350); }catch(e){ _popBusy=false; }
  navStack.pop(); renderApp(); }
function renderApp(){ closeAllOverlays(true); const top=navStack[navStack.length-1]||{page:'home',params:{},scroll:0};
  const fn=PAGES[top.page]||PAGES.home; let out;
  try{ out=fn(top.params)||{}; }catch(err){ out={html:'<div class="empty">'+I('alert',36)+'<p>页面渲染出错：'+esc(err.message)+'</p></div>'}; }
  $('#app').innerHTML=out.html||'';
  requestAnimationFrame(()=>{ window.scrollTo(0,top.scroll||0); });
  if(out.after) try{ out.after(); }catch(err){ } }

const overlayStack=[];
function _afterOverlayAdd(){ document.body.classList.add('lock'); }
function _afterOverlayRemove(){ if(!overlayStack.length) document.body.classList.remove('lock'); }
function openSheet(html,opts={}){ const w=document.createElement('div'); w.style.cssText='position:absolute;inset:0';
  w.innerHTML=`<div class="backdrop"></div><div class="sheet"><div class="grabber"></div>${html}</div>`;
  w.querySelector('.sheet').style.pointerEvents='auto';
  w.querySelector('.backdrop').style.pointerEvents='auto';

  requestAnimationFrame(()=>{ bd.classList.add('show'); sheet.classList.add('show'); });

    w.style.pointerEvents='none'; setTimeout(()=>{ w.remove(); },230); const i=overlayStack.indexOf(rec); if(i>=0)overlayStack.splice(i,1); _afterOverlayRemove();
    opts.onClose&&opts.onClose(); }, root:w, el:sheet};

  w.innerHTML=`<div class="backdrop"></div><div class="modal-wrap"><div class="modal">${html}</div></div>`;

  overlayStack.push(rec); _afterOverlayAdd(); bd.addEventListener('click',rec.close);

  if(danger) m.el.querySelector('#__cYes').style.cssText='background:var(--err);border-color:var(--err)';

  m.el.querySelector('#__cYes').onclick=()=>{ m.close(); res(true); }; }); }

    setTimeout(()=>t.remove(),320); },ms); }

document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el)return;
  const fn=ACTIONS[el.dataset.act]; if(fn){ try{ fn(el.dataset,el,e); }catch(err){ console.error(err); toast('操作出错：'+err.message); } }
  else { console.warn('缺少动作：',el.dataset.act); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(closeTopOverlay()){ e.preventDefault(); return; }
    const th=KEYS._esc; if(th){ th(); return; } }
  const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;

  if(h&&h[e.key]){ e.preventDefault(); h[e.key](); } });

KEYS._esc=()=>{ const p=$('#themePop'); if(p) p.remove(); };

Object.assign(ACTIONS,{

      <span class="tp-name">${k===cur?I('check',10):''}${t.name}</span></button>`; }).join('')+'</div>';
  btn.closest('.topbar').style.position='relative';
  btn.closest('.topbar').appendChild(pop);
  const off=ev=>{ if(!pop.contains(ev.target)&&ev.target!==btn&&!btn.contains(ev.target)){ closeThemePop(); document.removeEventListener('click',off); } };
  setTimeout(()=>document.addEventListener('click',off),50); }
ACTIONS.themeToggle=(d,el)=>toggleThemePop(el);
ACTIONS.themeSet=d=>{ const k=THEMES[d.theme]?d.theme:'ocean'; applyTheme(k); toast('已切换「'+THEMES[k].name+'」'); renderApp(); };

/* ==================== 首页 ==================== */
function countUnpacked(){ let n=0; for(const pl of DB.packingLists){ const trip=DB.trips.find(t=>t.id===pl.tripId);
  if(!trip||tripStatus(trip)==='past')continue;
  const isParent=id=>pl.categories.some(c=>c.items.some(x=>x.parent===id));
  for(const c of pl.categories) for(const it of c.items){ if(!it.packed&&!isParent(it.id))n++; } } return n; }
function nextUpcoming(){ return DB.trips.filter(t=>!t.archived&&tripStatus(t)==='upcoming')
  .sort((a,b)=>a.startDate<b.startDate?-1:1)[0]; }
function remainText(trip){ const target=parseD(trip.startDate).getTime();
  let diff=target-Date.now(); if(diff<0)diff=0;
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000);
  return d>0?`${d} 天 ${h} 小时`:`${h} 小时 ${Math.floor(diff%3600000/60000)} 分钟`; }

/* 首页 · 即将出发行程相关的灵感（按目的地/标题关键词匹配，灵感池页面本身不变） */
function tripInspirationMatch(trip){ if(!trip)return [];
  const kw=String((trip.destination||'')+' '+(trip.title||''))
    .split(/[·、，,。\s（）()\-—]+/).map(x=>x.trim())
    .filter(x=>x.length>=2&&!['中国','自治区','特别行政区'].includes(x));
  if(!kw.length)return DB.inspirations.slice();
  return DB.inspirations.filter(ins=>{
    const hay=[ins.title,ins.address,ins.note,(ins.tags||[]).join(' ')].join(' ');
    return kw.some(k=>hay.includes(k)); }); }

function pageHome(){ const active=DB.trips.filter(t=>!t.archived&&tripStatus(t)!=='past');
  const next=nextUpcoming();
  const td=todayStr(); const dateLine=Number(td.slice(0,4))+'年'+Number(td.slice(5,7))+'月'+Number(td.slice(8,10))+'日 · '+wdCN(td);
  const budgetSum=active.reduce((s,t)=>s+(Number(t.budget)||0),0);
  const tiles=`
  ${next?`<div class="tile tile-cd wide">
    <div class="cd-info">
      <div class="cd-line1">${esc(next.destination||next.title)}</div>
      <div class="cd-line2">${fmtMD(next.startDate)} ${wdCN(next.startDate)} 出发</div>
      <div class="cd-line3">剩余 ${remainText(next)}</div></div>
  </div>`
  :`<div class="tile wide" data-act="goPage" data-page="trips" role="button" tabindex="0">
    <div class="cd-info"><div class="t-num">—<small> 待出发</small></div>
    <div class="t-label">暂无待出发行程，去创建一个吧</div></div></div>`}
  <button class="tile" data-act="goPage" data-page="budgetAll"><div class="t-num">${fmtMoney(budgetSum,'CNY').replace('¥','')}</div><div class="t-label">总预算（CNY）</div></button>
  <button class="tile" data-act="goPage" data-page="packing"><div class="t-num">${countUnpacked()}<small> 项</small></div><div class="t-label">未打包</div></button>`;
  const cards=[
   ['trips','行程规划','map','#4a86c8',`${active.length} 个进行中`],
   ['budgetAll','预算管理','wallet','#c08a2d',fmtMoney(budgetSum,'CNY')],
   ['packing','打包清单','pack','#3f9a86',`${countUnpacked()} 项未打包`],
   ['journal','旅行日记','edit','#c4715a',`${DB.journal.length} 篇`],
   ['footprints','足迹回顾','flag','#5f8f6a',`${DB.visitedPlaces.length} 个到访点`],
   ['inspirations','灵感池','bulb','#8a72b8',`${DB.inspirations.length} 条待安排`]];
  return { html: topbar('星轨绘卷','',
    `<button class="icon-btn" data-act="themeToggle" aria-label="切换主题" style="background:var(--primary-soft);color:var(--primary)">${I('palette',21)}</button>`,
    {noBack:true, logo:APP_ICON, date:dateLine})
   +getBanners().map(b=>`<div class="banner ${b.cls||''}" style="margin-top:12px">${I('alert',18)}<div class="b-txt">${b.msg}</div></div>`).join('')
   +`<div class="home-status"><span class="dot-live"></span>行程 ${active.length} 个 · 条目 ${DB.items.length} 条 · 打包 ${DB.packingLists.reduce((s,p)=>s+p.categories.reduce((a,c)=>a+c.items.length,0),0)} 项 · 灵感 ${DB.inspirations.length} 条</div>
   <div class="tiles">${tiles}</div>
   <div class="fgrid">${cards.map(([p,n,ic,fc,sub])=>`<button class="fcard" style="--fc:${fc}" data-act="goPage" data-page="${p}"${p==='inspirations'&&next?` data-params='{"sort":"trip","cat":"全部"}'`:''}>
     <span class="fc-ico">${I(ic,21)}</span><span class="fc-name">${n}</span><span class="fc-sub">${sub}</span></button>`).join('')}</div>
   <button class="mem-hero" data-act="goPage" data-page="memories">
     <span class="mh-ico">${I('bookmark',22)}</span>
     <span class="mh-tx"><b>回忆收藏馆</b><small>一个行程一本相簿 · 照片 + 日记手账 · 共 ${DB.trips.length} 本</small></span>
     <span class="mh-ar">${I('chevR',18)}</span>
   </button>
   <div class="mini-links">
     <button class="chip" data-act="goPage" data-page="guide" style="border-color:var(--primary);color:var(--primary)">${I('bulb',15)} 功能导览（先看我）</button>
     <button class="chip" data-act="globalSearch">${I('search',15)} 全局搜索</button>
     <button class="chip" data-act="goPage" data-page="phrasebook">${I('globe',15)} 常用语手册</button>
   </div>
   <div class="data-acts">
     <button data-act="goPage" data-page="settings">${I('gear',21)}<span>设置</span></button>
     <button data-act="goPage" data-page="backup">${I('archive',21)}<span>数据与备份</span></button>
     <button data-act="doExportBackup">${I('down',21)}<span>导出备份</span></button>
   </div>` };
}

</script>
<script>
/* ==================== 行程列表 ==================== */
let showArchived=false;
function packingProgress(tripId){ const pl=DB.packingLists.find(p=>p.tripId===tripId); if(!pl)return null;
  let done=0,total=0;
  const isParent=id=>pl.categories.some(c=>c.items.some(x=>x.parent===id));
  for(const c of pl.categories)for(const it of c.items){ if(isParent(it.id))continue;
    total++; if(it.packed)done++; }
  return {done,total}; }
function statusBadge(t){ if(t.archived)return '<span class="badge plain">已归档</span>';
  const st=tripStatus(t);
  if(st==='ongoing')return '<span class="badge ok">进行中</span>';
  if(st==='past')return '<span class="badge plain">已结束</span>';
  const n=diffDays(todayStr(),t.startDate);
  return `<span class="badge">${n===0?'今天出发':(n===1?'明天出发':`还有 ${n} 天`)}</span>`; }
function tripCard(t){ const its=itemsOf(t.id); const spend=tripSpend(t.id).total;
  const pk=packingProgress(t.id); const usePct=t.budget?clamp(Math.round(spend/t.budget*100),0,100):0;
  const useCls=usePct>=100?'err':usePct>=80?'warn':'';
  return `<div class="trip-card" data-act="openTrip" data-id="${t.id}">
   <div class="tc-cover" style="background:linear-gradient(135deg,${t.coverColor||'#3d7ea6'},var(--accent))" data-cover-trip="${t.id}">${esc((t.destination||t.title).slice(-3))}</div>
   <div class="tc-body">
     <div class="row"><h3 style="flex:1">${esc(t.title)}</h3>${statusBadge(t)}</div>
     <div class="tc-meta">
       <span class="badge plain">${I('pin',11)}${esc(t.destination||'未设置')}</span>
       <span class="badge plain">${fmtMD(t.startDate)}–${fmtMD(t.endDate)}</span>
       <span class="badge plain">${its.length} 项</span>
     </div>
     <div class="tc-foot">
       ${pk&&pk.total?`<span>${I('pack',13)} ${pk.done}/${pk.total}</span>`:''}
       ${t.budget?`<span>${fmtMoney(spend,t.currency)}</span><div class="progress"><i class="${useCls}" style="width:${usePct}%"></i></div>`:''}
       <button class="icon-btn small" data-act="moreTrip" data-id="${t.id}" style="margin-left:auto">${I('dots',18)}</button>
     </div>
   </div></div>`; }
function pageTrips(){ const active=DB.trips.filter(t=>!t.archived&&tripStatus(t)!=='past').sort((a,b)=>a.startDate<b.startDate?-1:1);
  const archived=DB.trips.filter(t=>t.archived||tripStatus(t)==='past').sort((a,b)=>b.startDate<a.startDate?-1:1);
  return { html: topbar('行程规划','',
    `${isDesktop()&&navigator.onLine?`<button class="btn small soft" data-act="aiTripForm">${I('sparkle',14)}AI 草稿</button>`:''}
     <button class="btn small soft" data-act="tripTplNew">${I('bookmark',14)}从模板建</button>
     <button class="btn small primary" data-act="newTrip">${I('plus',14)}新建</button>`)
   +(active.length?active.map(tripCard).join(''):`<div class="empty">${I('map',40)}<p>还没有行程</p><button class="btn primary" data-act="newTrip">${I('plus',16)}新建行程</button></div>`)
   +(archived.length?`<div class="archive-fold"><button data-act="toggleArch">${I(showArchived?'chevD':'chevR',14)} 已结束 / 归档行程（${archived.length}）· 按日期自动归档</button>
     ${showArchived?archived.map(tripCard).join(''):''}</div>`:''), after:fillIdbImages };
}
ACTIONS.toggleArch=()=>{ showArchived=!showArchived; renderApp(); };
ACTIONS.openTrip=d=>goTo('tripDetail',{tripId:d.id,tab:'timeline'});
ACTIONS.newTrip=()=>tripForm(null);
ACTIONS.editTrip=d=>tripForm(DB.trips.find(t=>t.id===d.id));

function tripForm(trip){ const isNew=!trip; const t=trip||{title:'',destination:'',startDate:addDays(todayStr(),14),
  endDate:addDays(todayStr(),17),currency:'CNY',budget:'',coverColor:DAY_COLORS[Math.floor(Math.random()*6)],notes:'',companions:[]};
  let coverPhotoData=null;
  const sh=openSheet(`<h2>${isNew?'新建行程':'编辑行程'}</h2>
   <label class="f-label">行程名称</label><input id="tfTitle" value="${esc(t.title)}" placeholder="例如：京都红叶慢行">
   <label class="f-label">目的地</label><input id="tfDest" value="${esc(t.destination)}" placeholder="例如：日本 · 京都">
   <div class="f-2">
    <div><label class="f-label">开始日期</label><input id="tfStart" type="date" value="${t.startDate}"></div>
    <div><label class="f-label">结束日期</label><input id="tfEnd" type="date" value="${t.endDate}"></div></div>
   <label class="f-label">币种（按目的地自动判定，可手动修改）</label><select id="tfCur">${CURS.map(c=>`<option ${c===(t.currency||'CNY')?'selected':''}>${c}</option>`).join('')}</select>
   <label class="f-label">封面照片（可选，自动压缩）</label><input type="file" id="tfCoverPhoto" accept="image/*" style="display:none">
   <div class="row mt8" style="align-items:flex-start">${t.coverImage?'':`<div id="tfCoverPrev" style="width:120px;height:68px;border-radius:10px;background:linear-gradient(135deg,${t.coverColor||'#3d7ea6'},var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px">${esc((t.destination||t.title||'').slice(-3))}</div>`}
     <div style="flex:1"><button class="btn small" id="tfCoverBtn">${I('image',13)}${t.coverImage||coverPhotoData?'更换照片':'选照片'}</button>
       </div></div>
   <label class="f-label">备注 / 注意事项</label><textarea id="tfNotes" rows="2">${esc(t.notes||'')}</textarea>
   <div class="f-2">
    <div><label class="f-label">出发信息（留空则自动推断）</label><input id="tfDepart" value="${esc(t.departInfo||'')}" placeholder="如：萧山 4/29 23:30 MU2568"></div>
    <div><label class="f-label">返程信息</label><input id="tfReturn" value="${esc(t.returnInfo||'')}" placeholder="如：宝安 5/5 21:55"></div></div>
   <label class="f-label">同行者（逗号分隔）</label><input id="tfComp" value="${esc((t.companions||[]).join('，'))}" placeholder="例：小林，阿伦">
   <div class="row" style="margin-top:16px;gap:10px">
     <button class="btn block" data-act="closeOverlay">取消</button>
     <button class="btn primary block" id="tfSave">${I('check',16)}保存</button></div>`);
  if(!isNew&&t.coverImage){ idbGet('cover_'+t.id).then(d=>{ if(d){ coverPhotoData=d;
    const prev=sh.root.querySelector('#tfCoverPrev');
    if(prev)prev.outerHTML=`<img id="tfCoverPrev" src="${d}" style="width:120px;height:68px;object-fit:cover;border-radius:10px">`; } }); }
  sh.root.querySelector('#tfCoverBtn').onclick=()=>sh.root.querySelector('#tfCoverPhoto').click();
  let tfCurTouched=false;
  sh.root.querySelector('#tfCur').addEventListener('change',()=>{ tfCurTouched=true; });
  sh.root.querySelector('#tfDest').addEventListener('input',debounce(()=>{
    const det=detectCurrency(sh.root.querySelector('#tfDest').value);
    if(det&&!tfCurTouched){ const sel=sh.root.querySelector('#tfCur'); if(sel&&sel.value!==det)sel.value=det; } },400));
  sh.root.querySelector('#tfCoverPhoto').onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    compressImage(f,800,0.72).then(data=>{ coverPhotoData=data;
      const prev=sh.root.querySelector('#tfCoverPrev');
      if(prev)prev.outerHTML=`<img id="tfCoverPrev" src="${data}" style="width:120px;height:68px;object-fit:cover;border-radius:10px">`; }); };
  sh.root.querySelector('#tfSave').onclick=()=>{
    const title=sh.root.querySelector('#tfTitle').value.trim();
    const dest=sh.root.querySelector('#tfDest').value.trim();
    const s=sh.root.querySelector('#tfStart').value, e=sh.root.querySelector('#tfEnd').value;
    if(!title){ toast('请填写行程名称'); return; }
    if(!s||!e||e<s){ toast('日期范围无效'); return; }
    const data={title,destination:dest,startDate:s,endDate:e,currency:sh.root.querySelector('#tfCur').value,
      budget:Number(t.budget)||0,coverColor:t.coverColor||DAY_COLORS[Math.floor(Math.random()*6)],
      notes:sh.root.querySelector('#tfNotes').value.trim(),
      departInfo:sh.root.querySelector('#tfDepart').value.trim(),
      returnInfo:sh.root.querySelector('#tfReturn').value.trim(),
      companions:sh.root.querySelector('#tfComp').value.split(/[，,]/).map(x=>x.trim()).filter(Boolean)};
    if(isNew){ DB.trips.push(Object.assign({id:'trp_'+uid(),coverImage:null,archived:false,createdAt:Date.now(),updatedAt:Date.now()},data));
      DB.packingLists.push({tripId:DB.trips[DB.trips.length-1].id,categories:defaultPackingCategories()}); }
    else Object.assign(trip,data,{updatedAt:Date.now()});
    save('trips'); save('packingLists');
    const savedTrip=isNew?DB.trips[DB.trips.length-1]:trip;
    if(coverPhotoData){ idbPut('cover_'+savedTrip.id,coverPhotoData); savedTrip.coverImage=true; save('trips'); }
    sh.close();
    if(isNew) toast('已创建行程'); renderApp(); };
}
function defaultPackingCategories(){ const mk=t=>({id:'pk_'+uid(),text:t,packed:false,assignee:'',note:''});
  return ['证件','衣物','电子','洗漱','药品','其他'].map(n=>({name:n,items:[]}));
}

/* 行程更多菜单 */
ACTIONS.moreTrip=d=>{ const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  const m=openModal(`<h2>${esc(t.title)}</h2>
   <div style="display:flex;flex-direction:column;gap:2px">
    ${[['editTrip',I('edit',17),'编辑行程信息'],['dupTrip',I('copy',17),'复制行程'],['genCover',I('image',17),'生成封面图'],
      ['exportTripJson',I('file',17),'导出 JSON'],
      ['exportTripICS',I('calendar',17),'导出日历（.ics）'],['printTrip',I('file',17),'打印 / 存为 PDF'],
      ['bookingImport',I('up',17),'粘贴预订导入'],
      ['docWallet',I('archive',17),'证件包'],['tripAlbum',I('image',17),'行程相册'],
      ['tripTplSave',I('bookmark',17),'存为行程模板'],
      ['aiTripAdvice',I('sparkle',17),'AI 优化建议'],
      ['tripRate',I('star',17),'行程评分'],
      [t.archived?'unarchiveTrip':'archiveTrip',I('archive',17),t.archived?'取消归档':'归档行程'],
      ['delTrip',I('trash',17),'删除行程']].filter(Boolean).map(([a,ic,label])=>
      `<button class="btn ghost" style="justify-content:flex-start" data-act="${a}" data-id="${t.id}">${ic}<span style="color:var(--text)">${label}</span></button>`).join('')}
   </div>`); };
ACTIONS.archiveTrip=async d=>{ closeTopOverlay(); const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  t.archived=true; save('trips'); toast('已归档'); renderApp(); };
ACTIONS.unarchiveTrip=async d=>{ closeTopOverlay(); const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  t.archived=false; save('trips'); toast('已取消归档'); renderApp(); };
ACTIONS.delTrip=async d=>{ closeTopOverlay(); const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  if(!await confirmDlg(`确定删除「${esc(t.title)}」？将同时删除其条目、账目、日记等数据。`,{okText:'删除',danger:true}))return;
  DB.trips=DB.trips.filter(x=>x.id!==d.id);
  DB.items=DB.items.filter(i=>i.tripId!==d.id); DB.expenses=DB.expenses.filter(i=>i.tripId!==d.id);
  DB.journal=DB.journal.filter(i=>i.tripId!==d.id); DB.packingLists=DB.packingLists.filter(i=>i.tripId!==d.id);
  DB.visitedPlaces=DB.visitedPlaces.filter(i=>i.tripId!==d.id);
  save('trips');save('items');save('expenses');save('journal');save('packingLists');save('visitedPlaces');
  toast('已删除'); if(navStack[navStack.length-1].page==='tripDetail')goBack(); else renderApp(); };
ACTIONS.dupTrip=d=>{ closeTopOverlay(); const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  const m=openModal(`<h2>复制行程</h2><p class="sub">选择复制方式</p>
   <div class="mode-radio">
     <label class="active"><input type="radio" name="dupMode" value="full" checked>完整复制<br><small class="tiny">含费用、预订号、备注</small></label>
     <label><input type="radio" name="dupMode" value="structure">只复制结构<br><small class="tiny">清空费用与预订信息</small></label></div>
   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:8px">
     <button class="btn small" data-act="closeOverlay">取消</button><button class="btn primary small" id="dupGo">复制</button></div>`);
  m.el.querySelectorAll('.mode-radio label').forEach(l=>l.onclick=()=>{ m.el.querySelectorAll('.mode-radio label').forEach(x=>x.classList.remove('active')); l.classList.add('active'); l.querySelector('input').checked=true; });
  m.el.querySelector('#dupGo').onclick=()=>{
    const mode=m.el.querySelector('input[name=dupMode]:checked').value; m.close();
    const nt=Object.assign({},t,{id:'trp_'+uid(),title:t.title+' 副本',archived:false,coverImage:null,createdAt:Date.now(),updatedAt:Date.now()});
    DB.trips.push(nt);
    for(const it of itemsOf(t.id)){ const ni=Object.assign({},it,{id:'itm_'+uid(),tripId:nt.id,attachments:[],visited:false});
      if(mode==='structure'){ ni.cost=0; ni.currency=''; ni.bookingRef=''; ni.note=''; ni.includedInAnotherTicket=false; }
      DB.items.push(ni); }
    save('trips'); save('items'); toast('已复制行程'); renderApp(); }; };

/* 封面生成 */
ACTIONS.genCover=d=>{ const t=DB.trips.find(x=>x.id===d.id); if(!t)return; closeTopOverlay();
  const m=openModal(`<h2>生成封面</h2><div class="cd-preview" style="aspect-ratio:16/9" id="cvPrev"></div>
   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
     <button class="btn small" data-act="coverSave" data-id="${t.id}">${I('down',14)}保存图片</button>
     <button class="btn primary small" data-act="coverSet" data-id="${t.id}">${I('check',14)}设为卡片封面</button></div>`);
  const cv=coverCanvas(t,1600,900); cv.style.width='100%'; cv.style.height='auto'; cv.id='coverCv';
  m.el.querySelector('#cvPrev').appendChild(cv); };
function coverCanvas(t,w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const th=THEMES[themeKey()].vars; const base=t.coverColor||th['--primary'];
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,base); g.addColorStop(1,shade(base,-24));
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(255,255,255,.4)'; x.lineWidth=Math.max(1,w/800);
  for(let i=0;i<4;i++){ x.beginPath(); x.moveTo(-20,h*(0.62+i*0.07));
    x.quadraticCurveTo(w*0.25,h*(0.52+i*0.07),w*0.5,h*(0.6+i*0.07));
    x.quadraticCurveTo(w*0.75,h*(0.68+i*0.07),w+20,h*(0.56+i*0.07)); x.stroke(); }
  x.strokeStyle='rgba(255,255,255,.3)';
  x.beginPath(); x.arc(w*0.82,h*0.24,h*0.14,0,Math.PI*2); x.stroke();
  x.beginPath(); x.arc(w*0.82,h*0.24,h*0.1,0,Math.PI*2); x.stroke();
  x.textAlign='left'; x.fillStyle='#fff';
  x.font=`700 ${h*0.11}px -apple-system,'PingFang SC',sans-serif`;

function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); }

function renderTimeline(t){
  const days=tripDays(t);
  const conflicts=computeConflicts(t);
  let html='';
  if(conflicts.length) html+=`<div style="margin:6px 0">`+conflicts.map(cf=>{
    let acts='';
    if(cf.type==='overlap'||cf.type==='tight'){
      acts=`<button class="btn tiny" data-act="conflictFixTime" data-key="${cf.key}">调整后一个时间</button>

    if(cf.type==='lodging'){ acts=`<button class="btn tiny" data-act="conflictAddHotel" data-trip="${t.id}" data-day="${cf.d}">添加住宿</button>`; }
    acts+=`<button class="btn tiny ghost" data-act="conflictIgnore" data-key="${cf.key}">忽略</button>`;
    return `<div class="conflict-bar">${I('alert',17)}<div class="cb-msg">${esc(cf.msg)}
      <div class="cb-acts">${acts}</div></div></div>`; }).join('')+'</div>';
  for(let d=0;d<days;d++){ html+=renderDay(t,d); }
  html+=`<div class="kbd-hint"><span><kbd>N</kbd> 新建条目</span><span><kbd>Esc</kbd> 关闭抽屉</span></div>`;
  return html;
}
function renderDay(t,d){

   <div class="day-head"><span class="d-num">第 ${d+1} 天</span><span class="d-date">${fmtMD(date)} ${wdCN(date)}</span>

     <button class="icon-btn small" data-act="dayNote" data-trip="${t.id}" data-day="${d}" title="逐日备注" style="width:28px;height:28px">${I('note',14)}</button></div>
   ${dnote?`<div class="tiny" style="margin:-6px 0 8px 6px;color:var(--primary)">${I('note',11)} ${esc(dnote)}</div>`:''}

     <button class="btn tiny" data-act="goPage" data-page="budgetTrip" data-params='{"tripId":"${t.id}"}'>${I('wallet',13)}记一笔</button>

}
function itemCardHtml(t,it,dayColor){

  if(it.attachments&&it.attachments.length)tags.push(`<span class="badge plain">${I('file',10)} ${it.attachments.length} 附件</span>`);
  if(it.duration&&!['hotel'].includes(it.type))tags.push(`<span class="badge plain">${it.duration} 分钟</span>`);
  if(it.subs&&it.subs.length)tags.push(`<span class="badge plain">${I('plus',10)}子项 ${it.subs.length}</span>`);
  const subsRows=(it.subs||[]).map((s,si)=>{ const stm=TYPE_META[s.type]||TYPE_META.other;
    return `<div class="sub-row" data-act="editSub" data-id="${it.id}" data-si="${si}" role="button">
      <span class="type-dot" style="--typec:${stm.c}"></span>
      ${s.photo?`<img class="sub-photo" src="${s.photo}" alt="">`:''}
      <div class="sub-main"><b>${esc(s.title||'（未命名）')}</b>
        ${s.time?`<span class="tiny"> ${s.time}</span>`:''}
        ${s.cost?`<span class="tiny"> ${fmtMoney(s.cost,s.currency||t.currency)}</span>`:''}

        ${s.note?`<div class="tiny" style="color:var(--text-sub)">${esc(s.note)}</div>`:''}</div>
      <button class="btn tiny danger" data-act="delSub" data-id="${it.id}" data-si="${si}" aria-label="删除子项">${I('trash',12)}</button></div>`; }).join('');
  const subsBlock=`<div class="subs-block">
    <div class="sub-hd tiny">${I('plus',12)} 子项${(it.subs||[]).length?'（'+it.subs.length+'）':''}</div>

      <div class="ic-title">${it.time?`<span class="time-tag">${it.time}</span>`:''}${esc(it.title)}
        ${it.cost?`<span class="tiny" style="font-weight:500"> ${fmtMoney(it.cost,it.currency||t.currency)}</span>`:''}</div>

        ${it.url?`<a class="btn tiny" href="${esc(it.url)}" target="_blank" rel="noopener">${I('globe',12)}预订页</a>`:''}
      </div>

}
function navUrl(it){ const lat=it.lat,lng=it.lng;
  if((localStorage.getItem('nav_provider')||'amap')==='google')
    return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  return `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(it.title||'')}`;
}
function transportSeg(a,b){ const km=haversine(a,b); if(km==null||km<0.08)return '';
  const online=navigator.onLine;
  if(km>80){ return `<div class="segline"><span>长途交通 · 直线约 ${fmtKm(km)}</span>
    ${online?`<a class="btn tiny navlink" href="${navUrl(b)}" target="_blank" rel="noopener" style="margin-left:auto">${I('nav',11)}导航</a>`
      :`<span class="tiny" style="margin-left:auto">导航需联网</span>`}</div>`; }
  const tm=transitMin(km); const walkLike=km<=5;
  const mode=(ic,label,min)=>`<span class="sg-m">${I(ic,11)}${label} ${min}分</span>`;
  return `<div class="segline"><span>${fmtKm(km)}</span><span class="sg-modes">
    ${walkLike?mode('user','步行',tm.walk)+mode('refresh','骑行',tm.bike):''}${mode('send','驾车',tm.drive)}${mode('train','公交',tm.transit)}</span>
    ${online?`<a class="btn tiny navlink" href="${navUrl(b)}" target="_blank" rel="noopener" style="margin-left:auto">${I('nav',11)}导航</a>`
      :`<span class="tiny" style="margin-left:auto" title="离线时导航不可用">导航需联网</span>`}</div>`;
}

/* 冲突检测 */
function computeConflicts(t){ const list=[]; const ignored=getLS('conflict_ignore_'+t.id,[]);
  for(let d=0;d<tripDays(t);d++){ const its=itemsOfDay(t.id,d);
    for(let i=0;i<its.length-1;i++){ const a=its[i],b=its[i+1];
      const ta=toMin(a.time),tb=toMin(b.time); if(ta==null||tb==null)continue;
      const da=Number(a.duration)||60;
      if(tb<ta+da){ const key='ov:'+d+':'+b.id;
        if(!ignored.includes(key)) list.push({key,type:'overlap',d,b,msg:`${a.time}「${a.title}」与 ${b.time}「${b.title}」时间重叠`});
        continue; }
      const km=haversine(a,b);
      if(km!=null&&km>0.3&&km<=2){ const walk=transitMin(km).walk; const gap=tb-(ta+da);
        if(gap>=0&&gap<walk){ const key='tg:'+d+':'+b.id;
          if(!ignored.includes(key)) list.push({key,type:'tight',d,b,msg:`「${a.title}」→「${b.title}」步行约 ${walk} 分钟，但只间隔 ${gap} 分钟`}); } } }
    if(d<tripDays(t)-1&&!its.some(x=>x.type==='hotel')){ const key='lg:'+d;
      if(!ignored.includes(key)) list.push({key,type:'lodging',d,msg:`第 ${d+1} 天跨夜但未安排住宿`}); } }
  return list; }
function findConflict(key){ const t=curTrip(); const cfs=computeConflicts(t); return cfs.find(c=>c.key===key); }
function curTrip(){ const p=navStack[navStack.length-1].params; return DB.trips.find(x=>x.id===p.tripId); }
ACTIONS.conflictIgnore=d=>{ const t=curTrip(); if(!t)return;
  const arr=getLS('conflict_ignore_'+t.id,[]); if(!arr.includes(d.key))arr.push(d.key);
  setLS('conflict_ignore_'+t.id,arr); renderApp(); };
ACTIONS.conflictFixTime=d=>{ const cf=findConflict(d.key); if(!cf)return; const b=cf.b;
  const a=itemsOfDay(curTrip().id,cf.d).find(x=>x.id===(cf.b.id)); const list=itemsOfDay(curTrip().id,cf.d);
  const idx=list.indexOf(b); const prev=list[idx-1]; if(!prev)return;
  const prevEnd=toMin(prev.time)+(Number(prev.duration)||60);
  const km=haversine(prev,b); const walk=km!=null?transitMin(km).walk:15;
  b.time=fromMin(prevEnd+walk+5); repositionByTime(b); save('items'); toast('已调整「'+b.title+'」至 '+b.time); renderApp(); };
ACTIONS.conflictMoveNext=d=>{ const cf=findConflict(d.key); if(!cf)return; const t=curTrip();
  const b=DB.items.find(x=>x.id===cf.b.id); if(!b)return;
  if(cf.d+1>=tripDays(t)){ toast('已是最后一天，无法后移'); return; }
  b.dayIndex=cf.d+1; b.time=b.time||'09:00'; repositionByTime(b); save('items'); toast('已移到下一天'); renderApp(); };
ACTIONS.conflictAddHotel=d=>itemTypeForm(DB.trips.find(x=>x.id===d.tripId),Number(d.day),null,{type:'hotel'});

/* 拖拽（桌面 HTML5 DnD + 手机长按 touch） */
function enableItemDrag(t){ let dragId=null;
  $$('#app .item-card').forEach(card=>{
    card.addEventListener('click', e => {
      if (e.target.closest('button,a,.ic-grip,[data-act],input,label')) return;
      card.classList.toggle('expanded');
    });
    card.addEventListener('dragstart',e=>{ dragId=card.dataset.item; card.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain',dragId); e.dataTransfer.effectAllowed='move'; }catch(err){} });
    card.addEventListener('dragend',()=>{ card.classList.remove('dragging'); clearDragMarks(); });
    card.addEventListener('dragover',e=>{ if(!dragId)return; e.preventDefault(); clearPeerMarks(card);
      const r=card.getBoundingClientRect(); const before=e.clientY<r.top+r.height/2;
      card.classList.add(before?'drag-before':'drag-after'); });
    card.addEventListener('drop',e=>{ if(!dragId)return; e.preventDefault();
      const r=card.getBoundingClientRect(); const before=e.clientY<r.top+r.height/2;
      doMove(t,dragId,card.dataset.item,before); });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-before','drag-after'));
  });
  $$('#app .metro').forEach(m=>{ m.addEventListener('dragover',e=>{ if(dragId)e.preventDefault(); });
    m.addEventListener('drop',e=>{ if(!dragId)return; e.preventDefault(); appendToDay(t,dragId,Number(m.closest('.day-block').dataset.day)); }); });
  // 触摸长按
  $$('#app .item-card').forEach(card=>{
    let timer=null,startX=0,startY=0,touching=false;
    const grip=card.querySelector('.ic-grip');
    const start=e=>{ if(dragId)return; const t0=e.touches[0]; startX=t0.clientX; startY=t0.clientY; touching=true;
      timer=setTimeout(()=>{ dragId=card.dataset.item; card.classList.add('dragging');
        if(navigator.vibrate)try{navigator.vibrate(10);}catch(err){}
        document.body.classList.add('drag-noscroll'); },grip&&e.target===grip?60:480); };
    const move=e=>{ if(!touching)return; const t0=e.touches[0];
      if(!dragId&&(Math.abs(t0.clientX-startX)>12||Math.abs(t0.clientY-startY)>12)){ clearTimeout(timer); touching=false; return; }
      if(dragId){ e.preventDefault(); card.style.transform=`translate(${t0.clientX-startX}px,${t0.clientY-startY}px)`;
        const el=document.elementFromPoint(t0.clientX,t0.clientY); const target=el&&el.closest&&el.closest('.item-card:not(.dragging)');

/* 自然语言解析（本地正则，不依赖 AI） */
function nlParse(text){ if(!text||!text.trim())return null; let s=text.trim();
  const out={time:null,cost:null,currency:null,type:null,title:s};
  const pm=s.match(/(\d{1,2})(?::([0-5]\d))?\s*([ap])\.?m\.?/i);
  const t2=s.match(/(\d{1,2}):([0-5]\d)/);
  const t1=s.match(/(\d{1,2})[点:：时](\d{1,2})?分?/);
  if(pm){ let h=Number(pm[1]); if(/p/i.test(pm[3])&&h<12)h+=12; if(/a/i.test(pm[3])&&h===12)h=0;
    out.time=pad2(clamp(h,0,23))+':'+(pm[2]||'00'); }
  else if(t2){ out.time=pad2(clamp(Number(t2[1]),0,23))+':'+t2[2]; }
  else if(t1){ let h=clamp(Number(t1[1]),0,23); const m=t1[2]?pad2(clamp(Number(t1[2]),0,59)):'00'; out.time=pad2(h)+':'+m; }
  const c1=s.match(/[¥￥]\s*(\d+(?:\.\d+)?)/); const c2=s.match(/(\d+(?:\.\d+)?)\s*(?:元|块)/);
  const c3=s.match(/\$\s*(\d+(?:\.\d+)?)/); const c4=s.match(/(\d+(?:\.\d+)?)\s*(yen|jpy)/i);
  if(c1){ out.cost=Number(c1[1]); out.currency='CNY'; }
  else if(c2){ out.cost=Number(c2[1]); out.currency='CNY'; }
  else if(c3){ out.cost=Number(c3[1]); out.currency='USD'; }
  else if(c4){ out.cost=Number(c4[1]); out.currency='JPY'; }
  const typeMap=[[/拉面|面馆|米饭|食堂|餐厅|晚饭|午餐|早餐|brunch|dinner|lunch|ramen|sushi|咖哩|咖喱|寿司|烤肉|火锅|咖啡|cafe|coffee/i,'food'],
   [/寺|神社|博物馆|公园|塔|美术馆|城墙|古迹|博物馆|shrine|temple|museum|景区|楼|广场/i,'sight'],
   [/酒店|民宿|旅馆|hotel|check\s?in|入住|airbnb/i,'hotel'],
   [/机场|车站|火车|航班|高铁|地铁|巴士|bus|train|flight|飞机/i,'transport'],
   [/购物|商场|免税|药妆|shop|mall|超市/i,'shopping'],
   [/温泉|演出|展览|体验|活动|游船|索道|ticket|onsen/i,'activity']];
  for(const [re,ty] of typeMap){ if(re.test(s)){ out.type=ty; break; } }
  let title=s;
  if(pm)title=title.replace(pm[0],''); else if(t2)title=title.replace(t2[0],''); else if(t1)title=title.replace(t1[0],'');
  for(const c of [c1,c2,c3,c4]) if(c)title=title.replace(c[0],'');
  // 仅剥离英文类型词（词边界），中文类型词保留在标题里
  for(const [re] of typeMap){ const en=re.source.split('|').filter(w=>/^[a-z%\\s'?]+$/i.test(w)).join('|');
    if(en)title=title.replace(new RegExp('\\b(?:'+en+')\\b','gi'),''); }
  title=title.replace(/[\s,，。·\-—–]+/g,' ').trim();
  if(title)out.title=title; else out.title=s.replace(/[\d:：点分¥￥$元块apm.\s-]/gi,'').trim()||s;
  return out; }

/* ==================== 路线优化（最近邻 + 2-opt） ==================== */
function optimizeDayOrder(t,d){ const its=itemsOfDay(t.id,d).filter(x=>x.lat!=null&&x.lng!=null);
  if(its.length<3)return null;
  const fixed=new Set(its.filter(x=>x.locked||x.type==='hotel').map(x=>x.id));
  const dist=(a,b)=>haversine(a,b)||0;
  const total=s=>{ let v=0; for(let i=0;i<s.length-1;i++)v+=dist(s[i],s[i+1]); return v; };
  const out=[]; const queue=its.slice();
  while(queue.length){ const it=queue.shift();
    if(fixed.has(it.id)){ out.push(it); continue; }
    const run=[it]; while(queue.length&&!fixed.has(queue[0].id))run.push(queue.shift());
    const nextFixed=queue[0]||null;
    let cur=out.length?out[out.length-1]:null; const rest=run.slice();
    while(rest.length){ let bi=0,bd=Infinity;
      for(let k=0;k<rest.length;k++){ const dd=(cur?dist(cur,rest[k]):0)+(nextFixed?dist(rest[k],nextFixed):0);
        if(dd<bd){bd=dd;bi=k;} }
      out.push(rest.splice(bi,1)[0]); cur=out[out.length-1]; } }
  let improved=true,guard=0;
  while(improved&&guard++<60){ improved=false;
    for(let a=1;a<out.length-2;a++){ if(fixed.has(out[a].id))continue;
      for(let b=a;b<out.length-1;b++){ if(fixed.has(out[b].id))continue; if(fixed.has(out[b+1].id))continue;
        const delta=dist(out[a-1],out[b])+dist(out[a],out[b+1])-dist(out[a-1],out[a])-dist(out[b],out[b+1]);
        if(delta<-1e-9){ const seg=out.splice(a,b-a+1).reverse(); out.splice(a,0,...seg); improved=true; } } } }
  return {order:out,before:total(its),after:total(out),fixed}; }

<script>
/* ==================== 地图视图 ==================== */
const LEAFLET={css:'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',js:'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'};
/* 底图瓦片：OSM 德镜像为主，失败自动降级 OSM 主源 → Esri；瓦片自动缓存到 IDB（LRU 上限），断网可看已浏览区域 */
const TILE_LRU_MAX=800;
function tileLruTouch(key){ let l=getLS('tile_lru',[]); l=l.filter(k=>k!==key); l.push(key);
  while(l.length>TILE_LRU_MAX){ const old=l.shift(); idbDel('tl_'+old); } setLS('tile_lru',l); }
function gcjPair(lat,lng){ try{ if(getLS('map_basemap','intl')==='gaode')return wgs2gcj(lat,lng); }catch(e){} return [lat,lng]; }
function mapTileLayer(map){
  const G='https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';
  const useGaode=(function(){ try{ return getLS('map_basemap','intl')==='gaode'; }catch(e){ return false; } })();
  const srcs=useGaode?[
    {u:G,o:{attribution:'© 高德地图',maxZoom:18,subdomains:'1234'}} ]:[
    {u:'https://tile.openstreetmap.de/{z}/{x}/{y}.png',o:{attribution:'© OpenStreetMap (de)',maxZoom:19}},
    {u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',o:{attribution:'© OpenStreetMap',maxZoom:19}},
    {u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',o:{attribution:'Tiles © Esri',maxZoom:19}} ];
  let idx=0, lyr=null;
  if(!mapTileLayer._cls)mapTileLayer._cls=L.TileLayer.extend({
    createTile(coords,done){ const tile=document.createElement('img'); tile.alt='';
      const key=coords.z+'_'+coords.x+'_'+coords.y;
      idbGet('tl_'+key).then(cached=>{ if(cached){ tile.src=cached; setTimeout(()=>done(null,tile),0); return; }
        tile.onload=()=>{ done(null,tile);
          fetch(tile.src).then(r=>r.blob()).then(b=>{ const fr=new FileReader();
            fr.onload=()=>{ idbPut('tl_'+key,fr.result); tileLruTouch(key); }; fr.readAsDataURL(b); }).catch(()=>{}); };
        tile.onerror=()=>done(new Error('tile'),tile);
        tile.src=this.getTileUrl(coords); });
      return tile; } });
  const use=()=>{ if(lyr)map.removeLayer(lyr); let adv=false;
    lyr=new mapTileLayer._cls(srcs[idx].u,Object.assign({maxZoom:19},srcs[idx].o)).addTo(map);
    lyr.on('tileerror',()=>{ if(!adv&&idx<srcs.length-1){ adv=true; idx++; use(); } });
  };
  use(); return lyr;
}

   ${listHtml||`<div class="empty">${I('pin',36)}<p>还没有带坐标的条目，编辑条目时可在「快速添加」后手动补充坐标</p></div>`}`;
