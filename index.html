async function initMapTab(t){
  const wrap=$('#mapWrap'), el=$('#mapEl'); if(!wrap||!el)return;
  const points=[]; for(let d=0;d<tripDays(t);d++) itemsOfDay(t.id,d).forEach(x=>{ if(x.lat!=null)points.push(x); });
  if(!points.length){ wrap.innerHTML=`<div class="map-fallback">${I('pin',32)}<p>暂无带坐标的条目</p></div>`; return; }
  if(!navigator.onLine){ toast('离线模式：仅显示已缓存的地图区域'); }
  try{
    await Promise.all([loadCssOnce(LEAFLET.css),loadScriptOnce(LEAFLET.js)]);
    if(typeof L==='undefined')throw new Error('Leaflet 未加载');
    const map=L.map('mapEl',{zoomControl:true});
    mapTileLayer(map);
    const bounds=[];
    for(let d=0;d<tripDays(t);d++){ const its=itemsOfDay(t.id,d).filter(x=>x.lat!=null); if(!its.length)continue;
      const color=DAY_COLORS[d%DAY_COLORS.length];
      const line=its.map(x=>[x.lat,x.lng]); if(line.length>1)
        L.polyline(line,{color,dashArray:'6 8',weight:2.5,opacity:.7}).addTo(map);
      its.forEach((x,i)=>{ bounds.push([x.lat,x.lng]);
        const icon=L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50%;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
        L.marker([x.lat,x.lng],{icon}).addTo(map).bindPopup(`<b>${esc(x.title)}</b><br><span style="font-size:12px">${esc(x.address||'')}</span>`); }); }
    if(bounds.length)map.fitBounds(bounds,{padding:[28,28]});
  }catch(e){ wrap.innerHTML=`<div class="map-fallback">${I('offline',32)}<p>地图组件加载失败（${esc(e.message)}）<br>请检查网络后重试，或使用下方列表</p></div>`; }
}
/* ==================== 探索模式 ==================== */
ACTIONS.exploreOpen=d=>{ const t=DB.trips.find(x=>x.id===d.trip); if(!t)return;
  const days=Array.from({length:tripDays(t)},(_,i)=>i); const openModalRef=openModal(`<h2>探索周边</h2>
   <p class="sub">以某一天第一个有坐标的条目为中心，列出 3 km 内的灵感池与已有条目（纯本地计算，离线可用）。</p>
   <div class="chips" id="exDays">${days.map(dd=>`<button class="chip" data-d="${dd}">第 ${dd+1} 天</button>`).join('')}</div>
   <div id="exList"></div>
   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn small" data-act="closeOverlay">关闭</button></div>`);
  const listEl=openModalRef.el.querySelector('#exList');
  const renderDay=dd=>{ openModalRef.el.querySelectorAll('#exDays .chip').forEach(c=>c.classList.toggle('active',Number(c.dataset.d)===dd));
    const anchor=itemsOfDay(t.id,dd).find(x=>x.lat!=null);
    if(!anchor){ listEl.innerHTML='<div class="empty"><p>这一天没有带坐标的条目</p></div>'; return; }
    const rows=[];
    for(const it of itemsOf(t.id)){ if(it.lat==null||it.id===anchor.id)continue;
      const km=haversine(anchor,it); if(km==null||km>3)continue; rows.push({km,type:'item',data:it}); }
    for(const ins of DB.inspirations){ if(ins.lat==null)continue;
      const km=haversine(anchor,ins); if(km==null||km>3)continue; rows.push({km,type:'ins',data:ins}); }
    rows.sort((a,b)=>a.km-b.km);
    listEl.innerHTML=rows.length?rows.map(r=>`<div class="explore-item">
      <span class="type-dot" style="--typec:${r.type==='item'?(TYPE_META[r.data.type]||TYPE_META.other).c:'var(--accent)'}"></span>
      <div style="flex:1;min-width:0"><div>${esc(r.data.title)}</div>
        <div class="tiny">${r.type==='item'?'行程条目':'灵感池'} · ${esc(r.data.address||r.data.note||'')}</div></div>
      <span class="ex-dist">${fmtKm(r.km)}</span>
      ${r.type==='ins'?`<button class="btn tiny soft" data-act="exploreAdd" data-id="${r.data.id}" data-trip="${t.id}" data-day="${dd}">加入当天</button>`
        :`<button class="btn tiny" data-act="editItem" data-id="${r.data.id}">详情</button>`}</div>`).join('')
      :'<div class="empty"><p>3 km 内暂无本地灵感或条目</p></div>'; };
  openModalRef.el.querySelectorAll('#exDays .chip').forEach(c=>c.onclick=()=>renderDay(Number(c.dataset.d)));
  const first=days.findIndex(dd=>itemsOfDay(t.id,dd).some(x=>x.lat!=null));
  renderDay(first>=0?first:0); };
ACTIONS.exploreAdd=d=>{ const ins=DB.inspirations.find(x=>x.id===d.id); const t=DB.trips.find(x=>x.id===d.trip);
  if(!ins||!t)return; const ni={id:'itm_'+uid(),tripId:t.id,dayIndex:Number(d.day),time:'',type:'sight',
    title:ins.title,note:ins.note||'',cost:0,currency:'',address:ins.address||'',lat:ins.lat,lng:ins.lng,
    duration:0,bookingRef:'',attachments:[],visited:false,locked:false,includedInAnotherTicket:false};
  DB.items.push(ni); repositionByTime(ni); save('items');
  toast(`已加入第 ${Number(d.day)+1} 天`); closeTopOverlay(); };
</script>
<script>
/* ==================== 预算总览 ==================== */
function pageBudgetAll(){ const trips=DB.trips.filter(t=>!t.archived);
  let totB=0,totS=0,over=0; const rows=trips.map(t=>{ const sp=tripSpend(t.id).total;
    totB+=Number(t.budget)||0; totS+=sp; if(t.budget&&sp>t.budget)over++;
    const pct=t.budget?clamp(Math.round(sp/t.budget*100),0,100):0;
    const cls=pct>=100?'err':pct>=80?'warn':'';
    return `<div class="trip-card" data-act="goPage" data-page="budgetTrip" data-params='{"tripId":"${t.id}"}'>
      <div class="tc-cover" style="background:linear-gradient(135deg,${t.coverColor||'#3d7ea6'},var(--accent))">${I('wallet',26)}</div>
      <div class="tc-body"><div class="row"><h3 style="flex:1">${esc(t.title)}</h3>
        ${t.budget&&sp>t.budget?'<span class="badge err">超支</span>':''}</div>
      <div class="tiny mt8 row"><span>${fmtMoney(sp,t.currency)} / ${t.budget?fmtMoney(t.budget,t.currency):'未设预算'}</span></div>
      ${t.budget?`<div class="progress mt8"><i class="${cls}" style="width:${pct}%"></i></div>`:''}
    </div></div>`; }).join('');
  return { html: topbar('预算管理','')
   +(()=>{ const past=DB.trips.filter(t=>tripStatus(t)==='past');
      if(!past.length)return '';
      const byYear={}; for(const t of past){ const y=t.startDate.slice(0,4);
        byYear[y]=(byYear[y]||0)+toCur(tripSpend(t.id).total,t.currency,'CNY'); }
      const mx=Math.max(...Object.values(byYear),1);
      return `<div class="card"><div class="card-h"><h3>年度花费</h3><span class="tiny">已结束行程</span></div>
       ${Object.entries(byYear).sort().map(([y,v])=>`<div class="row" style="padding:3px 0"><b style="width:44px;font-size:14px">${y}</b>
         <div style="flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:${clamp(v/mx*100,2,100)}%;background:var(--primary);border-radius:99px"></i></div>
         <span class="tiny" style="width:110px;text-align:right;font-variant-numeric:tabular-nums">${fmtMoney(v,'CNY')}</span></div>`).join('')}</div>`; })()
   +cashWalletCard()
   +`<div class="card"><div class="bud-nums">
      <div class="bn"><b>${fmtMoney(totB,'CNY').replace('¥','')}</b><span>总预算</span></div>
      <div class="bn"><b>${fmtMoney(totS,'CNY').replace('¥','')}</b><span>总花费</span></div>
      <div class="bn"><b style="color:${over?'var(--err)':'var(--ok)'}">${over}</b><span>超支行程</span></div></div></div>
   ${rows||`<div class="empty">${I('wallet',40)}<p>暂无行程</p></div>`}` };
}

/* ==================== 单行程预算 ==================== */
function pageBudgetTrip(params){ const t=DB.trips.find(x=>x.id===params.tripId);
  if(!t)return {html:topbar('预算')+'<div class="empty"><p>行程不存在</p></div>'};
  const sp=tripSpend(t.id); const budget=Number(t.budget)||0;
  const pct=budget?clamp(Math.round(sp.total/budget*100),0,100):0;
  const cls=pct>=100?'err':pct>=80?'warn':'';
  const exps=DB.expenses.filter(e=>e.tripId===t.id).sort((a,b)=>a.date<b.date?1:-1);
  const people=['我',...(t.companions||[])];
  const caps=getLS('caps_'+t.id,{});
  const cats={...sp.byCat};
  for(const c of Object.keys(caps)) if(!(c in cats))cats[c]=0;
  const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([name,amt])=>{
    const cap=Number(caps[name])||0; const p=sp.total?Math.round(amt/sp.total*100):0;
    return `<div class="cat-row"><span class="cr-name">${esc(name)}</span>
      <span class="cr-bar"><i style="width:${clamp(p,2,100)}%"></i></span>
      <span class="cr-amt">${fmtMoney(amt,t.currency)}${cap?`<small>预算 ${fmtMoney(cap,t.currency)} · 差 ${fmtMoney(cap-amt,t.currency)}</small>`:`<small>${p}%</small>`}</span></div>`; }).join('');
  const curUsed={};
  for(const it of DB.items)if(it.tripId===t.id&&it.cost&&it.currency&&it.currency!==t.currency)
    curUsed[it.currency]=(curUsed[it.currency]||0)+Number(it.cost);
  for(const e of exps)if(e.currency&&e.currency!==t.currency&&e.amount)
    curUsed[e.currency]=(curUsed[e.currency]||0)+Number(e.amount);
  const curRows=Object.entries(curUsed).map(([c,a])=>
    `<div class="tiny row">${CUR_SYM[c]||c} ${a.toLocaleString()} <span class="spacer"></span>≈ ${fmtMoney(toCur(a,c,t.currency),t.currency)}（手动汇率）</div>`).join('');
  const perPerson=people.length?sp.total/people.length:sp.total;
  const expRows=exps.map(e=>`<div class="exp-row ${e.includedInAnotherTicket?'inc':''}">
    <div class="er-main"><div>${esc(e.title)} ${e.includedInAnotherTicket?'<span class="badge warn">含在另一张票</span>':''}</div>
      <div class="tiny">${e.date||''} · ${esc(e.category||'其他')} · ${esc(e.paidBy||'')} 付${(e.sharedBy||[]).length>1?` · ${esc((e.sharedBy||[]).join('/'))} 分摊`:''}${e.note?' · '+esc(e.note):''}</div></div>
    <span class="er-amt">${fmtMoney(e.amount,e.currency||t.currency)}</span>
    <button class="icon-btn small" data-act="expenseMore" data-id="${e.id}" data-trip="${t.id}">${I('dots',16)}</button></div>`).join('');
  return { html: topbar(esc(t.title)+' · 预算',`${esc(t.destination||'')} · ${t.currency}`)
   +`<div class="card"><div class="row"><b>预算条</b><span class="spacer"></span>
      <button class="btn tiny" data-act="capsEdit" data-trip="${t.id}">${I('edit',12)}分类上限</button></div>
     <div class="progress bud-bar mt8"><i class="${cls}" style="width:${budget?pct:0}%"></i></div>
     <div class="bud-nums">
      <div class="bn"><b>${fmtMoney(budget,t.currency)}</b><span>总预算</span></div>
      <div class="bn"><b>${fmtMoney(sp.total,t.currency)}</b><span>已花费</span></div>
      <div class="bn"><b style="color:${budget&&sp.total>budget?'var(--err)':'var(--ok)'}">${fmtMoney(budget-sp.total,t.currency)}</b><span>剩余</span></div></div>
     <div class="tiny mt8" style="text-align:center">人均成本 ${fmtMoney(perPerson,t.currency)}（按 ${people.length} 人）</div></div>
   <div class="card"><div class="card-h"><h3>计划 vs 实际</h3><span class="tiny">估算=条目费用合计 · 实际=已记账</span></div>
    ${(()=>{ const planCost=itemsOf(t.id).reduce((a2,i2)=>a2+toCur(Number(i2.cost)||0,i2.currency,t.currency),0);
      const planItems=itemsOf(t.id).length;
      const doneItems=itemsOf(t.id).filter(i2=>i2.visited).length;
      const actItems=DB.expenses.filter(e2=>e2.tripId===t.id).length;
      const planDays=tripDays(t), usedDays=new Set(DB.expenses.filter(e2=>e2.tripId===t.id).map(e2=>e2.date)).size;
      const rows=[['花费',fmtMoney(Math.round(planCost),t.currency),fmtMoney(Math.round(sp.total),t.currency)],
        ['日均花费',fmtMoney(Math.round(planCost/planDays),t.currency),fmtMoney(Math.round(sp.total/planDays),t.currency)],
        ['条目/记录',planItems+' 个',actItems+' 笔'],
        ['地点打卡','—',doneItems+' / '+planItems]];
      return rows.map(([k2,p2,a2])=>`<div class="row" style="padding:5px 0;border-bottom:1px dashed var(--line)">
        <span class="tiny" style="width:70px;flex:none;color:var(--text-sub)">${k2}</span>
        <span style="flex:1">${p2}</span><span class="tiny" style="width:14px;color:var(--text-sub)">→</span>
        <span style="flex:1;font-weight:600">${a2}</span></div>`).join('')
        +`<div class="tiny mt8">计划条目费用合计 ${fmtMoney(Math.round(planCost),t.currency)}（估算），实际记账 ${fmtMoney(Math.round(sp.total),t.currency)}，偏离 ${planCost?Math.round((sp.total-planCost)/planCost*100):0}%</div>`; })()}</div>
   <div class="card"><div class="card-h"><h3>每日花费</h3><span class="tiny">日均预算 ${budget?fmtMoney(Math.round(budget/tripDays(t)*100)/100,t.currency):'未设'}</span></div>
    ${(()=>{ const bars=[]; for(let d=0;d<tripDays(t);d++)bars.push({d,c:dayCost(t,d)});
      const mx=Math.max(...bars.map(x=>x.c),1); const dAvg=sp.total/tripDays(t);
      const dBudget=budget?budget/tripDays(t):0;
      return bars.map(x=>{ const over=dBudget&&x.c>dBudget;
        return `<div class="row" style="padding:3px 0"><span class="tiny" style="width:46px;flex:none">D${x.d+1}</span>
        <div style="flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:${clamp(x.c/mx*100,2,100)}%;background:${over?'var(--err)':'var(--primary)'};border-radius:99px"></i></div>
        <span class="tiny" style="width:92px;text-align:right;font-variant-numeric:tabular-nums">${fmtMoney(x.c,t.currency)}${over?' ⚠':''}</span></div>`; }).join('')
        +`<div class="tiny mt8">日均花费 ${fmtMoney(Math.round(dAvg*100)/100,t.currency)}${budget?` · 超日均预算天数 ${bars.filter(x=>dBudget&&x.c>dBudget).length}`:''}</div>`; })()}</div>
   <div class="card"><div class="card-h"><h3>分类聚合（估算 vs 实际）</h3></div>
     <canvas id="catPie" style="width:100%;max-width:340px;display:block;margin:0 auto 8px"></canvas>
     ${catRows||'<div class="empty"><p>暂无费用记录</p></div>'}</div>
   ${curRows?`<div class="card"><div class="card-h"><h3>多币种（手动汇率）</h3><button class="btn tiny" data-act="fxEdit">${I('gear',12)}汇率</button></div>${curRows}</div>`:''}
   <div class="card"><div class="card-h"><h3>快速记一笔</h3>
     <div class="h-act"><button class="btn small primary" data-act="expenseForm" data-trip="${t.id}">${I('plus',13)}记一笔</button></div></div>
     ${expRows||'<div class="empty"><p>还没有记账，点「记一笔」开始</p></div>'}
     <details style="margin-top:10px"><summary class="sub" style="cursor:pointer">多人分摊结算</summary>
       <div style="margin-top:8px">${splitSettle(t,exps,people)}</div></details></div>
` ,
  after:()=>{ if(params.quick){ const t2=DB.trips.find(x=>x.id===params.tripId); if(t2)expenseEditForm(t2,null); }
    const pc=document.querySelector('#catPie');
    if(pc){ const entries=Object.entries(sp.byCat).filter(([k2,v2])=>v2>0).sort((a2,b2)=>b2[1]-a2[1]);
      if(entries.length){ const total=entries.reduce((a2,e2)=>a2+e2[1],0);
        const dpr=window.devicePixelRatio||1; const w=280,h=150;
        pc.width=w*dpr; pc.height=h*dpr;
        const x=pc.getContext('2d'); x.scale(dpr,dpr);
        const cx=w/2,cy=h/2,R=52,r=32;
        const cols=['#5B8DB8','#E8A87C','#7FB6A4','#C96F4A','#B08BBF','#D9C25A','#8FC1D9'];
        let a0=-Math.PI/2;
        entries.forEach(([k2,v2],i2)=>{ const ang=v2/total*Math.PI*2;
          x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,R,a0,a0+ang); x.closePath();
          x.fillStyle=cols[i2%cols.length]; x.fill(); a0+=ang; });
        x.globalCompositeOperation='destination-out';
        x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
        x.globalCompositeOperation='source-over';
        let ly=8;
        entries.slice(0,6).forEach(([k2,v2],i2)=>{ x.fillStyle=cols[i2%cols.length]; x.fillRect(w-108,ly+3,9,9);
          x.fillStyle='#666'; x.font='11px -apple-system,sans-serif'; x.textAlign='left';
          x.fillText(k2+' '+Math.round(v2/total*100)+'%',w-94,ly+11); ly+=18; }); } } } };
}
function splitSettle(t,exps,people){ const nets={}; people.forEach(p=>nets[p]=0);
  for(const e of exps){ if(e.includedInAnotherTicket)continue;
    const base=toCur(Number(e.amount)||0,e.currency,t.currency);
    const shObj=(e.shares&&Object.keys(e.shares).length)?e.shares:null;
    if(shObj){ const tot=Object.values(shObj).reduce((a,b)=>a+Number(b||0),0)||1;
      for(const [p,w] of Object.entries(shObj)){ const part=base*Number(w)/tot;
        if(p in nets)nets[p]-=part; else nets[p]=-part; } }
    else{ const sharers=(e.sharedBy&&e.sharedBy.length)?e.sharedBy:people;
      const share=base/sharers.length;
      sharers.forEach(p=>{ if(p in nets)nets[p]-=share; else nets[p]=(nets[p]||0)-share; }); }
    const payer=e.paidBy||'我'; nets[payer]=(payer in nets?nets[payer]:0)+base; }
  const rows=Object.entries(nets).filter(([,v])=>Math.abs(v)>=0.5)
    .map(([p,v])=>`<div class="split-net"><span>${esc(p)}</span><b style="color:${v>=0?'var(--ok)':'var(--err)'}">${v>=0?'收':'付'} ${fmtMoney(Math.abs(v),t.currency)}</b></div>`).join('');
  if(!rows)return '<div class="tiny">暂无需结算的差额</div>';
  const pos=Object.entries(nets).filter(([,v])=>v>0.5).sort((a,b)=>b[1]-a[1]);
  const neg=Object.entries(nets).filter(([,v])=>v<-0.5).sort((a,b)=>a[1]-b[1]);
  let sug='',i=0,j=0;
  while(i<neg.length&&j<pos.length){ const amt=Math.min(-neg[i][1],pos[j][1]);
    sug+=`<div class="tiny">${esc(neg[i][0])} → ${esc(pos[j][0])}：${fmtMoney(amt,t.currency)}</div>`;
    neg[i]=[neg[i][0],neg[i][1]+amt]; pos[j]=[pos[j][0],pos[j][1]-amt];
    if(Math.abs(neg[i][1])<0.5)i++; if(Math.abs(pos[j][1])<0.5)j++; }
  return rows+(sug?`<div class="mt8 sub">结算建议</div>`+sug:''); }
</script>
<script>
/* ==================== 预算动作 ==================== */
ACTIONS.expenseForm=d=>{ const t=DB.trips.find(x=>x.id===d.trip); if(!t)return; expenseEditForm(t,null); };
ACTIONS.expenseMore=d=>{ const e=DB.expenses.find(x=>x.id===d.id); if(!e)return; const t=DB.trips.find(x=>x.id===d.trip);
  const m=openModal(`<h2 style="font-size:16px">${esc(e.title)}</h2>
   <div style="display:flex;flex-direction:column;gap:2px">
    <button class="btn ghost" style="justify-content:flex-start" data-act="expenseEdit" data-id="${e.id}">${I('edit',16)}<span style="color:var(--text)">编辑</span></button>
    <button class="btn ghost" style="justify-content:flex-start" data-act="expenseToggleInc" data-id="${e.id}">${I('check',16)}<span style="color:var(--text)">切换「含在另一张票」</span></button>
    <button class="btn ghost" style="justify-content:flex-start" data-act="expenseDel" data-id="${e.id}">${I('trash',16)}<span style="color:var(--err)">删除</span></button></div>`); };
ACTIONS.expenseEdit=d=>{ closeTopOverlay(); const e=DB.expenses.find(x=>x.id===d.id);
  const t=DB.trips.find(x=>x.id===e.tripId); expenseEditForm(t,e); };
ACTIONS.expenseToggleInc=d=>{ const e=DB.expenses.find(x=>x.id===d.id); e.includedInAnotherTicket=!e.includedInAnotherTicket;
  save('expenses'); closeTopOverlay(); renderApp(); toast(e.includedInAnotherTicket?'已标记为不计入总额':'已计入总额'); };
ACTIONS.expenseDel=async d=>{ closeTopOverlay(); if(!await confirmDlg('删除这笔费用？',{okText:'删除',danger:true}))return;
  DB.expenses=DB.expenses.filter(x=>x.id!==d.id); save('expenses'); renderApp(); toast('已删除'); };
function expenseEditForm(t,e){ const isNew=!e;
  const people=['我',...(t.companions||[])];
  const cats=['餐饮','交通','住宿','门票','购物','活动','其他'];
  e=e||{tripId:t.id,title:'',amount:'',currency:t.currency,paidBy:'我',sharedBy:people.slice(),date:todayStr(),category:'餐饮',note:'',includedInAnotherTicket:false};
  const sh=openSheet(`<h2>${isNew?'快速记一笔':'编辑费用'}</h2>
   <label class="f-label">名目</label><input id="exTitle" value="${esc(e.title)}" placeholder="例如：晚餐 / 门票 / 打车">
   <div class="f-3">
    <div><label class="f-label">金额</label><input id="exAmt" type="number" inputmode="decimal" value="${esc(e.amount||'')}"></div>
    <div><label class="f-label">币种</label><select id="exCur">${CURS.map(c=>`<option ${c===(e.currency||t.currency)?'selected':''}>${c}</option>`).join('')}</select></div>
    <div><label class="f-label">分类</label><select id="exCat">${cats.map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('')}</select></div></div>
   <div class="tiny mt8" id="exConv"></div>
   <div class="f-2">
    <div><label class="f-label">日期</label><input id="exDate" type="date" value="${e.date||todayStr()}"></div>
    <div><label class="f-label">谁付的</label><select id="exPaid">${people.map(p=>`<option ${p===e.paidBy?'selected':''}>${p}</option>`).join('')}</select></div></div>
   <label class="f-label">参与分摊</label><div class="row wrap" id="exShare">${people.map(p=>`<button type="button" class="chip ${(e.sharedBy||[]).includes(p)?'active':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
   <div id="exSharesBox" style="display:none"></div>
   <label class="f-label">备注</label><input id="exNote" value="${esc(e.note||'')}">
   <label class="chip mt12" style="min-height:40px"><input type="checkbox" id="exInc" ${e.includedInAnotherTicket?'checked':''} style="width:15px;height:15px"> 含在另一张票中（不计入总额）</label>
   <div class="row" style="margin-top:16px;gap:10px">
     <button class="btn block" data-act="closeOverlay">取消</button>
     <button class="btn primary block" id="exSave">${I('check',16)}保存</button></div>`);
  let shared=(e.sharedBy||[]).slice();
  let shareMode=(e.shares&&Object.keys(e.shares).length)?'w':'eq';
  const sharesBox=sh.root.querySelector('#exSharesBox');
  const renderShares=()=>{ sharesBox.style.display=(shared.length>1&&shareMode==='w')?'':'none';
    if(!(shared.length>1&&shareMode==='w'))return;
    sharesBox.innerHTML='<label class="f-label">各人份数（如 2 份 : 1 份）</label><div class="row wrap">'+shared.map(p=>
      `<span class="chip">${esc(p)} <input type="number" min="1" step="1" data-w="${esc(p)}" value="${(e.shares&&e.shares[p])||1}" style="width:52px;min-height:28px;margin-left:4px">份</span>`).join('')+'</div>'; };
  sh.root.insertAdjacentHTML('afterend','');
  const modeRow=document.createElement('div');
  modeRow.className='row wrap'; modeRow.style.marginTop='6px';
  modeRow.innerHTML=`<button type="button" class="chip ${shareMode==='eq'?'active':''}" data-m="eq">均分</button>
    <button type="button" class="chip ${shareMode==='w'?'active':''}" data-m="w">按份数</button>`;
  sharesBox.parentNode.insertBefore(modeRow,sharesBox);
  modeRow.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ shareMode=b.dataset.m;
    modeRow.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderShares(); });
  sh.root.querySelectorAll('#exShare .chip').forEach(c=>c.onclick=()=>{ const p=c.dataset.p;
    if(shared.includes(p)){ shared=shared.filter(x=>x!==p); c.classList.remove('active'); }
    else { shared.push(p); c.classList.add('active'); } renderShares(); });
  renderShares();
  const convUpd=()=>{ const amt=Number(sh.root.querySelector('#exAmt').value)||0;
    const cur=sh.root.querySelector('#exCur').value;
    const box=sh.root.querySelector('#exConv');
    if(!box)return;
    box.textContent=(cur&&cur!==t.currency&&amt)?`≈ ${fmtMoney(toCur(amt,cur,t.currency),t.currency)}（按手动汇率折算）`:'';
  };
  sh.root.querySelector('#exAmt').addEventListener('input',convUpd);
  sh.root.querySelector('#exCur').addEventListener('change',convUpd);
  convUpd();
  sh.root.querySelector('#exSave').onclick=()=>{
    const title=sh.root.querySelector('#exTitle').value.trim();
    const amt=Number(sh.root.querySelector('#exAmt').value)||0;
    if(!title||!amt){ toast('请填写名目和金额'); return; }
    let shObj;
    if(shared.length>1&&shareMode==='w'){
      shObj={}; sh.root.querySelectorAll('[data-w]').forEach(i=>{ if(shared.includes(i.dataset.w))shObj[i.dataset.w]=Math.max(1,Number(i.value)||1); });
      shared=shared.filter(p=>shObj[p]); }
    const data={title,amount:amt,currency:sh.root.querySelector('#exCur').value,
      category:sh.root.querySelector('#exCat').value,date:sh.root.querySelector('#exDate').value,
      paidBy:sh.root.querySelector('#exPaid').value,sharedBy:shared,shares:shObj,
      note:sh.root.querySelector('#exNote').value.trim(),
      includedInAnotherTicket:sh.root.querySelector('#exInc').checked};
    if(isNew)DB.expenses.push(Object.assign({id:'exp_'+uid()},data,{tripId:t.id}));
    else Object.assign(e,data);
    save('expenses'); sh.close(); renderApp(); toast('已保存'); };
}

  const rows=Object.entries(r).map(([c,v])=>`<div class="fx-row"><b>${c}</b><input type="number" step="0.00001" data-cur="${c}" value="${v}"></div>`).join('');

   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
     <button class="btn small" data-act="closeOverlay">取消</button><button class="btn primary small" id="capSave">保存</button></div>`);
  m.el.querySelector('#capSave').onclick=()=>{ const nc={};

<script>
/* ==================== 打包清单 ==================== */
const isDesktop=()=>!(matchMedia('(pointer:coarse)').matches||innerWidth<768);
function pagePacking(params){ let t=params.tripId?DB.trips.find(x=>x.id===params.tripId):null;
  if(!t){ t=DB.trips.filter(x=>!x.archived).sort((a,b)=>tripStatus(b)==='past'?-1:1)[0]; if(t)params.tripId=t.id; }
  if(!t)return {html:topbar('打包清单')+`<div class="empty">${I('pack',40)}<p>暂无行程</p><button class="btn primary" data-act="goPage" data-page="trips">去创建行程</button></div>`};
  const pl=DB.packingLists.find(p=>p.tripId===t.id);
  if(!pl){ DB.packingLists.push({tripId:t.id,categories:defaultPackingCategories()}); save('packingLists'); }
  const list=DB.packingLists.find(p=>p.tripId===t.id);
  let done=0,total=0; const byPerson={};
  const isParent=id=>list.categories.some(c=>c.items.some(x=>x.parent===id));
  for(const c of list.categories)for(const it of c.items){ if(isParent(it.id))continue;
    total++; if(it.packed)done++;
    const p=it.assignee||'未分配'; byPerson[p]=byPerson[p]||{d:0,t:0}; byPerson[p].t++; if(it.packed)byPerson[p].d++; }
  const pct=total?Math.round(done/total*100):0; const cls=pct>=100?'':pct>=60?'warn':'err';
  const people=['我',...(t.companions||[])];
  const finals=[]; for(const c of list.categories)for(const it of c.items)if(it.finalCheck)finals.push({it,cat:c.name,ci:list.categories.indexOf(c)});
  const fd=finals.filter(f=>f.it.finalDone).length;
  const banners=getBanners();
  const finalsCard=finals.length?`<details class="card" ${fd<finals.length?'open':''} style="margin-top:12px">
    <summary style="cursor:pointer;list-style:none;font-weight:650;font-size:14px">✅ 出行前最终核对 <span class="badge ${fd===finals.length?'ok':'warn'}">${fd}/${finals.length}</span></summary>
    <div style="margin-top:6px">${finals.map(f=>`<label class="row" style="padding:6px 0;font-size:14px;cursor:pointer;border-bottom:1px dashed var(--line)">
      <input type="checkbox" data-act="pkFinalToggle" data-trip="${t.id}" data-ci="${f.ci}" data-id="${f.it.id}" ${f.it.finalDone?'checked':''} style="width:17px;height:17px">
      <span style="flex:1;${f.it.finalDone?'text-decoration:line-through;color:var(--text-sub)':''}">${esc(f.it.text)} <span class="tiny">· ${esc(f.cat)}</span></span>
      ${f.it.packed?'<span class="badge ok">已装包</span>':'<span class="badge plain">未装包</span>'}</label>`).join('')}</div>
    <div class="tiny mt8">出门前最后摸一遍：证件/充电宝/贵重物品这类“漏带就完蛋”的，在条目菜单里选「加入最终核对」。</div></details>`:'';
  return { html: topbar('打包清单',esc(t.title)+' · '+t.currency,
    `<button class="btn small" data-act="goPage" data-page="trips">${I('map',13)}行程</button>`)
   +banners.map(b=>`<div class="banner ${b.cls||''}">${I('alert',18)}<div class="b-txt">${b.msg}</div></div>`).join('')
   +finalsCard
   +`<div class="card"><div class="pk-head">
      <div class="pk-prog"><div class="row tiny"><span>${done}/${total} 已打包</span><span class="spacer"></span><span>${pct}%</span></div>
        <div class="progress mt8"><i class="${cls}" style="width:${pct}%"></i></div></div></div>
     <div class="row wrap mt8">${Object.entries(byPerson).map(([p,v])=>`<span class="pk-person"><i style="background:${personColor(p,people)}"></i>${esc(p)} ${v.d}/${v.t}</span>`).join('')}</div>
     <div class="row wrap mt12">
       <button class="btn small" data-act="pkScene" data-trip="${t.id}">${I('sparkle',13)}按场景生成</button>
       <button class="btn small" data-act="pkTplImport" data-trip="${t.id}">${I('archive',13)}从模板导入</button>
       <button class="btn small" data-act="pkTplSave" data-trip="${t.id}">${I('bookmark',13)}存为模板</button>
       ${isDesktop()&&navigator.onLine?`<button class="btn small" data-act="pkWeather" data-trip="${t.id}">${I('cloud',13)}天气建议</button>`:''}
       <button class="btn small" data-act="pkAddCat" data-trip="${t.id}">${I('plus',13)}新分类</button>
     </div></div>
   <div id="pkCats">${list.categories.map((c,ci)=>packCatHtml(t,list,c,ci,people)).join('')}</div>` };
}
function personColor(p,people){ const i=people.indexOf(p); return DAY_COLORS[(i<0?5:i)%DAY_COLORS.length]; }
function packCatHtml(t,list,c,ci,people){
  const parents=c.items.filter(x=>!x.parent);
  const kidsOf=pid=>c.items.filter(x=>x.parent===pid);
  const row=(it,sub)=>`<div class="pk-row ${it.packed?'done':''} ${sub?'pk-sub':''}">
     <label class="pk-check"><input type="checkbox" data-act="pkToggle" data-trip="${t.id}" data-ci="${ci}" data-id="${it.id}" ${it.packed?'checked':''}></label>
     <div class="pk-text" data-act="pkEdit" data-trip="${t.id}" data-ci="${ci}" data-id="${it.id}">${esc(it.text)}
       ${it.note?`<span class="pk-note"> · ${esc(it.note)}</span>`:''}
       ${it.finalCheck?' <span class="badge warn">核对项</span>':''}</div>
     ${it.finalCheck?`<span class="pk-assignee" style="color:${it.finalDone?'var(--ok)':'var(--warn)'}">${it.finalDone?'已核对':'待核对'}</span>`:''}
     ${it.assignee?`<span class="pk-assignee" style="color:${personColor(it.assignee,people)}">${esc(it.assignee)}</span>`:''}
     <button class="icon-btn small" data-act="pkMore" data-trip="${t.id}" data-ci="${ci}" data-id="${it.id}">${I('dots',15)}</button>
   </div>`;
  let rows='';
  for(const p of parents){ const kids=kidsOf(p.id);
    rows+=row(p,false);
    if(kids.length){ const kd=kids.filter(k=>k.packed).length;
      rows+=`<div class="pk-subhead tiny">└ ${esc(p.text)} 内 ${kd}/${kids.length} 已备</div><div class="pk-subwrap">${kids.map(k=>row(k,true)).join('')}</div>`; } }
  for(const o of c.items.filter(x=>x.parent&&!c.items.find(y=>y.id===x.parent)))rows+=row(o,false);
  return `<div class="card pk-cat">
   <div class="pk-cat-h"><h4>${esc(c.name)}</h4>
     <button class="btn tiny" data-act="pkAdd" data-trip="${t.id}" data-ci="${ci}">${I('plus',12)}添加</button>
     <button class="btn tiny danger" data-act="pkDelCat" data-trip="${t.id}" data-ci="${ci}">${I('trash',12)}</button></div>
   ${rows||'<div class="tiny" style="padding:6px 0">空分类，点「添加」</div>'}</div>`; }
function findPk(tripId,ci,id){ const list=DB.packingLists.find(p=>p.tripId===tripId); if(!list)return null;
  const cat=list.categories[ci]; if(!cat)return null; return {list,cat,item:cat.items.find(x=>x.id===id)}; }
ACTIONS.pkToggle=d=>{ const r=findPk(d.trip,Number(d.ci),d.id); if(!r)return;
  r.item.packed=!r.item.packed; save('packingLists'); renderApp(); };
ACTIONS.pkAdd=d=>pkItemForm(d.trip,Number(d.ci),null);
ACTIONS.pkEdit=d=>{ const r=findPk(d.trip,Number(d.ci),d.id); if(r)pkItemForm(d.trip,Number(d.ci),r.item); };
ACTIONS.pkMore=d=>{ const r=findPk(d.trip,Number(d.ci),d.id); if(!r)return;
  const t=DB.trips.find(x=>x.id===d.trip); const people=['我',...(t.companions||[])];
  const m=openModal(`<h2 style="font-size:16px">${esc(r.item.text)}</h2>
   <label class="f-label">分配给</label><div class="row wrap">
     <button class="chip" data-act="pkAssign" data-trip="${d.trip}" data-ci="${d.ci}" data-id="${d.id}" data-p="">未分配</button>
     ${people.map(p=>`<button class="chip ${r.item.assignee===p?'active':''}" data-act="pkAssign" data-trip="${d.trip}" data-ci="${d.ci}" data-id="${d.id}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
   <div style="display:flex;flex-direction:column;gap:2px;margin-top:12px">
     <button class="btn ghost" style="justify-content:flex-start" data-act="pkFinalFlag" data-trip="${d.trip}" data-ci="${d.ci}" data-id="${d.id}">${I('alert',16)}<span style="color:var(--text)">${r.item.finalCheck?'移出最终核对':'加入最终核对（出门前必摸一遍）'}</span></button>
     ${r.item.finalCheck?`<button class="btn ghost" style="justify-content:flex-start" data-act="pkFinalToggle" data-trip="${d.trip}" data-ci="${d.ci}" data-id="${d.id}">${I('check',16)}<span style="color:var(--text)">${r.item.finalDone?'取消已核对':'标记已核对'}</span></button>`:''}
     <button class="btn ghost" style="justify-content:flex-start" data-act="pkEdit" data-trip="${d.trip}" data-ci="${d.ci}" data-id="${d.id}">${I('edit',16)}<span style="color:var(--text)">编辑</span></button>
     <button class="btn ghost" style="justify-content:flex-start" data-act="pkDel" data-trip="${d.trip}" data-ci="${d.ci}" data-id="${d.id}">${I('trash',16)}<span style="color:var(--err)">删除</span></button></div>`); };
ACTIONS.pkFinalFlag=d=>{ const r=findPk(d.trip,Number(d.ci),d.id); r.item.finalCheck=!r.item.finalCheck;
  if(!r.item.finalCheck)r.item.finalDone=false; save('packingLists'); closeTopOverlay(); renderApp();
  toast(r.item.finalCheck?'已加入最终核对':'已移出最终核对'); };
ACTIONS.pkFinalToggle=d=>{ const r=findPk(d.trip,Number(d.ci),d.id); r.item.finalDone=!r.item.finalDone;
  save('packingLists'); renderApp(); };
ACTIONS.pkAssign=d=>{ const r=findPk(d.trip,Number(d.ci),d.id); r.item.assignee=d.p; save('packingLists'); closeTopOverlay(); renderApp(); };
ACTIONS.pkDel=async d=>{ const r=findPk(d.trip,Number(d.ci),d.id); if(!r)return;
  if(!await confirmDlg('删除该项？',{okText:'删除',danger:true}))return;
  r.cat.items=r.cat.items.filter(x=>x.id!==d.id); save('packingLists'); closeTopOverlay(); renderApp(); };
ACTIONS.pkDelCat=async d=>{ const list=DB.packingLists.find(p=>p.tripId===d.trip);
  if(!await confirmDlg('删除整个分类及其条目？',{okText:'删除',danger:true}))return;
  list.categories.splice(Number(d.ci),1); save('packingLists'); renderApp(); };
ACTIONS.pkAddCat=d=>{ const t=DB.trips.find(x=>x.id===d.trip); 
  const m=openModal(`<h2>新增分类</h2><input id="catName" placeholder="分类名称">
   <div class="row" style="justify-content:flex-end;margin-top:12px;gap:8px">
     <button class="btn small" data-act="closeOverlay">取消</button><button class="btn primary small" id="catGo">添加</button></div>`);
  m.el.querySelector('#catGo').onclick=()=>{ const n=m.el.querySelector('#catName').value.trim(); if(!n)return;
    const list=DB.packingLists.find(p=>p.tripId===d.trip); list.categories.push({name:n,items:[]});
    save('packingLists'); m.close(); renderApp(); }; };
function pkItemForm(tripId,ci,item){ const isNew=!item; item=item||{text:'',packed:false,assignee:'',note:''};
  const t=DB.trips.find(x=>x.id===tripId); const people=['我',...(t.companions||[])];
  const list=DB.packingLists.find(p=>p.tripId===tripId);
  const candParents=list.categories[ci].items.filter(x=>!x.parent&&x.id!==item.id&&
    !list.categories.some(cc=>cc.items.some(y=>y.parent===x.id)));
  const sh=openSheet(`<h2>${isNew?'添加条目':'编辑条目'}</h2>
   <label class="f-label">名称</label><input id="pkText" value="${esc(item.text)}">
   <div class="f-2"><div><label class="f-label">分配给</label><select id="pkA"><option value="">未分配</option>
     ${people.map(p=>`<option ${p===item.assignee?'selected':''}>${p}</option>`).join('')}</select></div>
   <div><label class="f-label">装入（可选，作为子项）</label><select id="pkParent"><option value="">不装入</option>
     ${candParents.map(p=>`<option value="${p.id}" ${item.parent===p.id?'selected':''}>${esc(p.text)}</option>`).join('')}</select></div></div>
<label class="f-label">备注</label><input id="pkN" value="${esc(item.note||'')}">
<div class="row" style="margin-top:16px;gap:10px">
     <button class="btn block" data-act="closeOverlay">取消</button>
     <button class="btn primary block" id="pkSave">${I('check',16)}保存</button></div>`);
  sh.root.querySelector('#pkSave').onclick=()=>{ const text=sh.root.querySelector('#pkText').value.trim();
    if(!text){ toast('请填写名称'); return; }
    const data={text,assignee:sh.root.querySelector('#pkA').value,note:sh.root.querySelector('#pkN').value.trim(),
      parent:sh.root.querySelector('#pkParent').value||undefined};
    const list2=DB.packingLists.find(p=>p.tripId===tripId);
    if(isNew)list2.categories[ci].items.push(Object.assign({id:'pk_'+uid(),packed:false},data));
    else Object.assign(item,data);
    save('packingLists'); sh.close(); renderApp(); }; }

/* 按场景生成 */
const SCENE_TMPL={
 dur:{short:'短途(2-3天)',week:'一周左右',long:'长途(2周+)'},
 weather:{cold:'偏冷',warm:'温暖',unknown:'未知'},
 traffic:{plane:'飞机',car:'自驾',train:'火车'},
 comp:{solo:'独自',family:'亲子',pet:'带宠物'},
 type:{leisure:'休闲',business:'商务',outdoor:'户外'}};
function sceneItems(sel){ const P=(t,a)=>({id:'pk_'+uid(),text:t,packed:false,assignee:a||'',note:''});
  const C=(n,its)=>({name:n,items:its});
  const cats=[C('证件',[P('身份证'),P('现金/银行卡'),P('驾照 '+SCENE_TMPL.traffic[sel.traffic])])];
  const cloth=[P('换洗衣物 ×'+(sel.dur==='short'?'3':sel.dur==='week'?'6':'10')),P('外套'),P('舒适步行鞋')];
  if(sel.weather==='cold'){cloth.push(P('厚外套/羽绒'),P('围巾手套'),P('保暖内衣'));}
  if(sel.weather==='warm'){cloth.push(P('防晒衣'),P('凉鞋'));}
  if(sel.weather==='unknown'){cloth.push(P('薄外套（防温差）'));}
  if(sel.type==='business'){cloth.push(P('正装一套'),P('皮鞋'));}
  if(sel.type==='outdoor'){cloth.push(P('冲锋衣'),P('徒步鞋'),P('速干衣'));}
  cats.push(C('衣物',cloth));
  const elec=[P('手机充电器'),P('充电宝')];

/* 天气建议（电脑端 + 联网；预报最多 16 天，超出用去年同期的历史天气参考） */
async function fetchWeather(lat,lng,start,end){ const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}`+
  `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${start}&end_date=${end}`;
  const r=await fetch(url); if(!r.ok)throw new Error('天气请求失败'); return {daily:(await r.json()).daily,mode:'forecast'}; }
async function fetchWeatherArchive(lat,lng,start,end){ const y=Number(start.slice(0,4))-1;
  const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}`+
  `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date=${y+start.slice(4)}&end_date=${y+end.slice(4)}`;
  const r=await fetch(url); if(!r.ok)throw new Error('历史天气请求失败'); return {daily:(await r.json()).daily,mode:'archive'}; }
ACTIONS.pkWeather=async d=>{ const t=DB.trips.find(x=>x.id===d.trip); if(!t)return;
  const anchor=itemsOf(t.id).find(x=>x.lat!=null);
  if(!anchor){ toast('行程中没有带坐标的条目，无法定位天气'); return; }
  const today=todayStr(), horizon=addDays(today,15);
  let ds=t.startDate<today?today:t.startDate, de=t.endDate;
  if(ds>de){ toast('行程已结束，无法获取天气'); return; }
  toast('正在获取天气预报…');
  try{ let res,note='';
    if(ds>horizon){ res=await fetchWeatherArchive(anchor.lat,anchor.lng,ds,de);
      note='（出发超过 16 天，以下为去年同期的历史天气，仅供参考）'; }
    else{ if(de>horizon){ de=horizon; note='（预报最多 16 天，已按可预报范围截断）'; }
      res=await fetchWeather(anchor.lat,anchor.lng,ds,de); }
    const daily=res.daily, isArc=res.mode==='archive';
    const sug=[]; let rain=0,tmax=-99,tmin=99;
    daily.time.forEach((dt,i)=>{ const rv=isArc?(daily.precipitation_sum?.[i]||0):(daily.precipitation_probability_max?.[i]||0);
      rain=Math.max(rain,rv);
      tmax=Math.max(tmax,daily.temperature_2m_max[i]); tmin=Math.min(tmin,daily.temperature_2m_min[i]); });
    const P=(text,why)=>({text,why});
    if(isArc?rain>=10:rain>=50)sug.push(P('折叠伞/雨衣',isArc?`同期最大日降水 ${Math.round(rain)} mm`:`期间最大降水概率 ${rain}%`));
    if(tmax-tmin>=10)sug.push(P('薄外套/防风衣',`昼夜温差约 ${Math.round(tmax-tmin)}°C`));
    if(tmax>=28)sug.push(P('防晒霜 + 遮阳帽',`最高气温 ${Math.round(tmax)}°C`));
    if(tmin<=5)sug.push(P('保暖内衣',`最低气温 ${Math.round(tmin)}°C`));
    if(!sug.length)sug.push(P('无需特殊装备',`期间 ${Math.round(tmin)}~${Math.round(tmax)}°C，降水风险低`));
    const m=openModal(`<h2>天气建议（注明原因）</h2>
     <p class="tiny">目的地 ${esc(anchor.address||t.destination)} · Open-Meteo · ${ds} ~ ${de}${note}</p>
     ${sug.map((sg,i)=>`<div class="suggest-item"><div style="flex:1"><div>${esc(sg.text)}</div><div class="si-why">${esc(sg.why)}</div></div>
       <button class="btn tiny soft" data-act="pkWeatherAdd" data-trip="${d.trip}" data-si="${i}">加入清单</button></div>`).join('')}
     <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn small" data-act="closeOverlay">完成</button></div>`);
    m.el._sug=sug;
  }catch(e){ toast('天气获取失败：'+e.message); } };
ACTIONS.pkWeatherAdd=d=>{ const m=lastModal(); const s=m.el._sug[Number(d.si)];
  const list=DB.packingLists.find(p=>p.tripId===d.trip);

  if(!cat){ cat={name:'其他',items:[]}; list.categories.push(cat); }

  save('packingLists'); toast('已加入清单'); };

/* 出发提醒（三级） */
const pendingBanners=[];
function pushBanner(msg,cls){ if(pendingBanners.some(b=>b.msg===msg))return; pendingBanners.push({msg,cls}); }
function getBanners(){ return pendingBanners.splice(0); }
function notify(title,body){ try{ if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body}); }catch(e){} }
function runDepartureChecks(){ const today=todayStr(); const tomorrow=addDays(today,1);
  if(typeof checkTripOverlaps==='function')checkTripOverlaps();
  for(const t of DB.trips){ if(t.archived)continue;
    if(t.startDate===tomorrow&&!localStorage.getItem('rem_'+t.id+'_d1_'+today)){
      localStorage.setItem('rem_'+t.id+'_d1_'+today,'1');
      pushBanner(`「${esc(t.title)}」明天出发（${fmtMD(t.startDate)}），记得检查打包清单`, 'warn');
      notify('旅行提醒','明天出发：'+t.title);
      const flights=itemsOf(t.id).filter(x=>x.type==='transport'&&x.bookingRef);
      if(flights.length){ pushBanner(`明天出行：${flights.map(f=>esc(f.bookingRef)).join('、')} 可提前值机/取票（航司或 12306 App）`);
        notify('值机提醒',flights.map(f=>f.bookingRef).join('、')+' 可提前值机'); } }
    if(t.startDate===today&&!localStorage.getItem('rem_'+t.id+'_d0_'+today)){
      localStorage.setItem('rem_'+t.id+'_d0_'+today,'1');
      pushBanner(`「${esc(t.title)}」今天出发！祝旅途愉快`);
      notify('旅行提醒','今天出发：'+t.title); }
    if(t.endDate===today&&!localStorage.getItem('rem_'+t.id+'_end_'+today)){
      localStorage.setItem('rem_'+t.id+'_end_'+today,'1');
      pushBanner(`「${esc(t.title)}」今天返程/退房，别忘了行李和贵重物品`);
      notify('返程提醒','今天返程：'+t.title); }
    for(const r of (t.customReminders||[])){ if(r.done)continue;
      if(r.date===today&&!localStorage.getItem('rem_'+r.id+'_'+today)){
        localStorage.setItem('rem_'+r.id+'_'+today,'1');
        pushBanner(`今日待办：${esc(r.text)}（${esc(t.title)}）`,'warn');
        notify('旅行待办',r.text); }
      if(r.date===tomorrow&&!localStorage.getItem('rem_'+r.id+'_tm_'+today)){
        localStorage.setItem('rem_'+r.id+'_tm_'+today,'1');
        pushBanner(`明天待办：${esc(r.text)}（${esc(t.title)}）`); } } }
  const ppExpiry=localStorage.getItem('passport_expiry');
  if(ppExpiry){ const left=diffDays(today,ppExpiry);
    if(left>=0&&left<=190&&!localStorage.getItem('rem_passport_'+today)){
      localStorage.setItem('rem_passport_'+today,'1');
      const soon=DB.trips.some(t=>!t.archived&&tripStatus(t)==='upcoming');
      if(soon)pushBanner(`护照有效期仅剩约 ${Math.round(left/30)} 个月（${ppExpiry} 到期），多数国家要求入境时剩余 6 个月以上，请尽快换发`,'warn'); } }
    for(const d2 of docCenterList()){ if(!d2.expiry)continue;
    const left=diffDays(today,d2.expiry);
    if(left>=0&&left<=90&&!localStorage.getItem('rem_doc_'+d2.id+'_'+today)){
      localStorage.setItem('rem_doc_'+d2.id+'_'+today,'1');
      pushBanner(`${d2.name} 将于 ${d2.expiry} 到期（剩 ${left} 天）`,'warn');
      notify('证件/保险提醒',d2.name+' 即将到期'); } }
const home=getLS('home_coords',null);
  const startToday=DB.trips.find(t=>!t.archived&&t.startDate===today);
  if(home&&startToday&&navigator.geolocation){ const pl=DB.packingLists.find(p=>p.tripId===startToday.id);
    let unpacked=0; if(pl)for(const c of pl.categories)for(const it of c.items)if(!it.packed)unpacked++;
    if(unpacked>0&&!localStorage.getItem('rem_'+startToday.id+'_geo_'+today)){
      navigator.geolocation.getCurrentPosition(pos=>{
        const d=haversine(home,{lat:pos.coords.latitude,lng:pos.coords.longitude});
        if(d!=null&&d<=0.2){ localStorage.setItem('rem_'+startToday.id+'_geo_'+today,'1');
          pushBanner(`离家约 ${Math.round(d*1000)} 米：「${esc(startToday.title)}」还有 ${unpacked} 项未打包`,'warn');
          notify('打包提醒',`还有 ${unpacked} 项未打包`); } },()=>{},{enableHighAccuracy:true,timeout:8000}); } } }

<script>
/* ==================== 旅行日记 ==================== */
const MOODS=['愉快','平静','治愈','兴奋','疲惫','郁闷'];
function pageJournal(){ const trips=DB.trips.slice().sort((a,b)=>a.startDate<b.startDate?1:-1);
  let html=topbar('旅行日记','',
    `<button class="btn small" data-act="jExportAll">${I('down',13)}导出文本</button>
     <button class="btn small" data-act="photoImport">${I('image',13)}照片导入足迹</button>`);
  let any=false;
  for(const t of trips){ const list=DB.journal.filter(j=>j.tripId===t.id).sort((a,b)=>(a.dayIndex||0)-(b.dayIndex||0));
    if(!list.length)continue; any=true;
    html+=`<div class="trip-sec-title">${esc(t.title)} · ${fmtMD(t.startDate)}</div>`
     +list.map(j=>{ const wcls=(j.weather||'').indexOf('雨')>=0?'jw-rain':(j.weather||'').indexOf('雪')>=0?'jw-snow':(j.weather||'').indexOf('晴')>=0?'jw-sun':'';
       const live=j.photos&&j.photos.some(p2=>p2.live);
       return `<div class="j-card ${wcls}" data-act="jEdit" data-id="${j.id}">
       <div class="row"><h3 style="flex:1">${esc(j.title||'无标题')}</h3>
         ${j.mood?`<span class="badge">${esc(j.mood)}</span>`:''}${live?'<span class="badge warn">实况</span>':''}</div>
       <div class="j-meta"><span>第 ${(j.dayIndex||0)+1} 天 · ${fmtMD(dayDate(t,j.dayIndex||0))}</span>
         ${j.weather?`<span>${I('cloud',11)} ${esc(j.weather)}</span>`:''}
         ${j.location?`<span>${I('pin',11)} ${esc(j.location)}</span>`:''}</div>
       <div class="j-abs">${esc((j.content||'').slice(0,80))}</div>
       ${j.photos&&j.photos.length?`<div class="j-card-thumbs">${j.photos.slice(0,3).map(p2=>`<img class="j-photo-prev" data-jp="${p2.id}" alt="">`).join('')}${j.photos.length>3?`<span class="j-more">+${j.photos.length-3}</span>`:''}</div>`:''}</div>`; }).join(''); }
  if(!any)html+=`<div class="empty">${I('edit',40)}<p>还没有日记</p><button class="btn primary" data-act="jNew">写第一篇</button></div>`;
  else html+=`<div class="row mt12"><button class="btn block" data-act="jNew">${I('plus',15)}写日记</button>
    <button class="btn soft block mt8" data-act="jExportImg" data-trip="${curTripOrFirst()?.id||''}">${I('image',13)} 导出日记长图</button></div>`;
  return {html,after:fillIdbImages};
}
ACTIONS.jNew=()=>{ const t=curTripOrFirst(); journalEditForm(t,0,null); };
function curTripOrFirst(){ const p=navStack[navStack.length-1].params;
  return DB.trips.find(x=>x.id===p.tripId)||DB.trips.slice().sort((a,b)=>tripStatus(b)==='past'?-1:1)[0]; }
ACTIONS.jEdit=d=>{ const j=DB.journal.find(x=>x.id===d.id); if(!j)return;
  const t=DB.trips.find(x=>x.id===j.tripId); journalEditForm(t,j.dayIndex||0,j); };
function journalEditForm(t,day,j){ if(!t){ toast('请先创建行程'); return; }
  const isNew=!j; j=j||{tripId:t.id,dayIndex:day,title:'',content:'',mood:'',weather:'',location:'',photos:[]};
  const days=Array.from({length:tripDays(t)},(_,i)=>i); let mood=j.mood||'';
  const autoLoc=itemsOfDay(t.id,day).find(x=>x.lat!=null||x.address);
  const sh=openSheet(`<h2>${isNew?'写日记':'编辑日记'}</h2>
   <div class="f-2"><div><label class="f-label">第几天</label><select id="jDay">${days.map(d=>`<option value="${d}" ${d===day?'selected':''}>第 ${d+1} 天（${fmtMD(dayDate(t,d))}）</option>`).join('')}</select></div>
   <div><label class="f-label">心情</label><div class="mood-chips" id="jMood">${MOODS.map(m=>`<button type="button" class="chip ${m===mood?'active':''}" data-m="${m}">${m}</button>`).join('')}</div></div></div>
   <label class="f-label">标题</label><input id="jTitle" value="${esc(j.title)}" placeholder="这一天…">
   <label class="f-label">正文</label><textarea id="jContent" rows="5" style="font-size:16px;line-height:1.7">${esc(j.content)}</textarea>
   <div class="row mt8"><button type="button" class="btn small" id="jMic">${I('send',13)} 语音输入</button>
     <button type="button" class="btn tiny soft" id="jPolish">AI 润色</button><span class="tiny" id="jMicTip">语音转文字（电脑 Chrome/Edge）</span></div>
   <div class="row mt8"><button type="button" class="btn small" id="jPrompt">${I('bulb',13)} 写作灵感</button><span class="tiny" id="jPromptTxt" style="color:var(--primary)"></span></div>
   <div class="f-2"><div><label class="f-label">天气（自动带入，可改）</label>
     <div class="row"><input id="jWeather" value="${esc(j.weather||'')}" placeholder="晴 18°C">
     <button class="btn small" id="jWxBtn" title="尝试自动获取">${I('refresh',14)}</button></div></div>
   <div><label class="f-label">地点（自动带入）</label><input id="jLoc" value="${esc(j.location||(autoLoc?autoLoc.title:''))}"></div></div>
   <div id="jPhotoArea"></div>
   <div class="row mt8"><button class="btn small" id="jPhotoBtn">${I('image',14)}添加一张照片</button>
     <input type="file" id="jPhotoFile" multiple accept="image/*,video/quicktime,.mov" accept="image/*" style="display:none"></div>
   <div class="row" style="margin-top:16px;gap:10px">
     ${isNew?'':`<button class="btn danger" id="jDel">${I('trash',16)}</button>`}
     <button class="btn block" data-act="closeOverlay">取消</button>
     <button class="btn primary block" id="jSave">${I('check',16)}保存</button></div>`);
  sh.root.querySelectorAll('#jMood .chip').forEach(c=>c.onclick=()=>{ mood=c.dataset.m;
    sh.root.querySelectorAll('#jMood .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); });
  const photoArea=sh.root.querySelector('#jPhotoArea');
  const renderPhotos=async()=>{ const phs=(j.photos||[]).slice(0,9);
    if(!phs.length){ photoArea.innerHTML=''; return; }
    const cells=await Promise.all(phs.map(async ph=>{
      const d=await idbGet('jp_'+ph.id); if(!d)return '';
      const del=`<button type="button" class="jph-del" data-id="${ph.id}">×</button>`;
      const badge=ph.live?'<span class="jph-badge">实况</span>':'';
      const inner=ph.live?`<video class="j-photo-prev" src="${d}" controls playsinline></video>`
        :`<img class="j-photo-prev" src="${d}" alt="">`;
      return `<div class="jph">${inner}${badge}${del}</div>`; }));
    photoArea.innerHTML='<div class="j-photo-grid">'+cells.join('')+'</div>';
    photoArea.querySelectorAll('.jph-del').forEach(b=>b.onclick=()=>{
      const ph=j.photos.find(x=>x.id===b.dataset.id);
      if(ph)idbDel('jp_'+ph.id);
      j.photos=j.photos.filter(x=>x.id!==b.dataset.id); renderPhotos(); }); };
  renderPhotos();
  sh.root.querySelector('#jPhotoBtn').onclick=()=>sh.root.querySelector('#jPhotoFile').click();
  sh.root.querySelector('#jPhotoFile').onchange=async e=>{
    for(const f of e.target.files){
      if((j.photos||[]).length>=9){ toast('每篇日记最多 9 张'); break; }
      const isMov=/\.(mov|mp4)$/i.test(f.name)||f.type==='video/quicktime';
      if(isMov){ if(f.size>24*1024*1024){ toast('实况视频超过 24MB，跳过'); continue; }
        const rd=new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(''); fr.readAsDataURL(f); });
        const data=await rd; if(!data)continue;
        const ph={id:'jph_'+uid(),live:true,size:f.size};
        await idbPut('jp_'+ph.id,data); j.photos=(j.photos||[]).concat([ph]); toast('实况视频已添加'); continue; }
      const data=await compressImage(f,1280,0.72);
      if(!data)continue;
      if(data.length>1.4*1024*1024){ toast('一张照片压缩后仍超过 1MB，已跳过'); continue; }
      const ph={id:'jph_'+uid(),size:Math.round(data.length*0.75)};
      await idbPut('jp_'+ph.id,data); j.photos=(j.photos||[]).concat([ph]); }
    e.target.value=''; await renderPhotos(); toast('照片已更新'); };
  sh.root.querySelector('#jWxBtn').onclick=async()=>{ if(!isDesktop()||!navigator.onLine){ toast('天气自动获取仅电脑端联网可用，可手动填写'); return; }
    const it=itemsOfDay(t.id,day).find(x=>x.lat!=null); if(!it){ toast('当天没有带坐标的条目'); return; }
    toast('获取天气…');
    try{ const wx=await fetchWeather(it.lat,it.lng,dayDate(t,day),dayDate(t,day));
      const tmax=Math.round(wx.temperature_2m_max[0]),tmin=Math.round(wx.temperature_2m_min[0]);
      const rain=wx.precipitation_probability_max[0]||0;
      sh.root.querySelector('#jWeather').value=`${rain>=50?'有雨':rain>=30?'可能阵雨':'晴/多云'} ${tmin}~${tmax}°C`; }
    catch(e){ toast('天气获取失败'); } };
  if(typeof attachSpeech==='function')attachSpeech(sh.root.querySelector('#jMic'),sh.root.querySelector('#jContent'),sh.root.querySelector('#jMicTip'));
  const polBtn=sh.root.querySelector('#jPolish');
  if(polBtn)polBtn.onclick=async()=>{
    if(!navigator.onLine){ toast('AI 润色需联网'); return; }
    const key=localStorage.getItem('ai_key'); if(!key){ toast('请先在设置配置 AI Key'); return; }
    const txt=sh.root.querySelector('#jContent').value.trim();
    if(!txt){ toast('先写点内容再润色'); return; }
    polBtn.disabled=true; polBtn.textContent='润色中…';
    try{
      const ep=localStorage.getItem('ai_endpoint')||'https://api.openai.com/v1/chat/completions';
      const model=localStorage.getItem('ai_model')||'gpt-4o-mini';
      const r2=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({model,messages:[
          {role:'system',content:'你是旅行日记润色助手。保持第一人称与事实不变，让文字更生动流畅，长度不超过原文两倍，直接输出润色后的正文，不要解释。'},
          {role:'user',content:txt}],temperature:0.7})});
      const j2=await r2.json();
      const out=j2.choices&&j2.choices[0]&&j2.choices[0].message?j2.choices[0].message.content.trim():'';
      if(!out)throw new Error('空结果');
      if(await confirmDlg('用润色后的文字替换当前内容？',{okText:'替换'})){
        sh.root.querySelector('#jContent').value=out; toast('已润色'); }
    }catch(e){ toast('润色失败：'+String(e.message).slice(0,60)); }
    polBtn.disabled=false; polBtn.innerHTML='AI 润色'; };
  if(typeof jPromptHint==='function')jPromptHint(sh.root.querySelector('#jPrompt'),sh.root.querySelector('#jPromptTxt'),sh.root.querySelector('#jContent'));
  sh.root.querySelector('#jSave').onclick=()=>{
    const data={dayIndex:Number(sh.root.querySelector('#jDay').value),
      title:sh.root.querySelector('#jTitle').value.trim(),
      content:sh.root.querySelector('#jContent').value.trim(),
      mood,weather:sh.root.querySelector('#jWeather').value.trim(),
      location:sh.root.querySelector('#jLoc').value.trim()};
    if(!data.title&&!data.content){ toast('写点内容再保存'); return; }
    if(isNew)DB.journal.push(Object.assign({id:'jr_'+uid(),photos:j.photos||[],tripId:t.id,createdAt:Date.now(),updatedAt:Date.now()},data));
    else Object.assign(j,data,{updatedAt:Date.now()});
    save('journal'); sh.close(); renderApp(); toast('已保存'); };
  const del=sh.root.querySelector('#jDel');
  if(del)del.onclick=async()=>{ if(!await confirmDlg('删除这篇日记？',{okText:'删除',danger:true}))return;
    for(const p of (j.photos||[]))idbDel('jp_'+p.id);
    DB.journal=DB.journal.filter(x=>x.id!==j.id); save('journal'); sh.close(); renderApp(); }; }
function compressImage(file,maxPx,q){ return new Promise(res=>{ const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{ const sc=Math.min(1,maxPx/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); res(''); };
  img.src=url; }); }
ACTIONS.jExportAll=()=>{ const t=curTripOrFirst(); if(!t)return;
  const list=DB.journal.filter(j=>j.tripId===t.id).sort((a,b)=>(a.dayIndex||0)-(b.dayIndex||0));
  if(!list.length){ toast('该行程暂无日记'); return; }
  const text=list.map(j=>`【第 ${(j.dayIndex||0)+1} 天 · ${fmtMD(dayDate(t,j.dayIndex||0))}】${j.title}\n${j.mood?'心情：'+j.mood+'  ':''}${j.weather?'天气：'+j.weather+'  ':''}${j.location?'地点：'+j.location:''}\n${j.content}\n`).join('\n');
  download(`日记-${t.title}.txt`,text); toast('已导出日记文本'); };

/* ==================== EXIF 内联解析（JPEG · 离线可用） ==================== */
function parseExif(buf){ const out={};
  try{ const v=new DataView(buf); if(v.byteLength<12||v.getUint16(0)!==0xFFD8)return out;
    let off=2;
    while(off+4<v.byteLength){ if(v.getUint8(off)!==0xFF)break;
      const marker=v.getUint16(off);
      if(marker===0xFFD8||marker===0xFF01||marker===0xFFD9||(marker>=0xFFD0&&marker<=0xFFD7)){ off+=2; continue; }
      const len=v.getUint16(off+2);
      if(marker===0xFFE1&&len>8&&v.getUint32(off+4)===0x45786966){ parseTiff(v,off+10,out); break; }
      off+=2+len; } }catch(e){}
  return out; }
function parseTiff(v,t,out){ try{ const le=v.getUint16(t)===0x4949;
  const ifd0=t+v.getUint32(t+4,le); let gps=0,exifIfd=0;
  const n=v.getUint16(ifd0,le);
  for(let i=0;i<n;i++){ const e=ifd0+2+i*12; const tag=v.getUint16(e,le);
    if(tag===0x8825)gps=t+v.getUint32(e+8,le);
    if(tag===0x8769)exifIfd=t+v.getUint32(e+8,le); }
  if(gps){ const gn=v.getUint16(gps,le); const tags={};
    for(let i=0;i<gn;i++){ const e=gps+2+i*12; tags[v.getUint16(e,le)]=e; }
    const dms=(e)=>{ const vo=t+v.getUint32(e+8,le);
      return [0,1,2].map(k=>v.getUint32(vo+k*8,le)/(v.getUint32(vo+k*8+4,le)||1)); };
    if(tags[2]&&tags[4]){ const refAt=(e)=>{ const typ=v.getUint16(e+2,le), cnt=v.getUint32(e+4,le);
        return (typ===2&&cnt<=4)? e+8 : t+v.getUint32(e+8,le); };
      const dl=dms(tags[2]), dg=dms(tags[4]);
      let lat=dl[0]+dl[1]/60+dl[2]/3600;
      let lng=dg[0]+dg[1]/60+dg[2]/3600;
      const lr=refAt(tags[1]), lrTxt=String.fromCharCode(v.getUint8(lr)).trim();
      const gr=refAt(tags[3]), grTxt=String.fromCharCode(v.getUint8(gr)).trim();
      if(lrTxt==='S')lat=-lat; if(grTxt==='W')lng=-lng;
      if(isFinite(lat)&&isFinite(lng)){ out.lat=lat; out.lng=lng; } } }
  if(exifIfd){ const en=v.getUint16(exifIfd,le);
    for(let i=0;i<en;i++){ const e=exifIfd+2+i*12;
      if(v.getUint16(e,le)===0x9003){ const off=t+v.getUint32(e+8,le); let s='';
        const cnt=v.getUint32(e+4,le); for(let k=0;k<cnt-1&&k<19;k++)s+=String.fromCharCode(v.getUint8(off+k));
        out.dt=s; break; } } } }catch(e){} }
/* 照片导入足迹流程 */
let photoQueue=[];
ACTIONS.photoImport=()=>{ const m=openModal(`<h2>从照片导入足迹</h2>
   <p class="sub">读取照片 EXIF 中的 GPS 与拍摄时间，本地聚类成「到访点」；照片不上传、不存储，只保留坐标与数量。</p>
   <div class="row mt8"><button class="btn primary block" id="piPick">${I('image',15)}选择照片</button>
     <input type="file" id="piFile" accept="image/*" multiple style="display:none"></div>
   <div class="row"><button class="btn block" data-act="piDemo">${I('sparkle',14)}用示范照片直接体验（自动生成 4 张）</button></div>
   <div id="piProg" class="tiny mt8"></div><div id="piBody"></div>
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn small" data-act="closeOverlay">关闭</button></div>`);
  m.el.querySelector('#piPick').onclick=()=>m.el.querySelector('#piFile').click();
  m.el.querySelector('#piFile').onchange=e=>runPhotoImport([...e.target.files].slice(0,200),m); };
async function runPhotoImport(files,m){ const prog=m.el.querySelector('#piProg'),body=m.el.querySelector('#piBody');
  prog.textContent=`正在读取 0/${files.length}…`;
  const recs=[]; let noGps=0;
  for(let i=0;i<files.length;i++){ const f=files[i];
    try{ if(!/jpe?g$/i.test(f.name)&&f.type!=='image/jpeg'){ if(/\.(heic|heif|png|webp)$/i.test(f.name)||f.type&&f.type!=='image/jpeg')noGps++; }
      const buf=await f.arrayBuffer();
      const ex=parseExif(buf);
      if(ex.lat!=null){ const dt=ex.dt?ex.dt.replace(/(\d{4}):(\d{2}):(\d{2})/,'$1-$2-$3'):null;
        recs.push({lat:ex.lat,lng:ex.lng,t:dt?new Date(dt.replace('-','/')).getTime():null,name:f.name}); }
      else noGps++; }catch(e){ noGps++; }
    prog.textContent=`正在读取 ${i+1}/${files.length}…`; }
  prog.textContent=recs.length?`读到 ${recs.length} 张含 GPS 的照片${noGps?`，${noGps} 张无 GPS/不支持`:''}`:'';
  if(!recs.length){ body.innerHTML=`<div class="banner warn">${I('alert',16)}<div class="b-txt">这些照片不含位置信息（或为 HEIC/PNG 等非 JPEG 格式）。<div class="b-acts"><button class="btn tiny" data-act="manualPlace">${I('plus',12)}手动添加足迹</button></div></div></div>`; return; }
  const clusters=clusterPhotos(recs);
  const home=getLS('home_coords',null), comp=getLS('company_coords',null);
  const normal=[],daily=[];
  for(const c of clusters){ const isDaily=(home&&haversine(home,c)<=0.3)||(comp&&haversine(comp,c)<=0.3);
    (isDaily?daily:normal).push(c); }
  photoQueue=normal.map((c,i)=>({c,decided:null,name:suggestName(c)}));
  renderPhotoReview(body,daily); }
function clusterPhotos(recs){ recs.sort((a,b)=>(a.t||0)-(b.t||0));
  const groups=[];
  for(const r of recs){ const g=groups[groups.length-1];
    if(g){ const near=haversine({lat:g.lat,lng:g.lng},r);
      const dtGap=r.t&&g.lastT?(r.t-g.lastT)/3600000:0;
      if((near!=null&&near<=1)||(dtGap!==0&&dtGap<=2&&near!=null&&near<=1.5)){ g.n++; g.lat=(g.lat*(g.n-1)+r.lat)/g.n; g.lng=(g.lng*(g.n-1)+r.lng)/g.n;
        if(r.t){ if(!g.firstT)g.firstT=r.t; g.lastT=r.t; } continue; } }
    groups.push({lat:r.lat,lng:r.lng,n:1,firstT:r.t,lastT:r.t}); }
  groups.forEach(g=>{ g.span=g.firstT&&g.lastT?(g.lastT-g.firstT)/3600000:0; });
  return groups; }
function suggestName(c){ let best=null,bd=0.2;
  for(const it of DB.items){ if(it.lat==null)continue; const d=haversine(c,it); if(d!=null&&d<bd){bd=d;best=it.title;} }
  if(best)return best;
  for(const vp of DB.visitedPlaces){ if(vp.lat==null)continue; const d=haversine(c,vp); if(d!=null&&d<bd){bd=d;best=vp.name;} }
  return best||''; }
function renderPhotoReview(body,daily){ body.innerHTML=photoQueue.map((q,i)=>{
  const c=q.c; const uncertain=c.n<2||c.span>24;
  return `<div class="suggest-item"><div style="flex:1">
    <input value="${esc(q.name)}" data-pi="name${i}" placeholder="地点名称" style="min-height:36px;padding:6px 10px">
    <div class="si-why">${c.n} 张照片 · ${fmtKm(0)||''}${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}${c.firstT?` · ${new Date(c.firstT).toLocaleDateString('zh-CN')}`:''}${uncertain?' · <b style="color:var(--warn)">待确认（照片少或时间跨度异常）</b>':''}</div></div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <button class="btn tiny soft" data-act="piDecide" data-i="${i}" data-v="visit">${I('check',12)}是到访</button>
      <button class="btn tiny" data-act="piDecide" data-i="${i}" data-v="pass">是途经</button>
      <button class="btn tiny danger" data-act="piDecide" data-i="${i}" data-v="no">不是</button></div></div>`; }).join('')
  +(daily.length?`<details class="mt8"><summary class="sub">已过滤 ${daily.length} 个「日常」聚类（家/公司 300m 内）</summary>
    ${daily.map((c,i)=>`<div class="tiny row" style="padding:4px 0">${c.lat.toFixed(4)}, ${c.lng.toFixed(4)} · ${c.n} 张
      <span class="spacer"></span><button class="btn tiny" data-act="piRestore" data-lat="${c.lat}" data-lng="${c.lng}" data-n="${c.n}">恢复为到访</button></div>`).join('')}</details>`:'')

    dots+=`<circle class="wl-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.6"/>`;
    let ly=y+4;
    for(const q of placed){ if(Math.abs(q.x-x)<72&&Math.abs(q.y-ly)<15)ly+=14; }
    placed.push({x,y:ly});
    labels+=`<text class="wl-name" x="${Math.min(W-54,x+11).toFixed(1)}" y="${ly.toFixed(1)}">${esc(c)}</text>`; }
  const want=getLS('want_countries',[]); let wish='';

  let sd=20261109; const rnd=()=>{ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };

    <g class="wl-stars">${stars}</g>
    <g class="wl-grid">${grid}</g>
    ${conts}
    <line class="wl-eq" x1="0" y1="${eq.toFixed(1)}" x2="${W}" y2="${eq.toFixed(1)}"/>
    ${wish}${dots}${labels}</svg>
    <div class="wl-stat">已点亮 <b>${Object.keys(byC).length}</b> 个国家/地区 · <b>${pts.length}</b> 个地点${want.length?' · 想去 '+want.length:''}</div>

function worldFootprintCard(countries,cities,seenCont,milestones){
  const visited=visitedCountries(), want=getLS('want_countries',[]);
  const nameByCc={}; for(const [n,info] of Object.entries(COUNTRY_MAP))nameByCc[info[0]]=n;
  const done=Object.entries(visited).sort((a,b)=>a[1]<b[1]?1:-1).map(([cc,y])=>

    return `<div class="wt-chip want" data-act="countryWantEdit" data-name="${esc(n)}" role="button" tabindex="0">${fi?flagSvg(fi[0]):''}<span>${esc(n)}</span>

async function initFootprintMap(places){ const el=$('#fpMapEl'),wrap=$('#fpMapWrap'); if(!el||!wrap)return;
  const pts=[...places].filter(p=>p.lat!=null).sort(byDateSort);
  if(!pts.length){ wrap.innerHTML=`<div class="map-fallback">${I('pin',30)}<p>暂无带坐标的足迹<br>在条目上勾选「已到访」或用照片导入足迹</p></div>`; return; }
  if(!navigator.onLine){ wrap.innerHTML=`<div class="map-fallback">${I('offline',30)}<p>离线模式下地图不可用，列表仍然完整</p></div>`; return; }
  try{ await Promise.all([loadCssOnce(LEAFLET.css),loadScriptOnce(LEAFLET.js)]);
    if(typeof L==='undefined')throw new Error('Leaflet 未加载');
    const map=L.map('fpMapEl',{scrollWheelZoom:true,zoomControl:true});
    el._fpMap=map; window._fpMapIns=map;
    mapTileLayer(map);
    L.control.scale({imperial:false}).addTo(map);
    const years=[...new Set(pts.map(x=>(x.date||'').slice(0,4)).filter(Boolean))].sort();
    const yearColor=p=>{ const y=(p.date||'').slice(0,4); const i=years.indexOf(y);
      return DAY_COLORS[(i<0?years.length:i)%DAY_COLORS.length]; };
    const bounds=[];
    const vcnt={}; pts.forEach(p=>{ if(p.name)vcnt[p.name]=(vcnt[p.name]||0)+1; });
    // 轨迹线路：按旅游时间顺序连接相邻足迹，按年分段着色
    for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i];
      L.polyline([[a.lat,a.lng],[b.lat,b.lng]],
        {color:yearColor(b),weight:2.5,opacity:.8,dashArray:'7 8'}).addTo(map); }
    // 序号针：①②③…= 时间顺序
    pts.forEach((p,i)=>{ bounds.push([p.lat,p.lng]);
      const col=yearColor(p); const trip=p.tripId?DB.trips.find(t=>t.id===p.tripId):null;
      const vn=vcnt[p.name]||1; const big=vn>=3, multi=vn>=2;
      const sz=big?30:multi?26:22;
      const ring=multi?'border:2px solid #fff;box-shadow:0 0 0 3px rgba(230,150,60,.55),0 1px 5px rgba(0,0,0,.35)':'border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)';
      const icon=L.divIcon({className:'',
        html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${col};color:#fff;display:flex;align-items:center;justify-content:center;font-size:${big?13:11}px;font-weight:700;${ring}">${multi?vn+'×':i+1}</div>`,
        iconSize:[22,22],iconAnchor:[11,11]});
      const tags=[p.date?fmtYMD(p.date):'未填时间'];
      if(trip)tags.push(esc(trip.title));
      if(p.cat)tags.push(esc(p.cat));
      if(i===0)tags.push('<b style="color:#2e8b57">起点</b>');
      if(i===pts.length-1&&pts.length>1)tags.push('<b style="color:#bf5b4d">最新</b>');
      L.marker([p.lat,p.lng],{icon}).addTo(map)
        .bindPopup(`<b>${esc(p.name)}</b><br><span style="font-size:12px">${tags.join(' · ')}</span>`); });
    if(bounds.length===1)map.setView(bounds[0],9);
    else map.fitBounds(bounds,{padding:[28,28]});
    setTimeout(()=>{ map.invalidateSize();
      if(bounds.length===1)map.setView(bounds[0],9); else map.fitBounds(bounds,{padding:[28,28]});
      if(_heatOn)applyHeatLayer(); },120);
  }catch(e){ wrap.innerHTML=`<div class="map-fallback">${I('offline',30)}<p>地图组件加载失败（${esc(e.message)}）<br>请检查网络后重试，或使用下方列表</p></div>`; } }
ACTIONS.fpCat=d=>{ const p=allPlaces().find(x=>x.name===d.name); if(!p)return;
  const cats=['自然','城市','美食','人文','海岛','其他'];
  const m=openModal(`<h2>类别标签</h2><div class="row wrap">${cats.map(c=>`<button class="chip ${p.cat===c?'active':''}" data-act="fpCatSet" data-name="${esc(d.name)}" data-cat="${c}">${c}</button>`).join('')}</div>`); };
ACTIONS.fpCatSet=d=>{ const p=allPlaces().find(x=>x.name===d.name);
  if(p&&p.ref){ p.ref.category=d.cat; save('visitedPlaces'); } closeTopOverlay(); renderApp(); toast('类别已更新'); };
ACTIONS.fpDel=async d=>{ if(!await confirmDlg('删除这条照片足迹？',{okText:'删除',danger:true}))return;
  DB.visitedPlaces=DB.visitedPlaces.filter(x=>x.name!==d.name||x.source!=='photo');
  save('visitedPlaces'); renderApp(); toast('已删除'); };

async function refreshServerVer(){ try{ if(!navigator.onLine){ const el=$('#srvVer'); if(el)el.textContent='离线'; return; }
  const r=await fetch('index.html?nc='+Date.now(),{cache:'no-store'});
  const m=(await r.text()).match(/name="app-build" content="(\d+)"/);
  const el=$('#srvVer'); if(el)el.textContent=m?('v'+m[1]):'未知'; }catch(e){ const el=$('#srvVer'); if(el)el.textContent='未知'; } }
ACTIONS.checkUpdate=async()=>{ if(!navigator.onLine){ toast('离线状态，无法检查更新'); return; }
  toast('正在检查更新…');
  try{ const r=await fetch('index.html?nc='+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(/name="app-build" content="(\d+)"/);
    const srv=m?Number(m[1]):null;
    const el=$('#srvVer'); if(el)el.textContent=srv?('v'+srv):'未知';
    if(srv==null){ toast('无法读取服务器版本'); return; }
    if(srv>APP_BUILD){
      try{ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k)));
        const regs=await navigator.serviceWorker.getRegistrations(); regs.forEach(g=>g.unregister()); }catch(e){}
      toast('发现新版本 v'+srv+'，正在刷新…');
      setTimeout(()=>location.replace(location.pathname+'?v='+srv),900); }
    else toast('已是最新版本（服务器 v'+srv+'）');
  }catch(e){ toast('检查更新失败：'+e.message); } };

const AI_KEYS=['ai_key','ai_endpoint','ai_model'];
function pageBackup(params){ params.tab=params.tab||'export';
  const tabs=[['export','导出备份'],['restore','导入备份'],['import','导入数据']];
  let body='';
  if(params.tab==='export'){ body=`<div class="card">
    <div class="card-h"><h3>导出备份</h3></div>
    <p class="tiny">包含行程、条目、灵感、账目、打包、日记、主题、假期、足迹、常用语等全部本地数据；<b>不含 AI Key</b>。</p>
    <button class="btn primary block mt8" data-act="doExportBackup">${I('down',15)}导出全部备份（JSON）</button>
    <div class="trip-sec-title">单行程导出</div>
    ${DB.trips.map(t=>`<div class="set-row"><div class="sr-main">${esc(t.title)}<small>${fmtMD(t.startDate)} · ${itemsOf(t.id).length} 项</small></div>
      <button class="btn tiny" data-act="exportTripJson" data-id="${t.id}">JSON</button>
</div>`).join('')||'<div class="tiny">暂无行程</div>'}
    </div>`; }
  if(params.tab==='restore'){ body=`<div class="card"><div class="card-h"><h3>导入备份</h3></div>
    <div class="mode-radio"><label class="active"><input type="radio" name="rsMode" value="merge" checked>合并<br><small class="tiny">按 id 去重合并</small></label>
      <label><input type="radio" name="rsMode" value="overwrite">覆盖<br><small class="tiny">清空后恢复</small></label></div>
    <button class="btn primary block" data-act="pickBackupFile">${I('archive',15)}选择备份文件</button>
    <div class="tiny mt8">也可在首页「导入备份」直接选择文件。</div></div>`; }
  if(params.tab==='import'){ body=`<div class="card"><div class="card-h"><h3>行程 JSON 导入</h3></div>
    <textarea id="tripJson" rows="6" placeholder='{"trip":{...},"items":[...]}'></textarea>
    <button class="btn primary block mt8" data-act="importTripJson">${I('up',15)}解析预览</button></div>
`; }
  return { html: topbar('数据与备份','')
  +`<div class="seg">${tabs.map(([k,n])=>`<button class="${params.tab===k?'active':''}" data-act="bkTab" data-tab="${k}">${n}</button>`).join('')}</div><div style="height:12px"></div>`+body };
}
ACTIONS.bkTab=(d,el)=>{ const p=navStack[navStack.length-1].params; p.tab=d.tab; renderApp(); };
function backupData(){ const data={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(AI_KEYS.includes(k))continue; try{ data[k]=localStorage.getItem(k); }catch(e){} }
  return {app:'travel-planner',version:1,exportedAt:new Date().toISOString(),data}; }
ACTIONS.doExportBackup=()=>{ download(`travel-backup-${todayStr()}.json`,JSON.stringify(backupData(),null,2),'application/json');
  toast('备份已导出（不含 AI Key）'); };
ACTIONS.pickBackupFile=()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f)return;
    let j; try{ j=JSON.parse(await f.text()); }catch(err){ toast('文件解析失败'); return; }
    const data=(j&&j.data&&typeof j.data==='object'&&!Array.isArray(j.data))?j.data
      :(j&&typeof j==='object'&&!Array.isArray(j)?j:null);
    if(!data||!Object.keys(data).length){ toast('备份内容为空，未改动本机数据'); return; }
    if(!ARR_KEYS.some(k=>Object.prototype.hasOwnProperty.call(data,k))){ toast('无法识别的备份文件，未改动本机数据'); return; }
    const modeEl=document.querySelector('input[name=rsMode]:checked');
    const mode=modeEl?modeEl.value:'merge';
    if(mode==='overwrite'){
      for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(!AI_KEYS.includes(k))try{localStorage.removeItem(k);}catch(e){} }
      try{ const db=await idb(); if(db){ await new Promise(res=>{ try{ const tx=db.transaction('kv','readwrite');
        tx.objectStore('kv').clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); tx.onabort=()=>res(); }catch(e){res();} }); }
        else memStore.clear(); }catch(e){} }
    let n=0;
    for(const [k,v] of Object.entries(data)){ if(AI_KEYS.includes(k))continue;
      if(mode==='merge'&&ARR_KEYS.includes(k)){ try{ const cur=JSON.parse(localStorage.getItem(k)||'[]');
        const inc=JSON.parse(v); if(!Array.isArray(cur)||!Array.isArray(inc))throw new Error('bad');
        const ids=new Set(cur.map(x=>x&&x.id));
        const merged=cur.concat(inc.filter(x=>x&&x.id&&!ids.has(x.id)));
        localStorage.setItem(k,JSON.stringify(merged)); n+=inc.length; continue; }catch(e){} }
      try{ localStorage.setItem(k,String(v)); n++; }catch(e){} }
    toast(`备份已导入（${n} 项，${mode==='merge'?'合并':'覆盖'}）`); loadDB(); applyTheme(themeKey()); renderApp(); };
  inp.click(); };
ACTIONS.exportTripJson=d=>{ const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  download(`${t.title}.json`,JSON.stringify({trip:t,items:itemsOf(t.id),
    inspirations:DB.inspirations,visitedPlaces:DB.visitedPlaces.filter(v=>v.tripId===t.id)},null,2),'application/json');
  toast('行程 JSON 已导出'); };
ACTIONS.importTripJson=()=>{ const raw=$('#tripJson').value.trim(); if(!raw){ toast('请先粘贴 JSON'); return; }
  let j; try{ j=JSON.parse(raw); }catch(e){ toast('JSON 解析失败'); return; }
  if(!j.trip||!Array.isArray(j.items)){ toast('缺少 trip 或 items 字段'); return; }
  const rows=j.items.map((it,i)=>`<div class="pt-row"><input type="checkbox" checked data-skip="${i}">
    <input class="pt-time" data-t="${i}" value="${esc(it.time||'')}">
    <input class="pt-title" data-i="${i}" value="${esc(it.title||'')}">
    <input class="pt-cost" data-c="${i}" value="${esc(it.cost!=null?it.cost:'')}"></div>`).join('');
  const m=openModal(`<h2>行程导入预览</h2>
   <label class="f-label">标题</label><input id="tjTitle" value="${esc(j.trip.title||'')}">
   <div class="f-2"><div><label class="f-label">目的地</label><input id="tjDest" value="${esc(j.trip.destination||'')}"></div>
   <div><label class="f-label">币种（批量设置）</label><select id="tjCur">${CURS.map(c=>`<option ${c===(j.trip.currency||'CNY')?'selected':''}>${c}</option>`).join('')}</select></div></div>
   <div class="f-2"><div><label class="f-label">开始</label><input id="tjStart" type="date" value="${esc(j.trip.startDate||todayStr())}"></div>
   <div><label class="f-label">结束</label><input id="tjEnd" type="date" value="${esc(j.trip.endDate||addDays(j.trip.startDate||todayStr(),2))}"></div></div>
   <label class="f-label">条目（取消勾选=跳过，可编辑）</label>
   <div class="prev-table" style="max-height:36dvh;overflow:auto">${rows||'<div class="tiny">无条目</div>'}</div>
   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
     <button class="btn small" data-act="closeOverlay">取消</button><button class="btn primary small" id="tjGo">导入</button></div>`);
  m.el.querySelector('#tjGo').onclick=()=>{ const cur=m.el.querySelector('#tjCur').value;
    const nt={id:'trp_'+uid(),title:m.el.querySelector('#tjTitle').value.trim()||'导入行程',
      destination:m.el.querySelector('#tjDest').value.trim(),
      startDate:m.el.querySelector('#tjStart').value,endDate:m.el.querySelector('#tjEnd').value,
      currency:cur,budget:Number(j.trip.budget)||0,coverColor:DAY_COLORS[Math.floor(Math.random()*8)],
      coverImage:null,notes:'',archived:false,companions:[],createdAt:Date.now(),updatedAt:Date.now()};
    DB.trips.push(nt);
    let n=0;
    j.items.forEach((it,i)=>{ const row=m.el.querySelector(`[data-skip="${i}"]`); if(row&&!row.checked)return;
      const ni={id:'itm_'+uid(),tripId:nt.id,dayIndex:Math.max(0,Number(it.dayIndex)||0),
        time:m.el.querySelector(`[data-t="${i}"]`).value.trim(),
        type:it.type||'other',title:m.el.querySelector(`[data-i="${i}"]`).value.trim()||it.title||'',
        note:it.note||'',cost:Number(m.el.querySelector(`[data-c="${i}"]`).value)||0,currency:'',
        address:it.address||'',lat:it.lat??null,lng:it.lng??null,duration:Number(it.duration)||0,
        bookingRef:it.bookingRef||'',attachments:[],visited:false,locked:false,includedInAnotherTicket:!!it.includedInAnotherTicket};
      DB.items.push(ni); repositionByTime(ni); n++; });
    DB.packingLists.push({tripId:nt.id,categories:defaultPackingCategories()});
    save('trips'); save('items'); save('packingLists'); m.close();
    toast(`已导入 ${n} 条条目`); renderApp(); }; };
