</style>
<script>
/* ==================== 灵感池 ==================== */
function pageInspirations(params){ params.sort=params.sort||'votes'; params.cat=params.cat||'全部';
  let list=DB.inspirations.slice();
  if(params.cat!=='全部')list=list.filter(x=>(x.cat||'(未分类)')===params.cat);
  const next=nextUpcoming();
  let tripNote='';
  if(params.sort==='trip'){
    const related=new Set(tripInspirationMatch(next).map(x=>x.id));
    const anchor=next?itemsOf(next.id).find(x=>x.lat!=null):null;
    const bucket=x=>{ if(x.scheduled)return 3;
      if(related.has(x.id))return 0;
      if(anchor&&x.lat!=null){ const d=haversine(anchor,x); if(d!=null&&d<=150)return 1; }
      return 2; };
    list.sort((a,b)=>{ const ba=bucket(a),bb=bucket(b);
      if(ba!==bb)return ba-bb;
      return ((b.votes.up-b.votes.down)-(a.votes.up-a.votes.down)); });
    tripNote=next?`行程优先：与「${esc(next.title)}」相关的未安排灵感在前，其坐标 150km 内的次之，已安排的排最后。`
      :'没有待出发行程，已按票数排序。';
  }
  else list.sort((a,b)=>params.sort==='votes'
    ?((b.votes.up-b.votes.down)-(a.votes.up-a.votes.down))
    :(b.addedAt-a.addedAt));
  const sel=window._inspSel||(window._inspSel=new Set());
  const cats=[...new Set(DB.inspirations.map(x=>x.cat||'(未分类)'))].sort();
  const stats=inspCatStats();
  const statRows=Object.entries(stats).sort((a,b)=>b[1].plan-a[1].plan).map(([c,v])=>{
    const pct=v.plan?Math.round(v.done/v.plan*100):0;
    return `<div class="row" style="padding:4px 0"><span style="width:86px;flex:none;font-size:13px">${esc(c)}</span>
      <div class="progress" style="flex:1"><i style="width:${pct}%"></i></div>
      <span class="tiny" style="width:88px;text-align:right">已安排 ${v.done}/${v.plan}</span></div>`; }).join('');
  let cityHtml='';
  if(params.view==='city'){
    const groups={};
    for(const ins of list){ const c=inspCityOf(ins); (groups[c]=groups[c]||[]).push(ins); }
    const keys=Object.keys(groups).sort((a,b)=>(a==='未分组'?1:0)-(b==='未分组'?1:0)||a<b?-1:1);
    cityHtml=keys.map(k=>`<div class="trip-sec-title">${esc(k)} · ${groups[k].length}</div>`
      +groups[k].map(ins=>{ const v=ins.votes||{up:0,down:0};
        return `<div class="insp-card ${ins.scheduled?'scheduled':''}">
        <div class="row">${ins.photo?`<img src="${ins.photo}" style="width:64px;height:48px;object-fit:cover;border-radius:8px;flex:none" alt="">`:''}
          <h3 style="flex:1">${esc(ins.title)}</h3>${ins.scheduled?'<span class="badge ok">已安排</span>':''}</div>
        <div class="in-meta">${ins.cost?`<span class="badge warn">≈${esc(String(ins.cost))}${esc(ins.costCur||'')}</span>`:''}
          ${ins.season?`<span class="badge plain">${I('sun',11)}${esc(ins.season)}</span>`:''}
          ${ins.address?`<span class="badge plain">${I('pin',11)}${esc(ins.address)}</span>`:''}</div>
        <div class="row mt8" style="gap:6px">
          <button class="vote-btn" data-act="inspVote" data-id="${ins.id}" data-v="up">${I('up',13)} ${v.up}</button>
          <button class="vote-btn" data-act="inspVote" data-id="${ins.id}" data-v="down">${I('down',13)} ${v.down}</button>
          <span class="spacer"></span>
          <label class="chip" style="min-height:30px;padding:0 10px"><input type="checkbox" data-act="inspSel" data-id="${ins.id}" ${sel.has(ins.id)?'checked':''} style="width:14px;height:14px">选</label>
          <button class="btn tiny soft" data-act="inspPlan" data-id="${ins.id}">${I('calendar',12)}安排到…</button>
          <button class="icon-btn small" data-act="inspMore" data-id="${ins.id}">${I('dots',15)}</button></div>
      </div>`; }).join('')).join('');
  }
  return { html: topbar('灵感池','',
    `<button class="btn small primary" data-act="inspAdd">${I('plus',13)}添加</button>`)
  +(Object.keys(stats).length>1?`<div class="card" style="margin-bottom:10px"><div class="card-h" style="margin-bottom:4px"><h3>愿望进度</h3><span class="tiny">按分类 · 安排进行程即算实现</span></div>${statRows}</div>`:'')
  +`<div class="chips">${[['votes','按票数'],['time','按时间'],['trip','🧳 行程优先']].map(([v,n])=>`<button class="chip ${params.sort===v?'active':''}" data-act="inspSort2" data-sort="${v}">${n}</button>`).join('')}
     <button class="chip ${params.view==='city'?'active':''}" data-act="inspView" data-view="city">🏙 按城市</button>
     <button class="chip ${params.view!=='city'?'active':''}" data-act="inspView" data-view="cat">按分类</button></div>`
  +(params.sort==='trip'&&params.view!=='city'?`<div class="banner">${I('sparkle',16)}<div class="b-txt">${tripNote}</div></div>`:'')
  +(params.view!=='city'?`<div class="chips">${['全部',...cats].map(c=>`<button class="chip ${c===params.cat?'active':''}" data-act="inspCat" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:'')
  +(isDesktop()?`<div class="banner">${I('bulb',16)}<div class="b-txt">电脑端可从剪贴板快速剪藏：
     <div class="b-acts"><button class="btn tiny" data-act="inspPaste">${I('copy',12)}读取剪贴板</button></div></div></div>`:'')
  +(sel.size?`<div class="banner">${I('check',16)}<div class="b-txt">已选 ${sel.size} 条
     <div class="b-acts"><button class="btn tiny primary" data-act="inspPlanBatch">${I('calendar',12)}安排到某天</button>
     ${sel.size>=2?`<button class="btn tiny" data-act="inspCompare">${I('expand',12)}对比</button>`:''}
     <button class="btn tiny" data-act="inspClearSel">取消选择</button></div></div></div>`:'')
  +(params.view==='city'?(list.length?cityHtml:'<div class="empty">'+I('bulb',40)+'<p>还没有灵感</p></div>')
   :(list.length?list.map(ins=>{ const srcLabel=ins.source==='clip'?'剪藏':ins.source==='share'?'分享':'手动';
    const v=ins.votes||{up:0,down:0};
    return `<div class="insp-card ${ins.scheduled?'scheduled':''}">
    <div class="row">${ins.photo?`<img src="${ins.photo}" style="width:64px;height:48px;object-fit:cover;border-radius:8px;flex:none" alt="">`:''}
      <h3 style="flex:1">${esc(ins.title)}</h3>
      ${ins.scheduled?'<span class="badge ok">已安排</span>':''}
      <span class="badge plain">${srcLabel}</span></div>
    <div class="in-meta">${ins.cost?`<span class="badge warn">${I('wallet',11)}≈${esc(String(ins.cost))}${esc(ins.costCur||'')}</span>`:''}
      ${ins.season?`<span class="badge plain">${I('sun',11)}${esc(ins.season)}</span>`:''}
      ${ins.address?`<span class="badge plain">${I('pin',11)}${esc(ins.address)}</span>`:''}
      ${(ins.tags||[]).map(t=>`<span class="badge plain">${esc(t)}</span>`).join('')}
      ${ins.url?`<a class="badge" href="${esc(ins.url)}" target="_blank" rel="noopener">${I('globe',11)}链接</a>`:''}</div>
    ${ins.note?`<div class="in-note">${esc(ins.note)}</div>`:''}
    <div class="row mt8" style="gap:6px">
      <button class="vote-btn ${window._inspVote&&window._inspVote[ins.id]==='up'?'on':''}" data-act="inspVote" data-id="${ins.id}" data-v="up">${I('up',13)} ${v.up}</button>
      <button class="vote-btn ${window._inspVote&&window._inspVote[ins.id]==='down'?'on':''}" data-act="inspVote" data-id="${ins.id}" data-v="down">${I('down',13)} ${v.down}</button>
      <span class="spacer"></span>
      <label class="chip" style="min-height:30px;padding:0 10px"><input type="checkbox" data-act="inspSel" data-id="${ins.id}" ${sel.has(ins.id)?'checked':''} style="width:14px;height:14px">选</label>
      <button class="btn tiny soft" data-act="inspPlan" data-id="${ins.id}">${I('calendar',12)}安排到…</button>
      <button class="icon-btn small" data-act="inspMore" data-id="${ins.id}">${I('dots',15)}</button></div>
  </div>`; }).join('')
  :`<div class="empty">${I('bulb',40)}<p>灵感池还是空的<br>把想去的地方先存进来，规划时再拖进具体某一天</p><button class="btn primary" data-act="inspAdd">${I('plus',15)}添加灵感</button></div>`))
  +(list.length?`<div class="tiny" style="text-align:center;margin-top:6px">选中多条后可批量「安排到某天」，生成正式行程条目</div>`:'') };
}
ACTIONS.inspSort2=(d)=>{ const p=navStack[navStack.length-1].params; p.sort=d.sort; renderApp(); };
ACTIONS.inspView=(d)=>{ const p=navStack[navStack.length-1].params; p.view=d.view||'cat'; renderApp(); };
ACTIONS.inspCat=(d,el)=>{ const p=navStack[navStack.length-1].params; p.cat=d.cat; renderApp(); };
ACTIONS.inspClearSel=()=>{ window._inspSel.clear(); renderApp(); };
ACTIONS.inspSel=(d,el)=>{ if(el.checked)window._inspSel.add(d.id); else window._inspSel.delete(d.id);
  renderApp(); };
ACTIONS.inspVote=d=>{ const ins=DB.inspirations.find(x=>x.id===d.id); if(!ins)return;
  ins.votes=ins.votes||{up:0,down:0};
  const cur=window._inspVote&&window._inspVote[d.id];
  window._inspVote=window._inspVote||{};
  if(cur===d.v){ if(d.v==='up')ins.votes.up=Math.max(0,ins.votes.up-1); else ins.votes.down=Math.max(0,ins.votes.down-1); delete window._inspVote[d.id]; }
  else { if(cur==='up')ins.votes.up=Math.max(0,ins.votes.up-1); if(cur==='down')ins.votes.down=Math.max(0,ins.votes.down-1);
    if(d.v==='up')ins.votes.up++; else ins.votes.down++;
    window._inspVote[d.id]=d.v; }
  save('inspirations'); renderApp(); };
ACTIONS.inspMore=d=>{ const ins=DB.inspirations.find(x=>x.id===d.id); if(!ins)return;
  const m=openModal(`<h2 style="font-size:16px">${esc(ins.title)}</h2>
   <div style="display:flex;flex-direction:column;gap:2px">
    <button class="btn ghost" style="justify-content:flex-start" data-act="inspEdit" data-id="${ins.id}">${I('edit',16)}<span style="color:var(--text)">编辑</span></button>
    <button class="btn ghost" style="justify-content:flex-start" data-act="inspPlan" data-id="${ins.id}">${I('calendar',16)}<span style="color:var(--text)">安排到某天</span></button>
    <button class="btn ghost" style="justify-content:flex-start" id="insDel">${I('trash',16)}<span style="color:var(--err)">删除</span></button></div>`);
  m.el.querySelector('#insDel').onclick=async()=>{ m.close();
    if(!await confirmDlg('删除这条灵感？',{okText:'删除',danger:true}))return;
    DB.inspirations=DB.inspirations.filter(x=>x.id!==ins.id); save('inspirations'); renderApp(); }; };
ACTIONS.inspAdd=()=>inspForm(null);
ACTIONS.inspEdit=d=>inspForm(DB.inspirations.find(x=>x.id===d.id));
const INSP_SEASONS=['全年','1-2月','3-4月','5-6月','7-8月','9-10月','11-12月','樱花季（3月底-4月中）','红叶季（11月中-12月初）','雪季（12-2月）','避暑（7-8月）'];
const INSP_CITIES=['北京','上海','广州','深圳','成都','杭州','南京','西安','重庆','武汉','厦门','青岛','大连','天津','苏州','哈尔滨','三亚','昆明','大理','丽江','香港','澳门','台北','高雄','东京','京都','大阪','奈良','名古屋','札幌','冲绳','福冈','首尔','釜山','曼谷','清迈','普吉','新加坡','吉隆坡','巴厘岛','河内','胡志明市','伦敦','巴黎','罗马','米兰','威尼斯','巴塞罗那','柏林','慕尼黑','苏黎世','布拉格','维也纳','雅典','里斯本','悉尼','墨尔本','纽约','洛杉矶','旧金山','拉斯维加斯','多伦多','温哥华'];
function inspCityOf(ins){ if(!ins)return '未分组';
  if(ins.city)return ins.city;
  const hay=(ins.address||'')+' '+(ins.title||'');
  for(const c of INSP_CITIES)if(hay.includes(c))return c;
  for(const n of Object.keys(COUNTRY_MAP))if(hay.includes(n))return n;
  return '未分组'; }
let _inspPick=null;
ACTIONS.inspMapPick=()=>{ const cur=_inspPick;
  const m=openModal('<h2>在地图上选点</h2><div id="pkMap" style="height:300px;border-radius:12px;background:var(--card2)"></div>'
    +'<div class="tiny mt8" id="pkCoord">'+(cur?cur.lat.toFixed(5)+', '+cur.lng.toFixed(5):'点击地图任意位置放置标记')+'</div>'
    +'<div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px">'
    +'<button class="btn small" data-act="closeOverlay">取消</button><button class="btn primary small" id="pkOk">确认位置</button></div>');
  (async()=>{ try{ await Promise.all([loadCssOnce(LEAFLET.css),loadScriptOnce(LEAFLET.js)]);
    if(typeof L==='undefined')throw new Error('Leaflet 未加载');
    setTimeout(()=>{ const el=document.querySelector('#pkMap'); if(!el)return;
      const map=L.map(el).setView([cur?cur.lat:32,cur?cur.lng:110],cur?13:4);
      mapTileLayer(map);
      let mk=null;
      map.on('click',e=>{ if(mk)map.removeLayer(mk); mk=L.marker(e.latlng).addTo(map);
        const c=m.el.querySelector('#pkCoord'); if(c)c.textContent=e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5);
        m.el._ll=e.latlng; }); },200);
  }catch(e){ const c=m.el.querySelector('#pkCoord'); if(c)c.textContent='地图加载失败：'+e.message; } })();
  m.el.querySelector('#pkOk').onclick=()=>{ if(m.el._ll)_inspPick={lat:m.el._ll.lat,lng:m.el._ll.lng};
    closeTopOverlay();
    const c=document.querySelector('#inCoord');
    if(c)c.textContent=_inspPick?('已选：'+_inspPick.lat.toFixed(5)+', '+_inspPick.lng.toFixed(5)):'未选点'; }; };
function inspForm(ins){ const isNew=!ins; ins=ins||{title:'',note:'',source:'manual',url:'',address:'',lat:null,lng:null,tags:[],votes:{up:0,down:0},scheduled:false,photo:'',cost:0,costCur:'',season:'',city:''};
  _inspPick=(ins.lat!=null)?{lat:ins.lat,lng:ins.lng}:null;
  const sh=openSheet(`<h2>${isNew?'添加灵感':'编辑灵感'}</h2>
   <label class="f-label">名称</label><input id="inTitle" value="${esc(ins.title)}" placeholder="例如：沙溪古镇">
   <label class="f-label">图片（可选，自动压缩）</label><input type="file" id="inPhoto" accept="image/*" style="display:none">
   <div class="row" style="align-items:center;gap:10px">${ins.photo?`<img id="inPhotoPrev" src="${ins.photo}" style="width:96px;height:64px;object-fit:cover;border-radius:8px">`:`<div id="inPhotoPrev" style="width:96px;height:64px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--text-sub)">${I('image',20)}</div>`}
     <button class="btn small" id="inPhotoBtn">${I('image',13)}${ins.photo?'换图':'加图'}</button>
     <button class="btn small" id="inMapBtn">${I('pin',13)}地图选点</button></div>
   <div class="tiny mt8" id="inCoord">${_inspPick?'已选：'+_inspPick.lat.toFixed(5)+', '+_inspPick.lng.toFixed(5):'未选坐标（可选，安排后导航直接可用）'}</div>
   <label class="f-label">预估费用（可选）</label><div class="row"><input id="inCost" type="number" inputmode="decimal" value="${esc(ins.cost||'')}" placeholder="0" style="flex:1"><select id="inCostCur" style="width:88px;flex:none">${CURS.map(c=>`<option ${c===(ins.costCur||'CNY')?'selected':''}>${c}</option>`).join('')}</select></div>
   <label class="f-label">最佳季节（可选）</label><input id="inSeason" list="inspSeasonList" value="${esc(ins.season||'')}" placeholder="如：3-4月 / 樱花季">
   <datalist id="inspSeasonList">${INSP_SEASONS.map(s2=>`<option>${s2}</option>`).join('')}</datalist>
   <label class="f-label">城市（自动识别，可改）</label><input id="inCity" list="inspCityList" value="${esc(ins.city||'')}" placeholder="如：京都">
   <datalist id="inspCityList">${INSP_CITIES.map(c=>`<option>${c}</option>`).join('')}</datalist>
   <label class="f-label">地址 / 位置摘要</label><input id="inAddr" value="${esc(ins.address||'')}">
   <label class="f-label">链接（可选）</label><input id="inUrl" value="${esc(ins.url||'')}" placeholder="https://">
   <label class="f-label">备注</label><textarea id="inNote" rows="2">${esc(ins.note||'')}</textarea>
   <label class="f-label">标签（逗号分隔）</label><input id="inTags" value="${esc((ins.tags||[]).join('，'))}">
   <label class="f-label">分类（愿望清单，如：城市/自然/美食/冒险）</label><input id="inCat" list="inspCatList" value="${esc(ins.cat||'')}">
   <datalist id="inspCatList"><option>城市</option><option>自然</option><option>美食</option><option>冒险</option><option>好友</option><option>独自</option></datalist>
   <div class="row" style="margin-top:16px;gap:10px"><button class="btn block" data-act="closeOverlay">取消</button>
     <button class="btn primary block" id="inSave">${I('check',16)}保存</button></div>`);
  let photoData=ins.photo||'';
  sh.root.querySelector('#inPhotoBtn').onclick=()=>sh.root.querySelector('#inPhoto').click();
  sh.root.querySelector('#inPhoto').onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    compressImage(f,640,0.72).then(data=>{ photoData=data;
      const prev=sh.root.querySelector('#inPhotoPrev');
      if(prev)prev.outerHTML='<img id="inPhotoPrev" src="'+data+'" style="width:96px;height:64px;object-fit:cover;border-radius:8px">';
      const btn=sh.root.querySelector('#inPhotoBtn'); if(btn)btn.textContent='换图'; }); };
  sh.root.querySelector('#inMapBtn').onclick=()=>ACTIONS.inspMapPick();
  sh.root.querySelector('#inAddr').addEventListener('input',debounce(()=>{
    const city=sh.root.querySelector('#inCity');
    if(city&&!city.value.trim()){ const hay=sh.root.querySelector('#inAddr').value;
      for(const c of INSP_CITIES)if(hay.includes(c)){ city.value=c; break; } } },400));
  sh.root.querySelector('#inSave').onclick=()=>{ const title=sh.root.querySelector('#inTitle').value.trim();
    if(!title){ toast('请填写名称'); return; }
    const cost=Number(sh.root.querySelector('#inCost').value)||0;
    const data={title,address:sh.root.querySelector('#inAddr').value.trim(),
      url:sh.root.querySelector('#inUrl').value.trim(),note:sh.root.querySelector('#inNote').value.trim(),
      tags:sh.root.querySelector('#inTags').value.split(/[，,]/).map(x=>x.trim()).filter(Boolean),
      cat:sh.root.querySelector('#inCat').value.trim(),
      photo:photoData,cost,costCur:sh.root.querySelector('#inCostCur').value,
      season:sh.root.querySelector('#inSeason').value.trim(),city:sh.root.querySelector('#inCity').value.trim(),
      lat:_inspPick?_inspPick.lat:null,lng:_inspPick?_inspPick.lng:null};
    if(isNew)DB.inspirations.push(Object.assign({},ins,data,{id:'ins_'+uid(),addedAt:Date.now()}));
    else Object.assign(ins,data);
    save('inspirations'); sh.close(); renderApp(); toast('已保存'); }; }
ACTIONS.inspCompare=()=>{ const ids=[...window._inspSel].slice(0,3);
  const list=ids.map(id=>DB.inspirations.find(x=>x.id===id)).filter(Boolean);
  if(list.length<2){ toast('请先勾选 2-3 条灵感'); return; }
  const row=(label,fn)=>'<tr><th>'+label+'</th>'+list.map(ins=>'<td>'+fn(ins)+'</td>').join('')+'</tr>';
  const m=openModal('<h2>灵感对比</h2><table style="width:100%;border-collapse:collapse;font-size:13px">'
    +'<style>.cmp td,.cmp th{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}.cmp th{width:64px;color:var(--text-sub);font-weight:500;background:var(--card2)}</style>'
    +'<table class="cmp">'+row('名称',x=>'<b>'+esc(x.title)+'</b>')
    +row('图片',x=>x.photo?'<img src="'+x.photo+'" style="width:100%;max-width:130px;border-radius:8px">':'—')

  try{ const dtf=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const p={}; dtf.formatToParts(date).forEach(x=>p[x.type]=x.value);
    return Math.round((Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day),Number(p.hour)%24,Number(p.minute),Number(p.second))-date.getTime())/60000); }
  catch(e){ return 0; } }

/* 日出日落（NOAA 简化算法，纯本地） */
function sunTimes(lat,lng,tz,ds){ try{ const d=parseD(ds||todayStr()); const rad=Math.PI/180;
  const utcMid=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const n=Math.round((utcMid-Date.UTC(2000,0,1,12))/864e5);
  const Js=n-lng/360;
  const M=(357.5291+0.98560028*Js)%360, C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=(M+C+180+102.9372)%360, Jt=Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const delta=Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad))/rad;
  const cosW=(Math.sin(-0.83*rad)-Math.sin(lat*rad)*Math.sin(delta*rad))/(Math.cos(lat*rad)*Math.cos(delta*rad));
  if(cosW>1)return {polar:'极夜（太阳不升起）'}; if(cosW<-1)return {polar:'极昼（太阳不落）'};
  const w=Math.acos(cosW)/rad;
  const fmt=ms=>{ try{ return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz||homeTZ()}).format(new Date(ms)); }catch(e){ return pad2(new Date(ms).getUTCHours())+':'+pad2(new Date(ms).getUTCMinutes()); } };
  return { rise:fmt(utcMid+((Jt-w/360+0.5)%1)*864e5), set:fmt(utcMid+((Jt+w/360+0.5)%1)*864e5) }; }catch(e){ return null; } }

<script>

function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function tripICS(t){ const pad=n=>String(n).padStart(2,'0');
  const stamp=new Date(); const ds=stamp.getFullYear()+pad(stamp.getMonth()+1)+pad(stamp.getDate())+'T'+pad(stamp.getHours())+pad(stamp.getMinutes())+pad(stamp.getSeconds());
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//星轨绘卷//CN','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsEsc(t.title)];
  for(let d=0;d<tripDays(t);d++){ const date=dayDate(t,d); const ymd=date.replace(/-/g,'');
    const its=itemsOfDay(t.id,d);
    if(!its.length){ lines.push('BEGIN:VEVENT','UID:'+t.id+'-d'+d+'@travel-planner','DTSTAMP:'+ds,
      'DTSTART;VALUE=DATE:'+ymd,'DTEND;VALUE=DATE:'+addDays(date,1).replace(/-/g,''),
      'SUMMARY:'+icsEsc(t.title+' · 第'+(d+1)+'天'),'END:VEVENT'); continue; }
    for(const it of its){ const timed=!!it.time;
      lines.push('BEGIN:VEVENT','UID:'+it.id+'@travel-planner','DTSTAMP:'+ds,
        timed?('DTSTART:'+ymd+'T'+it.time.replace(':','')+'00'):('DTSTART;VALUE=DATE:'+ymd),
        timed?('DTEND:'+ymd+'T'+fromMin(toMin(it.time)+Math.max(Number(it.duration)||60,30)).replace(':','')+'00'):('DTEND;VALUE=DATE:'+addDays(date,1).replace(/-/g,'')),
        'SUMMARY:'+icsEsc((it.time?it.time+' ':'')+'['+(TYPE_META[it.type]||TYPE_META.other).name+'] '+it.title));
      const desc=[it.address||'',it.bookingRef?'预订/班次:'+it.bookingRef:'',it.cost?fmtMoney(it.cost,it.currency||t.currency):'',it.note||''].filter(Boolean).join('\n');
      if(desc)lines.push('DESCRIPTION:'+icsEsc(desc));
      if(it.type==='transport'&&it.bookingRef){ lines.push('BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-P1D',
        'DESCRIPTION:'+icsEsc('明天出行：'+it.title+'（可值机/取票）'),'END:VALARM'); }
      lines.push('END:VEVENT'); } }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n'); }

function bindConverters(root){ if(!root)return;
  const fx=fxActiveRates();
  const curSel=(id)=>{ const s=root.querySelector('#'+id); if(!s)return; s.innerHTML=CURS.map(c=>`<option value="${c}">${c}</option>`).join(''); };

  if(from)from.value='USD'; if(to)to.value='CNY';

  const unit=(ia,ib,fAtoB,fBtoA)=>{ const A=root.querySelector('#'+ia),B=root.querySelector('#'+ib);
    if(!A||!B)return; A.addEventListener('input',()=>{ B.value=A.value===''?'':fAtoB(Number(A.value)); });
    B.addEventListener('input',()=>{ A.value=B.value===''?'':fBtoA(Number(B.value)); }); };
  const km2mi=v=>v==null||isNaN(v)?'':(v*0.621371).toFixed(3), mi2km=v=>v==null||isNaN(v)?'':(v/0.621371).toFixed(3);
  const c2f=v=>v==null||isNaN(v)?'':(v*9/5+32).toFixed(1), f2c=v=>v==null||isNaN(v)?'':((v-32)*5/9).toFixed(1);
  const kg2lb=v=>v==null||isNaN(v)?'':(v*2.2046226).toFixed(3), lb2kg=v=>v==null||isNaN(v)?'':(v/2.2046226).toFixed(3);
  const l2g=v=>v==null||isNaN(v)?'':(v*0.2641722).toFixed(3), g2l=v=>v==null||isNaN(v)?'':(v/0.2641722).toFixed(3);
  unit('uKm','uMi',km2mi,mi2km); unit('uC','uF',c2f,f2c); unit('uKg','uLb',kg2lb,lb2kg); unit('uL','uGal',l2g,g2l); }

function makeBoardingPassDataURL(){ const c=document.createElement('canvas'); c.width=480; c.height=200; const x=c.getContext('2d');
  x.fillStyle='#f7f4ec'; x.fillRect(0,0,480,200); x.fillStyle='#2f6f9f'; x.fillRect(0,0,480,54);
  x.fillStyle='#fff'; x.font='700 20px sans-serif'; x.fillText('BOARDING PASS · 登机牌',14,34);
  x.fillStyle='#22333f'; x.font='700 26px sans-serif'; x.fillText('SHA → KIX',14,95);
  x.font='500 13px sans-serif'; x.fillText('上海浦东 T1 → 大阪关西',14,116);
  x.font='400 12px sans-serif'; x.fillText('航班 MU539 · 2026-10-10 09:30 · 登机口 D12 · 座位 32A',14,140);
  x.fillText('乘客 ZHANG SAN · 票号 MU539-EX4K2',14,158);
  let seed=7; for(let i=0;i<58;i++){ seed=(seed*9301+49297)%233280; if(seed/233280>0.45)x.fillRect(300+i*2,120,2,58); }
  x.strokeStyle='#cbd8e2'; x.strokeRect(6,58,468,136);
  return c.toDataURL('image/png'); }
function makeDemoJournalPhoto(){ const c=document.createElement('canvas'); c.width=640; c.height=360; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,640,360); g.addColorStop(0,'#c0564a'); g.addColorStop(.55,'#c07f2d'); g.addColorStop(1,'#e8c9a0');
  x.fillStyle=g; x.fillRect(0,0,640,360);
  x.fillStyle='rgba(255,255,255,.16)'; for(let i=0;i<5;i++){ x.beginPath(); x.arc(500,300-i*40,60+i*10,Math.PI,2*Math.PI); x.fill(); }
  x.fillStyle='#3a2d24'; x.font='700 30px sans-serif'; x.fillText('清水寺 · 红叶',24,64);
  x.font='400 16px sans-serif'; x.fillText('2026.10.10 · 多云 16°C · 示范照片（本地生成）',24,94);
  x.strokeStyle='rgba(58,45,36,.4)'; for(let i=0;i<6;i++){ x.beginPath(); x.moveTo(24,140+i*36); x.quadraticCurveTo(320,120+i*36,616,150+i*36); x.stroke(); }
  return c.toDataURL('image/jpeg',0.8); }
/* 手工构造带 GPS 的 EXIF JPEG（离线、无依赖） */
function buildExifApp1(lat,lng,dt){ const ascii=s=>{ const a=[]; for(const ch of s)a.push(ch.charCodeAt(0)&255); return a; };
  const LE=(v,n)=>{ const a=[]; for(let i=0;i<n;i++)a.push((v>>>(8*i))&255); return a; };
  const dms=v=>{ const a=Math.abs(v); const d=Math.floor(a); const mf=(a-d)*60; const m=Math.floor(mf);
    const s=Math.round((mf-m)*6000); return [[d,1],[m,1],[s,100]]; };
  // 布局：TIFF头8 + IFD0(8~38) + ExifIFD(38~56) + GPS(56~110) + latRat(110) + lngRat(134) + dt(158)
  const tiff=[];
  tiff.push(0x49,0x49,0x2a,0x00,...LE(8,4));
  tiff.push(...LE(2,2));
  tiff.push(...LE(0x8769,2),...LE(4,2),...LE(1,4),...LE(38,4));
  tiff.push(...LE(0x8825,2),...LE(4,2),...LE(1,4),...LE(56,4));
  tiff.push(...LE(0,4));
  tiff.push(...LE(1,2));
  tiff.push(...LE(0x9003,2),...LE(2,2),...LE(20,4),...LE(158,4));
  tiff.push(...LE(0,4));
  tiff.push(...LE(4,2));
  tiff.push(...LE(1,2),...LE(2,2),...LE(2,4),...ascii(lat>=0?'N':'S'),0,0,0);
  tiff.push(...LE(2,2),...LE(5,2),...LE(3,4),...LE(110,4));
  tiff.push(...LE(3,2),...LE(2,2),...LE(2,4),...ascii(lng>=0?'E':'W'),0,0,0);
  tiff.push(...LE(4,2),...LE(5,2),...LE(3,4),...LE(134,4));
  tiff.push(...LE(0,4));
  for(const [n,d] of dms(lat))tiff.push(...LE(n,4),...LE(d,4));
  for(const [n,d] of dms(lng))tiff.push(...LE(n,4),...LE(d,4));
  tiff.push(...ascii(dt+'\0'));
  const payload=[0x45,0x78,0x69,0x66,0,0,...tiff];
  const len=payload.length+2;
  return [0xFF,0xE1,(len>>8)&255,len&255,...payload]; }
function makeExifJpeg(lat,lng,dt,label){ return new Promise(res=>{ const c=document.createElement('canvas'); c.width=360; c.height=220;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,360,220); g.addColorStop(0,'#3f7a52'); g.addColorStop(1,'#b0653c');
  x.fillStyle=g; x.fillRect(0,0,360,220);
  x.fillStyle='rgba(255,255,255,.92)'; x.font='700 21px sans-serif'; x.fillText(label,18,52);
  x.font='400 12px sans-serif'; x.fillText('示范照片 · 本地生成'+(lat!=null?` · GPS ${lat.toFixed(4)}, ${lng.toFixed(4)}`:' · 无 GPS'),18,80);
  x.fillText(dt,18,100); x.strokeStyle='rgba(255,255,255,.5)'; x.strokeRect(10,10,340,200);
  c.toBlob(async b=>{ const buf=new Uint8Array(await b.arrayBuffer());
    let out=buf;
    if(lat!=null&&lng!=null){ const app1=buildExifApp1(lat,lng,dt);
      out=new Uint8Array(buf.length+app1.length);
      out.set(buf.slice(0,2),0); out.set(app1,2); out.set(buf.slice(2),2+app1.length); }
    res(new File([out],label+'.jpg',{type:'image/jpeg'})); },'image/jpeg',0.85); }); }
async function demoExifFiles(){ return Promise.all([

function foodForm(tripId,f){ const t=DB.trips.find(x=>x.id===tripId); const isNew=!f;
  f=f||{name:'',note:'',prio:''};
  const sh=openSheet(`<h2>${isNew?'添加美食打卡':'编辑美食打卡'}</h2>
   <label class="f-label">店名/食物</label><input id="ffName" value="${esc(f.name)}">
   <label class="f-label">地址 / 备注</label><input id="ffNote" value="${esc(f.note||'')}" placeholder="例如：旺角登打士街43H 1楼">
   <label class="f-label">重要程度</label><div class="scene-grid" id="ffPrio">
     <button type="button" class="sc-opt ${f.prio==='must'?'active':''}" data-v="must">必打卡</button>
     <button type="button" class="sc-opt ${f.prio==='nice'?'active':''}" data-v="nice">可打卡</button>
     <button type="button" class="sc-opt ${!f.prio?'active':''}" data-v="">随缘</button></div>
   <div class="row" style="margin-top:16px;gap:10px"><button class="btn block" data-act="closeOverlay">取消</button>
     <button class="btn primary block" id="ffSave">${I('check',16)}保存</button></div>`);
  let prio=f.prio||'';
  sh.root.querySelectorAll('#ffPrio .sc-opt').forEach(b=>b.onclick=()=>{ prio=b.dataset.v;
    sh.root.querySelectorAll('#ffPrio .sc-opt').forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
  sh.root.querySelector('#ffSave').onclick=()=>{ const name=sh.root.querySelector('#ffName').value.trim();
    if(!name){ toast('请填写名称'); return; }
    const data={name,note:sh.root.querySelector('#ffNote').value.trim(),prio};
    t.foods=t.foods||[];
    if(isNew)t.foods.push(Object.assign({id:'fd_'+uid(),done:false},data));
    else Object.assign(f,data);
    saveTripField(t,{foods:t.foods}); sh.close(); renderApp(); }; }
ACTIONS.foodToggle=d=>{ const t=DB.trips.find(x=>x.id===d.trip); const f=(t.foods||[]).find(x=>x.id===d.id);
  f.done=!f.done; saveTripField(t,{foods:t.foods}); renderApp(); };
ACTIONS.foodMore=d=>{ const t=DB.trips.find(x=>x.id===d.trip); const f=(t.foods||[]).find(x=>x.id===d.id);
  const m=openModal(`<h2 style="font-size:16px">${esc(f.name)}</h2>
   <div style="display:flex;flex-direction:column;gap:2px">
    <button class="btn ghost" style="justify-content:flex-start" data-act="foodEdit" data-trip="${d.trip}" data-id="${f.id}">${I('edit',16)}<span style="color:var(--text)">编辑</span></button>
    <button class="btn ghost" style="justify-content:flex-start" id="fdDel">${I('trash',16)}<span style="color:var(--err)">删除</span></button></div>`);
  m.el.querySelector('#fdDel').onclick=()=>{ t2save(d.trip,{foods:(DB.trips.find(x=>x.id===d.trip).foods||[]).filter(x=>x.id!==d.id)});
    m.close(); renderApp(); toast('已删除'); }; };
function t2save(tripId,patch){ const t=DB.trips.find(x=>x.id===tripId); Object.assign(t,patch); t.updatedAt=Date.now(); save('trips'); }
ACTIONS.souvAdd=d=>{ const t=DB.trips.find(x=>x.id===d.trip);
  const m=openModal(`<h2>添加手信</h2><input id="svName" placeholder="名称，如：珍妮小熊曲奇">
   <label class="f-label">备注（在哪买）</label><input id="svNote" placeholder="例如：尖沙咀 711">
   <div class="row" style="justify-content:flex-end;margin-top:12px;gap:8px">
     <button class="btn small" data-act="closeOverlay">取消</button><button class="btn primary small" id="svGo">添加</button></div>`);
  m.el.querySelector('#svGo').onclick=()=>{ const name=m.el.querySelector('#svName').value.trim();
    if(!name){ toast('请填写名称'); return; }
    t.souvenirs=t.souvenirs||[];
    t.souvenirs.push({id:'sv_'+uid(),name,note:m.el.querySelector('#svNote').value.trim(),done:false});
    saveTripField(t,{souvenirs:t.souvenirs}); m.close(); renderApp(); }; };
ACTIONS.souvEdit=d=>{ const t=DB.trips.find(x=>x.id===d.trip); const s=(t.souvenirs||[]).find(x=>x.id===d.id);
  const n=prompt('修改手信名称',s.name); if(n&&n.trim()){ s.name=n.trim(); saveTripField(t,{souvenirs:t.souvenirs}); renderApp(); } };
ACTIONS.souvToggle=d=>{ const t=DB.trips.find(x=>x.id===d.trip); const s=(t.souvenirs||[]).find(x=>x.id===d.id);
  s.done=!s.done; saveTripField(t,{souvenirs:t.souvenirs}); renderApp(); };
ACTIONS.souvDel=d=>{ const t=DB.trips.find(x=>x.id===d.trip);
  t2save(d.trip,{souvenirs:(t.souvenirs||[]).filter(x=>x.id!==d.id)}); renderApp(); };
ACTIONS.outfitSet=(d,el)=>{ const t=DB.trips.find(x=>x.id===d.trip);
  t.outfits=t.outfits||[]; let o=t.outfits.find(x=>x.day===Number(d.day));
  const text=el.value.trim();
  if(!o&&text)t.outfits.push({id:'of_'+uid(),day:Number(d.day),text,done:false});
  else if(o&&!text)t.outfits=t.outfits.filter(x=>x.day!==Number(d.day));
  else if(o)o.text=text;
  saveTripField(t,{outfits:t.outfits}); };
/* ==================== 出发/返程信息 · 注意事项 · 准备流程 ==================== */
function autoDepartInfo(t){ const its=itemsOf(t.id).filter(x=>x.type==='transport')
    .sort((a,b)=>(a.dayIndex||0)-(b.dayIndex||0)||toMin(a.time||'23:59')-toMin(b.time||'23:59'));
  const f=its[0]; return f?`${f.title}${f.time?' '+f.time:''}${f.bookingRef?'（'+f.bookingRef+'）':''}`:''; }
function autoReturnInfo(t){ const its=itemsOf(t.id).filter(x=>x.type==='transport')
    .sort((a,b)=>(a.dayIndex||0)-(b.dayIndex||0)||toMin(a.time||'23:59')-toMin(b.time||'23:59'));
  const f=its[its.length-1]; return f?`${f.title}${f.time?' '+f.time:''}${f.bookingRef?'（'+f.bookingRef+'）':''}`:''; }
function tripTransitCard(t){ const dep=t.departInfo||autoDepartInfo(t);
  const ret=t.returnInfo||autoReturnInfo(t);
  const prep=t.prep&&t.prep.length?t.prep:defaultPrepSteps();
  const done=prep.filter(p=>p.done).length;
  if(!dep&&!ret&&!t.notes&&!(t.prep&&t.prep.length)&&done===prep.length)return '';
  return `<div class="card" style="padding:12px 14px">
   ${dep||ret?`<div class="row wrap" style="gap:6px">
     ${dep?`<span class="badge plain">${I('send',11)} 出发 ${esc(dep)}</span>`:''}
     ${ret?`<span class="badge plain">${I('back',11)} 返程 ${esc(ret)}</span>`:''}
     <span class="badge plain">${tripDays(t)} 天 ${tripDays(t)-1} 晚</span></div>`:''}
   ${t.notes?`<div class="tiny mt8" style="white-space:pre-wrap">${I('note',11)} ${esc(t.notes)}</div>`:''}
   <details class="mt8" ${done<prep.length?'open':''}><summary class="tiny" style="cursor:pointer;list-style:none">✔ 出发前流程 ${done}/${prep.length}（点开勾选）</summary>
     <div style="margin-top:6px">${prep.map(p=>`<label class="row" style="padding:5px 0;font-size:14px;cursor:pointer">
       <input type="checkbox" data-act="prepToggle" data-trip="${t.id}" data-id="${p.id}" ${p.done?'checked':''} style="width:16px;height:16px">
       <span style="${p.done?'text-decoration:line-through;color:var(--text-sub)':''}">${esc(p.text)}</span></label>`).join('')}
       <div class="row mt8"><input id="prepNew" placeholder="添加自定义步骤" style="min-height:36px" >
         <button class="btn small" data-act="prepAdd" data-trip="${t.id}">${I('plus',13)}</button></div></div></details>
   <details class="mt8" ${(t.customReminders||[]).some(r=>!r.done&&r.date<=addDays(todayStr(),2))?'open':''}><summary class="tiny" style="cursor:pointer;list-style:none">⏰ 自定义提醒${(t.customReminders||[]).length?`（${(t.customReminders||[]).filter(r=>!r.done).length} 项待办）`:''}</summary>
     <div style="margin-top:6px">${(t.customReminders||[]).slice().sort((x,y)=>x.date<y.date?-1:1).map(r=>`<label class="row" style="padding:5px 0;font-size:14px;cursor:pointer">
       <input type="checkbox" data-act="remToggle" data-trip="${t.id}" data-id="${r.id}" ${r.done?'checked':''} style="width:16px;height:16px">
       <span style="flex:1;${r.done?'text-decoration:line-through;color:var(--text-sub)':''}">${fmtMD(r.date)} · ${esc(r.text)}</span>
       <button class="btn tiny danger" data-act="remDel" data-trip="${t.id}" data-id="${r.id}">${I('trash',11)}</button></label>`).join('')||'<div class="tiny">签证截止、退票截止、取票…到点会在首页提醒</div>'}
       <div class="row mt8"><input id="remDate" type="date" style="min-height:36px;max-width:150px"><input id="remText" placeholder="提醒内容" style="min-height:36px"><button class="btn small" data-act="remAdd" data-trip="${t.id}">${I('plus',13)}</button></div></div></details></div>`; }
function defaultPrepSteps(){ return ['确定行程','预订机票/车票','信息收集（攻略/美食）','行程规划','预订酒店','设置预算']
  .map(x=>({id:'pp_'+uid(),text:x,done:false})); }
ACTIONS.prepToggle=d=>{ const t=DB.trips.find(x=>x.id===d.trip);
  t.prep=t.prep&&t.prep.length?t.prep:defaultPrepSteps();
  const p=t.prep.find(x=>x.id===d.id); if(p)p.done=!p.done;
  saveTripField(t,{prep:t.prep}); renderApp(); };
ACTIONS.prepAdd=d=>{ const t=DB.trips.find(x=>x.id===d.trip); const inp=$('#prepNew');
  if(!inp||!inp.value.trim())return;
  t.prep=t.prep&&t.prep.length?t.prep:defaultPrepSteps();
  t.prep.push({id:'pp_'+uid(),text:inp.value.trim(),done:false});
  saveTripField(t,{prep:t.prep}); renderApp(); };

/* ==================== 条目评分与体验总结 ==================== */
function ratingStars(n){ let s=''; for(let i=1;i<=5;i++)s+=`<svg width="12" height="12" viewBox="0 0 24 24" fill="${i<=n?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${ICONS.star}</svg>`;
  return `<span style="color:var(--warn);display:inline-flex;align-items:center;gap:1px;vertical-align:-2px">${s}</span>`; }
ACTIONS.itemRate=d=>{ const it=DB.items.find(x=>x.id===d.id); if(!it)return;
  const m=openModal(`<h2 style="font-size:16px">${esc(it.title)} · 游玩评分</h2>
   <div class="row" id="rtStars" style="gap:4px;justify-content:center;margin:12px 0">${[1,2,3,4,5].map(i=>
     `<button class="icon-btn" data-v="${i}" style="color:${(it.rating||0)>=i?'var(--warn)':'var(--line)'}">${I('star',30)}</button>`).join('')}</div>
   <label class="f-label">一句话体验总结</label><input id="rtReview" value="${esc(it.review||'')}" placeholder="例如：拍照太好看啦！人多也是真的">
   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
     <button class="btn small" data-act="closeOverlay">取消</button><button class="btn primary small" id="rtGo">保存</button></div>`);
  let rating=it.rating||0;
  m.el.querySelectorAll('#rtStars button').forEach(b=>b.onclick=()=>{ rating=Number(b.dataset.v);
    m.el.querySelectorAll('#rtStars button').forEach((x,i)=>x.style.color=i<rating?'var(--warn)':'var(--line)'); });
  m.el.querySelector('#rtGo').onclick=()=>{ it.rating=rating||undefined; it.review=m.el.querySelector('#rtReview').value.trim()||undefined;
    if(!it.rating)delete it.rating; if(!it.review)delete it.review;
    save('items'); m.close(); renderApp(); toast('已保存评分'); }; };

/* ==================== 愿望分类进度（灵感池） ==================== */
function inspCatStats(){ const cats={};
  for(const ins of DB.inspirations){ const c=ins.cat||'(未分类)';
    cats[c]=cats[c]||{plan:0,done:0}; cats[c].plan++; if(ins.scheduled)cats[c].done++; }
  return cats; }

<script>
/* ==================== v1.4：汇率在线更新 · 天气预报卡 · 语音朗读 · 国家足迹 · 超支提醒 ==================== */
/* 汇率在线更新（可选，电脑/联网，open.er-api.com 免费无 Key） */
ACTIONS.fxUpdateOnline=async()=>{ if(!navigator.onLine){ toast('离线状态，无法更新汇率'); return; }
  toast('正在在线更新汇率…');
  const ok=await fxAutoUpdate(true);
  if(ok){ toast('已联网更新汇率（来源 er-api.com，手动值保留为离线回退）');
    if(navStack[navStack.length-1].page==='settings')renderApp(); }
  else toast('汇率更新失败'); };
function fxUpdatedAtText(){ const a=getLS('fx_rates_auto',null);
  return a&&a.at?`当前使用联网汇率（更新于 ${new Date(a.at).toLocaleString('zh-CN')}），手动汇率作离线回退`:'当前使用手动汇率（联网后自动更新）'; }

/* 目的地天气预报卡（电脑/联网，Open-Meteo） */
function weatherCardHtml(){ if(!isDesktop()||!navigator.onLine)return '';
  return `<div class="card" id="wxCard" style="display:none"><div class="card-h"><h3>${I('cloud',16)} 目的地天气预报</h3><span class="tiny">Open-Meteo</span></div><div id="wxCardBody" class="tiny">加载中…</div></div>`; }
async function fillWeatherCard(t){ const wrap=$('#wxCard'); if(!wrap)return;
  const anchor=itemsOf(t.id).find(x=>x.lat!=null);
  if(!anchor)return;
  try{ const start=t.startDate, end=dayDate(t,Math.min(tripDays(t)-1,9));
    let daily=_wxMem[t.id];
    if(!daily){ daily=await Promise.race([ fetchWeather(anchor.lat,anchor.lng,start,end),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('超时')),6000)) ]);
      _wxMem[t.id]=daily; }
    if(!daily||!daily.time)return;
    const rows=daily.time.map((dt,i)=>{ const rain=daily.precipitation_probability_max[i]||0;
      const tmax=daily.temperature_2m_max?Math.round(daily.temperature_2m_max[i]):'—';
      const tmin=daily.temperature_2m_min?Math.round(daily.temperature_2m_min[i]):'—';
      return `<tr><td style="padding:3px 8px 3px 0">${fmtMD(dt)} ${wdCN(dt)}</td>
        <td style="padding:3px 8px">${rain>=50?'🌧 '+rain+'%':rain>=30?'🌦 '+rain+'%':'☀️'}</td>
        <td style="padding:3px 8px;text-align:center"><b style="color:var(--err)">${tmax}°</b> / <b style="color:var(--primary)">${tmin}°</b></td>
        <td style="padding:3px 0;text-align:right">${Math.round(daily.temperature_2m_min[i])}~${Math.round(daily.temperature_2m_max[i])}°C</td></tr>`; }).join('');
    wrap.style.display=''; 
    wrap.querySelector('#wxCardBody').innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:13px">${rows}</table>`;
  }catch(e){ /* 静默降级：不显示卡片 */ } }

/* 常用语语音朗读（浏览器离线 TTS） */
ACTIONS.phSpeak=(d,el)=>{ try{ if(!('speechSynthesis' in window)){ toast('此浏览器不支持语音合成'); return; }
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
    const u=new SpeechSynthesisUtterance(d.text);
    u.lang=d.lang||'en-US'; u.rate=0.85;
    speechSynthesis.speak(u);
  }catch(e){ toast('朗读失败：'+e.message); } };

/* 国家足迹（去过/想去，AdventureLog 式） */
function visitedCountries(){ const m={};
  for(const t of DB.trips){ const fi=flagOf(t.destination);
    if(fi){ const y=t.startDate.slice(0,4);
      if(!m[fi[0]]||y<m[fi[0]])m[fi[0]]=y; } }
  return m; } // cc -> 最早年份
function ccName(cc){ for(const [n2,info] of Object.entries(COUNTRY_MAP))if(info[0]===cc)return n2; return cc; }
function cwPreview(inp,prev){ const upd=()=>{ const fi=flagOf(inp.value.trim());
    prev.innerHTML=fi?('识别国家：'+esc(ccName(fi[0]))+' '+flagSvg(fi[0],20)):'<span style="color:var(--text-sub)">未识别到已知国家（仍可保存，无国旗）</span>'; };
  inp.addEventListener('input',upd); upd(); }
ACTIONS.countryWantAdd=()=>{ const names=Object.keys(COUNTRY_MAP).sort();
  const m=openModal(`<h2>添加「想去」的国家/地区</h2>

/* ==================== 字段渲染器 ==================== */
function renderField(f, val, tripCur, itemCur) {
  const v = val != null ? val : '';
  const id = 'if_' + f.key;
  switch (f.ft) {
    case 'text': return `<label class="f-label">${f.label}</label><input id="${id}" value="${esc(v)}" placeholder="${f.ph||''}">`;
    case 'textarea': return `<label class="f-label">${f.label}</label><textarea id="${id}" rows="2" placeholder="${f.ph||''}">${esc(v)}</textarea>`;
    case 'time': return `<label class="f-label">${f.label}</label><input id="${id}" type="time" value="${esc(v)}">`;
    case 'date': return `<label class="f-label">${f.label}</label><input id="${id}" type="date" value="${esc(v)}">`;
    case 'sel_edit': { const custom = getCustomOpts(f.key);
      const all = [...new Set([...(f.options||[]), ...custom])];
      return `<label class="f-label">${f.label} <span class="tiny" style="font-weight:400">(可输入)</span></label><input id="${id}" list="dl_${f.key}" value="${esc(v)}" placeholder="选择或输入" autocomplete="off" style="min-height:40px"><datalist id="dl_${f.key}">${all.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`; }
    case 'status': return `<label class="f-label">${f.label}</label><select id="${id}">${ITEM_STATUSES.map((s,i)=>`<option value="${ITEM_STATUS_KEYS[i]}" ${v===ITEM_STATUS_KEYS[i]?'selected':''}>${s}</option>`).join('')}</select>`;
    case 'prio': return `<label class="f-label">${f.label}</label><select id="${id}">${PRIO_OPTS.map(o=>`<option value="${o.v}" ${v===o.v?'selected':''}>${o.n}</option>`).join('')}</select>`;
    case 'rating': return `<label class="f-label">${f.label}</label><select id="${id}"><option value="">未评分</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${v===n?'selected':''}>${'★'.repeat(n)} ${n}分</option>`).join('')}</select>`;
    case 'cost': { const defCur = (itemCur && CURS.includes(itemCur)) ? itemCur : tripCur;
      return `<label class="f-label">${f.label}</label><div class="row" style="gap:6px"><input id="${id}" type="number" inputmode="decimal" value="${esc(v)}" style="flex:1"><select id="ifCur" style="width:90px;flex:none"><option value="">行程</option>${CURS.map(c=>`<option ${c===defCur?'selected':''}>${c}</option>`).join('')}</select></div>`; }
    case 'photo': { const has = !!v;
      return `<label class="f-label">${f.label}</label><input type="file" id="${id}_file" accept="image/*" style="display:none"><div>${has?`<img id="${id}_prev" src="${v}" class="if-photo">`:`<div id="${id}_prev" class="if-photo-empty">${I('image',24)}</div>`}</div><button type="button" class="btn small mt8" id="${id}_btn">${I('image',13)}${has?'更换图片':'添加图片'}</button>`; }
    case 'timerange': return `<label class="f-label">${f.label}</label><div class="row" style="gap:6px;align-items:center"><input id="${id}_start" type="time" value="${esc(v?.start||'')}" style="flex:1;min-height:40px"><span class="tiny">至</span><input id="${id}_end" type="time" value="${esc(v?.end||'')}" style="flex:1;min-height:40px"></div>`;
    case 'autodur': return `<label class="f-label">${f.label}（自动计算）</label><input id="${id}" readonly value="${esc(v)}" style="color:var(--primary);font-weight:600">`;
    case 'subs': { const items = v || [];

          <input data-sub="${i}" data-sub-k="title" value="${esc(s.title||'')}" placeholder="子项名称" style="min-height:34px;margin-bottom:4px">
          <input data-sub="${i}" data-sub-k="note" value="${esc(s.note||'')}" placeholder="备注" style="min-height:34px"></div>`).join('')}</div>

/* 字段值收集器 */
function collectFieldValue(f, root) {
  const id = '#if_' + f.key;
  switch (f.ft) {
    case 'cost': { const amt = root.querySelector('#if_cost'); const cur = root.querySelector('#ifCur');
      return { cost: amt ? Number(amt.value) || 0 : 0, currency: cur ? cur.value : '' }; }
    case 'timerange': { const s = root.querySelector(id + '_start'), e = root.querySelector(id + '_end');
      return { start: s?.value || '', end: e?.value || '' }; }
    case 'photo': return photoData || '';
    case 'subs': { const els = root.querySelectorAll('[data-sub]');
      const map = {}; els.forEach(el => { const i = Number(el.dataset.sub), k = el.dataset.subK;
        if (!map[i]) map[i] = {}; map[i][k] = el.value; });
      return Object.values(map).filter(s => s.title); }
    case 'autodur': { const el = root.querySelector(id); return el?.value || ''; }
    default: { const el = root.querySelector(id); return el ? el.value.trim() : ''; }
  }
}

/* ==================== 可编辑下拉选项 ==================== */
function getCustomOpts(key) { return getLS('custom_opts_' + key, []); }
function addCustomOpt(key, val) { if (!val) return; const opts = getCustomOpts(key);
  if (!opts.includes(val)) { opts.push(val); setLS('custom_opts_' + key, opts); } }

/* ==================== 币种根据地址自动判定 ==================== */
const ADDR_CURRENCY = [
  { kw:['日本','东京','大阪','京都','奈良','神户','北海道','冲绳'], cur:'JPY' },
  { kw:['中国','北京','上海','广州','深圳','成都','大理','丽江','西安','杭州'], cur:'CNY' },
  { kw:['韩国','首尔','釜山'], cur:'KRW' }, { kw:['泰国','曼谷','清迈'], cur:'THB' },
  { kw:['新加坡'], cur:'SGD' }, { kw:['马来西亚','吉隆坡'], cur:'MYR' },
  { kw:['美国','纽约','洛杉矶','旧金山'], cur:'USD' }, { kw:['英国','伦敦'], cur:'GBP' },
  { kw:['法国','巴黎','里昂'], cur:'EUR' }, { kw:['德国','柏林','慕尼黑'], cur:'EUR' },
  { kw:['意大利','罗马','米兰'], cur:'EUR' }, { kw:['西班牙','巴塞罗那'], cur:'EUR' },
  { kw:['瑞士','苏黎世'], cur:'CHF' }, { kw:['澳大利亚','悉尼'], cur:'AUD' },
  { kw:['加拿大','多伦多','温哥华'], cur:'CAD' }, { kw:['香港','旺角','尖沙咀'], cur:'HKD' },
  { kw:['澳门'], cur:'MOP' }, { kw:['台湾','台北'], cur:'TWD' },
  { kw:['越南','河内'], cur:'VND' }, { kw:['印尼','巴厘岛'], cur:'IDR' },
  { kw:['阿联酋','迪拜'], cur:'AED' }, { kw:['土耳其','伊斯坦布尔'], cur:'TRY' },
];
function detectCurrency(address) { if (!address) return null;
  for (const {kw,cur} of ADDR_CURRENCY) { if (kw.some(k => address.includes(k))) return cur; } return null; }
function wireCurrencyAutoDetect(root, addrSel, curSel, tripCur) {
  const addrEl = root.querySelector(addrSel); const curEl = root.querySelector(curSel);
  if (!addrEl || !curEl) return;
  addrEl.addEventListener('input', debounce(() => { const addr = addrEl.value;
    const detected = detectCurrency(addr);
    if (detected && detected !== tripCur) { curEl.value = detected; curEl.dispatchEvent(new Event('change', {bubbles:true})); }
  }, 400));
}

     <div class="nl-box"><div class="tiny" style="color:var(--primary)">${I('sparkle',12)} 快速添加</div>
       <input id="nlInput" placeholder="输入一行，自动识别">
       <div class="nl-parse-result" id="nlResult"></div></div>
     <div class="chips" id="ifTypeChips" style="margin:10px 0 4px">${ITEM_TYPES.map(x=>
       `<button type="button" class="chip ${curType===x.key?'active':''}" data-type="${x.key}">${x.name}</button>`).join('')}</div>
     <div id="ifDynFields"></div>
     <div id="attArea">${attListHtml(it)}</div>
     <div class="row" style="margin-top:10px"><button class="btn small" id="attAddBtn">${I('up',14)}添加附件</button>
       <input type="file" id="attFile" accept="image/*,application/pdf" multiple style="display:none"></div>
     <div class="row" style="margin-top:16px;gap:10px">
       ${isNew?'':`<button class="btn danger" id="ifDel">${I('trash',16)}</button>`}
       <button class="btn block" data-act="closeOverlay">取消</button>
       <button class="btn primary block" id="ifSave">${I('check',16)}保存</button></div></div>`);
  if (hasFAB) { sh.root.querySelectorAll('[data-pick-day]').forEach(b => b.onclick = () => {
    curDay = Number(b.dataset.pickDay); it.dayIndex = curDay;
    sh.root.querySelector('#ifDayPicker').style.display = 'none';
    sh.root.querySelector('#ifFormBody').style.display = ''; }); }
  /* === 动态渲染（重渲染前先把已输入的值同步回状态，防止丢失） === */
  const syncFromDom = () => {
    for (const f of (TYPE_SCHEMAS[curType] || [])) {
      if (f.ft === 'cost') { const el = sh.root.querySelector('#if_cost'); if (el) it.cost = el.value;
        const c = sh.root.querySelector('#ifCur'); if (c && c.value) it.currency = c.value; continue; }
      if (f.ft === 'status' || f.ft === 'prio') { const el = sh.root.querySelector('#if_' + f.key); if (el) it[f.key] = el.value; continue; }
      if (f.ft === 'rating') { const el = sh.root.querySelector('#if_' + f.key); if (el) it[f.key] = el.value ? Number(el.value) : undefined; continue; }
      if (['photo','subs','autodur'].includes(f.ft)) continue;
      if (f.ft === 'timerange') { const s = sh.root.querySelector('#if_' + f.key + '_start'), e = sh.root.querySelector('#if_' + f.key + '_end');
        if (s) it[f.key + '_start'] = s.value; if (e) it[f.key + '_end'] = e.value; continue; }
      const el = sh.root.querySelector('#if_' + f.key);
      if (el) it[f.key] = el.value;
    }
  };
  const renderDyn = (keep) => {
    if (keep) syncFromDom();
    const schema = TYPE_SCHEMAS[curType] || [];
    const tripCur = t.currency || 'CNY';
    let html = '';
    for (const f of schema) {
      let val;
      if (f.ft === 'cost') val = it.cost || '';
      else if (f.ft === 'status') val = it.status || 'planned';
      else if (f.ft === 'prio') val = it.priority || '';
      else if (f.ft === 'rating') val = it.rating;
      else if (f.ft === 'photo') val = photoData;
      else if (f.ft === 'subs') val = subs;
      else if (f.ft === 'autodur') val = calcDuration(it.time, it.arriveTime);
      else if (f.ft === 'timerange') val = { start: it[f.key + '_start'] || it[f.key] || '',
        end: it[f.key + '_end'] || (f.key === 'openStart' ? (it.openEnd || '') : '') };
      else val = it[f.key] || '';
      html += renderField(f, val, tripCur, it.currency);
    }
    sh.root.querySelector('#ifDynFields').innerHTML = html;
    const pb = sh.root.querySelector('#if_photo_btn');
    if (pb) { pb.onclick = () => sh.root.querySelector('#if_photo_file').click();
      const fi = sh.root.querySelector('#if_photo_file');
      if (fi) fi.onchange = e => { const f2 = e.target.files[0]; if (!f2) return;
        compressImage(f2, 640, 0.7).then(d => { photoData = d;
          const prev = sh.root.querySelector('#if_photo_prev');
          if (prev) prev.outerHTML = `<img id="${'if_photo_prev'}" src="${d}" class="if-photo">`; }); }; }
    const durEl = sh.root.querySelector('#if_durationAuto');
    if (durEl) { const upd = () => { const d = sh.root.querySelector('#if_time'), a = sh.root.querySelector('#if_arriveTime');
        if (d && a) durEl.value = calcDuration(d.value, a.value); };
      const tEl = sh.root.querySelector('#if_time'); if (tEl) tEl.addEventListener('change', upd);
      const aEl = sh.root.querySelector('#if_arriveTime'); if (aEl) aEl.addEventListener('change', upd); }
    wireCurrencyAutoDetect(sh.root, '#if_address', '#ifCur', t.currency || 'CNY');
    const curEl2 = sh.root.querySelector('#ifCur');
    if (curEl2) curEl2.addEventListener('change', () => { curTouched = true; });
  };
  renderDyn();
  sh.root.querySelectorAll('#ifTypeChips .chip').forEach(b => b.onclick = () => {
    curType = b.dataset.type;
    sh.root.querySelectorAll('#ifTypeChips .chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); renderDyn(true); });
  /* NL 快速添加 */
  sh.root.querySelector('#nlInput').addEventListener('input', debounce(() => {
    const r2 = nlParse(sh.root.querySelector('#nlInput').value);
    const box = sh.root.querySelector('#nlResult');
    if (!r2) { box.innerHTML = ''; return; }
    box.innerHTML = [r2.time ? '时间 ' + r2.time : '', r2.title ? '标题「' + esc(r2.title) + '」' : '', r2.cost ? '费用 ' + fmtMoney(r2.cost, r2.currency) : ''].filter(Boolean).join(' · ');
    if (r2.time) { const tE = sh.root.querySelector('#if_time'); if (tE) tE.value = r2.time; }
    if (r2.title) { const tE = sh.root.querySelector('#if_title'); if (tE) tE.value = r2.title; }
    if (r2.cost) { const cE = sh.root.querySelector('#if_cost'); if (cE) cE.value = r2.cost; }
    if (r2.type && ITEM_TYPES.some(x => x.key === r2.type)) { curType = r2.type;
      sh.root.querySelectorAll('#ifTypeChips .chip').forEach(x => x.classList.toggle('active', x.dataset.type === r2.type));
      renderDyn(true); }
  }, 300));
  /* 附件 */
  sh.root.querySelector('#attAddBtn').onclick = () => sh.root.querySelector('#attFile').click();
  sh.root.querySelector('#attFile').onchange = async e => { const files = [...e.target.files];
    const cnt = itemsOf(t.id).reduce((s, x) => s + (x.attachments || []).length, 0);
    if (cnt + files.length > 10) { toast('每个行程最多 10 个附件'); return; }
    for (const f of files) { if (f.size > 5 * 1024 * 1024) { toast('超 5MB'); continue; }
      const aid = 'att_' + uid(); const data = await fileToDataURL(f);
      await idbPut('att_' + aid, data); (it.attachments = it.attachments || []).push({ id: aid, name: f.name, type: f.type, size: f.size }); }
    save('items'); sh.root.querySelector('#attArea').innerHTML = attListHtml(it); toast('附件已保存'); };
  /* 灵感池选择 */
  const poolBtn = sh.root.querySelector('#ifPoolBtn');
  if (poolBtn) poolBtn.onclick = () => { openPoolPicker(sh.root, ins => {
    if (ins.title) { const tE = sh.root.querySelector('#if_title'); if (tE) tE.value = ins.title; }
    if (ins.address) { const aE = sh.root.querySelector('#if_address'); if (aE) aE.value = ins.address; }
    if (ins.note) { const nE = sh.root.querySelector('#if_note'); if (nE) nE.value = ins.note; }
    if (ins.lat != null) { it.lat = ins.lat; it.lng = ins.lng; }
    if (ins.photo) { photoData = ins.photo; renderDyn(); }
    toast('已从灵感池填入'); }); };
  /* 保存 */
  sh.root.querySelector('#ifSave').onclick = () => {
    const schema = TYPE_SCHEMAS[curType] || [];
    const gv = sel => { const el = sh.root.querySelector(sel); return el ? el.value.trim() : ''; };
    const g = k => gv('#if_' + k);
    let _cur = sh.root.querySelector('#ifCur')?.value || '';
    if (!curTouched) { const det = detectCurrency(g('address')); if (det) _cur = det; }
    const data = { type: curType, dayIndex: curDay,
      title: gv('#if_title') || gv('#ifTitle') || '',
      time: gv('#if_time') || gv('#ifTime') || it.time || '',
      address: gv('#if_address') || gv('#ifAddr') || '',
      cost: Number(gv('#if_cost')) || 0,
      currency: _cur || t.currency,
      status: gv('#if_status') || gv('#ifStatus') || it.status || 'planned',
      priority: gv('#if_priority') || gv('#ifPrio') || '',
      rating: Number(gv('#if_rating') || gv('#ifRating')) || undefined,
      review: gv('#if_review') || gv('#ifReview') || undefined,
      note: gv('#if_note') || gv('#ifNote') || it.note || '',
      url: g('url'),
      photo: HAS_PHOTO.includes(curType) ? photoData : undefined,
      locked: it.locked, includedInAnotherTicket: it.includedInAnotherTicket,
      visited: it.visited, bookingRef: it.bookingRef || '',
      lat: it.lat, lng: it.lng, duration: it.duration || 0 };
    for (const f of schema) {
      if (['cost','status','prio','rating','photo','subs'].includes(f.ft)) continue;
      if (['cost','status','priority','rating','photo','subs'].includes(f.key)) continue;
      if (f.ft === 'timerange') { const sE = sh.root.querySelector('#if_' + f.key + '_start'), eE = sh.root.querySelector('#if_' + f.key + '_end');
        if (sE) data[f.key + '_start'] = sE.value; if (eE) data[f.key + '_end'] = eE.value; continue; }
      if (f.ft === 'autodur') { data.durationAuto = collectFieldValue(f, sh.root); continue; }
      if (f.key === 'title' || f.key === 'time' || f.key === 'address' || f.key === 'note') continue;
      const val = g(f.key); if (val) data[f.key] = val;
    }
    if (curType === 'transport') { data.title = [data.origin, data.dest].filter(Boolean).join(' → ') || data.title || it.title || '交通';
      if (data.time && data.arriveTime) data.duration = calcDurationMin(data.time, data.arriveTime); }
    if (curType === 'sight' && !data.time && data.entryTime) data.time = data.entryTime;
    if (curType === 'food' || curType === 'sight') { const os = sh.root.querySelector('#if_openStart_start'), oe = sh.root.querySelector('#if_openStart_end');
      if (os) data.openStart = os.value; if (oe) data.openEnd = oe.value; }
    const subsSort = arr => arr.sort((a, b) => (a.time ? toMin(a.time) : 9999) - (b.time ? toMin(b.time) : 9999));
    if (isNew && parent) { const ni = Object.assign({}, it, data, { id: 'itm_' + uid() });
      parent.subs = parent.subs || []; parent.subs.push(ni); subsSort(parent.subs); }
    else if (parent) { Object.assign(it, data); subsSort(parent.subs || []); }
    else if (isNew) { const ni = Object.assign({}, it, data, { id: 'itm_' + uid() }); DB.items.push(ni); repositionByTime(ni); }
    else { const timeChanged = data.time !== (it.time || ''); Object.assign(it, data); if (timeChanged) repositionByTime(it); }
    save('items');
    for (const f of schema) { if (f.ft !== 'sel_edit') continue;
      const el = sh.root.querySelector('#if_' + f.key); if (el && el.value.trim()) addCustomOpt(f.key, el.value.trim()); }
    if (isNew && ['sight','food','activity'].includes(curType) && data.title) {
      DB.inspirations.push({ id: 'ins_' + uid(), title: data.title, note: data.note || '',
        address: data.address || '', url: '', lat: null, lng: null,
        tags: ['已完成/游玩'], votes: { up: 0, down: 0 }, scheduled: true,
        cat: '已完成/游玩', addedAt: Date.now() });
      save('inspirations'); }
    sh.close(); renderApp(); toast(isNew ? (parent ? '子项已添加' : '已添加') : '已保存'); };
  const delBtn = sh.root.querySelector('#ifDel');
  if (delBtn) delBtn.onclick = async () => { if (!await confirmDlg((parent ? '删除该子项？' : '删除该条目？'), { okText: '删除', danger: true })) return;
    for (const a of (it.attachments || [])) idbDel('att_' + a.id);
    if (parent) { parent.subs = (parent.subs || []).filter(s => s.id !== it.id); }
    else DB.items = DB.items.filter(x => x.id !== it.id);
    save('items'); sh.close(); renderApp(); toast('已删除'); };
  return sh;
}
ACTIONS.addItemFAB = d => { const t = DB.trips.find(x => x.id === d.trip); if (!t) return;
  itemTypeForm(t, 0, null, { fromFAB: true }); };

<script>
/* ==================== HTML 行程单导出（中文行程单 + 英文签证行程单） ==================== */
const HTML_TYPE_NAME={transport:['交通','Transport'],hotel:['住宿','Hotel'],sight:['景点','Attraction'],food:['餐饮','Meal'],activity:['活动','Activity'],shopping:['购物','Shopping'],other:['其他','Other']};
/* ==================== 预订确认粘贴解析 ==================== */
function parseBookingText(text){
  const blocks=(text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean));
  const res=[];
  const dateIn=l=>{ let m=l.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
    if(m)return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
    m=l.match(/(\d{1,2})月(\d{1,2})日/);
    if(m)return new Date().getFullYear()+'-'+pad2(+m[1])+'-'+pad2(+m[2]);
    m=l.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(m)return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
    return null; };
  const timeIn=l=>{ const m=l.match(/([01]?\d|2[0-3])[:：时]([0-5]\d)/); return m?pad2(+m[1])+':'+m[2]:''; };
  const refIn=l=>{ const m=l.match(/(?:订单号|订单编号|票号|确认号|booking\s*ref(?:erence)?)\s*[:：]?\s*([A-Za-z0-9-]{4,})/i); return m?m[1]:''; };
  const seatIn=l=>{ const m=l.match(/(商务座|一等座|二等座|硬卧|硬座|经济舱|商务舱|头等舱|超级经济舱)/); return m?m[1]:''; };
  const routeIn=l=>{ const m=l.match(/([\u4e00-\u9fa5A-Za-z]{2,14})\s*(?:—|–|->|→|-|至)\s*([\u4e00-\u9fa5A-Za-z]{2,14})/);
    if(!m)return null; const o=m[1].replace(/(站|机场| Standing)/g,''),d2=m[2].replace(/(站|机场)/g,'');
    return {origin:m[1].trim(),dest:m[2].trim()}; };
  const fnIn=l=>{ const m=l.match(/\b((?:MU|CA|CZ|HU|9C|MF|HO|ZH|KN|SC|GS|FM|GJ|UQ|PN|TV|BK|JD|DZ|AQ|GX|AF|BA|JL|NH|KE|OZ|SQ|TG|CX|BR|QF|UA|AA|DL|LH|AF)[\s-]?\d{3,4})\b/); return m?m[1].replace(/\s/g,''):''; };
  const tnIn=l=>{ const m=l.match(/\b([GDKCTZYL]\d{1,4})\b/); return m?m[1]:''; };
  for(const b of blocks){
    const bl=b.replace(/\s+/g,' ');
    const ref=refIn(bl), dates=(bl.match(/\d{4}[-/年.]\d{1,2}[-/月.]\d{1,2}/g)||[]);
    const hname=(bl.match(/([\u4e00-\u9fa5A-Za-z0-9·]+(?:酒店|民宿|宾馆|饭店|Resort|Hotel)(?:（[^）]*）)?)/i)||[])[1];
    if(hname||/酒店|民宿|宾馆|入住|退房/i.test(bl)&&!/车次|航班/.test(bl)){
      const addr=(b.match(/地址[:：]([^\n]+)/)||[])[1]||'';
      res.push({kind:'hotel',name:hname||'预订酒店',checkIn:dates[0]||'',checkOut:dates[1]||'',address:addr.trim(),ref}); continue; }
    const fn=fnIn(bl);
    const blNoT=bl.replace(/[A-Z]?T[123](?![0-9])/g,'');
    const tn=tnIn(blNoT);
    if(fn||/航班|航站楼|登机/i.test(bl)){ const r=routeIn(blNoT);
      res.push({kind:'flight',no:fn,origin:r?r.origin:'',dest:r?r.dest:'',date:dates[0]||'',time:timeIn(bl),seat:seatIn(bl),ref}); continue; }
    if(tn||/车次/.test(bl)){ const r=routeIn(bl);
      res.push({kind:'train',no:tn,origin:r?r.origin:'',dest:r?r.dest:'',date:dates[0]||'',time:timeIn(bl),seat:seatIn(bl),ref}); continue; }
  }
  return res;
}
ACTIONS.bookingImport=d=>{ const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  const m=openModal(`<h2>粘贴预订导入</h2>
   <p class="tiny">把机票/火车票/酒店的确认短信、邮件原文粘贴到下面（支持多段），自动识别类型、日期、时间、订单号，生成对应条目。</p>
   <textarea id="bkText" rows="8" placeholder="例如：
MU5398 2026-11-20 14:30 上海虹桥—北京首都 T2，订单号：202611200001，经济舱

汉庭酒店（大理古城店） 入住 2026-11-20 离店 2026-11-22，地址：人民路 33 号"></textarea>
   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px">
     <button class="btn small" data-act="closeOverlay">取消</button>
     <button class="btn primary small" id="bkParse">${I('sparkle',14)}解析预览</button></div>
   <div id="bkResult" class="mt8"></div>`);
  m.el.querySelector('#bkParse').onclick=()=>{ const parsed=parseBookingText(m.el.querySelector('#bkText').value);
    const box=m.el.querySelector('#bkResult');
    if(!parsed.length){ box.innerHTML='<div class="tiny" style="color:var(--err)">未识别出预订内容，请检查格式</div>'; return; }
    box.innerHTML=parsed.map((p,i)=>{ const kind=p.kind==='hotel'?'住宿':p.kind==='train'?'火车':p.kind==='flight'?'航班':'其他';
      const main=p.kind==='hotel'?`${esc(p.name)} ${p.checkIn||'?'} ~ ${p.checkOut||'?'}`
        :`${esc(p.no||'')} ${esc(p.origin)} → ${esc(p.dest)} ${p.date||''} ${p.time||''}`;
      return `<div class="bk-item"><span class="badge bk-badge">${kind}</span>
        <div style="flex:1;font-size:13.5px">${main}${p.seat?' · '+esc(p.seat):''}${p.ref?'<br><span class="tiny">订单 '+esc(p.ref)+'</span>':''}</div></div>`; }).join('')
      +`<button class="btn primary block mt8" id="bkAdd">${I('plus',14)}全部添加（${parsed.length} 条）</button>`;
    box.querySelector('#bkAdd').onclick=()=>{ let added=0;
      for(const p of parsed){ const base={id:'itm_'+uid(),tripId:t.id,dayIndex:0,time:'',type:'other',title:'',note:'',
        cost:0,currency:'',address:'',lat:null,lng:null,duration:0,bookingRef:p.ref||'',attachments:[],visited:false,
        locked:false,includedInAnotherTicket:false,status:'booked',arriveTime:'',origin:'',dest:'',transMode:'',
        seatClass:p.seat||'',checkInDate:'',checkOutDate:'',subs:[],photo:'',rating:undefined,review:'',priority:''};
        if(p.kind==='hotel'){ Object.assign(base,{type:'hotel',title:p.name,checkInDate:p.checkIn,checkOutDate:p.checkOut,address:p.address});
          if(p.checkIn){ const di=diffDays(t.startDate,p.checkIn); if(di>=0&&di<tripDays(t))base.dayIndex=di; } }
        else{ Object.assign(base,{type:'transport',transMode:p.kind==='flight'?'飞机':'火车',title:[p.origin,p.dest].filter(Boolean).join(' → ')||p.no,
            origin:p.origin||'',dest:p.dest||'',time:p.time||'',duration:p.time&&0,bookingRef:p.ref||p.no||''});
          if(p.date){ const di=diffDays(t.startDate,p.date); base.dayIndex=di>=0&&di<tripDays(t)?di:0; }
          if(p.time){ } }
        DB.items.push(base); repositionByTime(base); added++; }
      save('items'); m.close(); renderApp(); toast('已添加 '+added+' 条预订条目'); }; }; };

/* ==================== 证件包 ==================== */
function guessDocKind(name){ if(/护照|passport/i.test(name))return '护照'; if(/签证|visa/i.test(name))return '签证';
  if(/保险|insur/i.test(name))return '保险'; if(/机票|登机|flight|boarding/i.test(name))return '机票';
  if(/酒店|hotel/i.test(name))return '酒店确认'; if(/火车|车票|train/i.test(name))return '车票'; return '其他'; }
const DOC_ICONS={护照:'id',签证:'id',保险:'shield',机票:'send',酒店确认:'home',车票:'send',其他:'file'};
ACTIONS.docWallet=d=>{ const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  const m=openSheet(`<h2>证件包 · ${esc(t.title)}</h2>
   <div id="docList"></div>
   <div class="row mt12"><button class="btn small block" data-act="docAddPick" data-id="${t.id}">${I('plus',13)}添加证件 / 文件（图片或 PDF，≤5MB）</button></div>
   <input type="file" id="docFile" multiple accept="image/*,application/pdf" style="display:none">`);
  const renderList=async()=>{ const docs=getLS('doc_wallet',[]).filter(x=>x.tripId===t.id);
    const box=m.root.querySelector('#docList');
    box.innerHTML=docs.length?docs.map(x=>`<div class="doc-row"><span class="doc-ico">${I(DOC_ICONS[x.kind]||'file',16)}</span>
      <div style="flex:1;min-width:0"><b style="font-size:14px">${esc(x.name)}</b><div class="tiny">${esc(x.kind)} · ${(x.size/1024).toFixed(0)} KB</div></div>
      <button class="btn tiny" data-act="docView" data-id="${x.id}">查看</button>
      <button class="btn tiny danger" data-act="docDel" data-id="${x.id}">${I('trash',12)}</button></div>`).join('')
      :'<div class="empty" style="padding:14px 0">'+I('archive',34)+'<p>还没有证件，先添加护照/签证/保单等</p></div>'; };
  renderList();
  m.root.querySelector('#docFile').onchange=async e=>{ const files=[...e.target.files]; if(!files.length)return;
    const all=getLS('doc_wallet',[]);
    for(const f of files){ if(f.size>5*1024*1024){ toast(f.name+' 超过 5MB，已跳过'); continue; }
      if(all.length>=40){ toast('最多 40 个文件'); break; }
      const id='wd_'+uid(); const data=await fileToDataURL(f);
      await idbPut('wd_'+id,data);
      all.push({id,name:f.name.replace(/\.[^.]+$/,''),kind:guessDocKind(f.name),tripId:t.id,size:f.size,at:Date.now()}); }
    setLS('doc_wallet',all); renderList(); toast('已保存到证件包（仅本机）'); }; };
ACTIONS.docAddPick=d=>{ const inp=document.querySelector('#docFile'); if(inp)inp.click(); };
ACTIONS.docView=async d=>{ const doc=getLS('doc_wallet',[]).find(x=>x.id===d.id); if(!doc)return;
  const data=await idbGet('wd_'+doc.id); if(!data){ toast('文件数据缺失'); return; }
  if(doc.kind&&data.startsWith('data:image')){
    const m=openModal(`<h2 style="font-size:15px">${esc(doc.name)}</h2><img src="${data}" style="width:100%;border-radius:12px">
     <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn small" data-act="closeOverlay">关闭</button></div>`); }
  else{ const byte=data.split(',')[1]; const mime=data.slice(5,data.indexOf(';'));
    const bin=atob(byte); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:mime||'application/pdf'})); window.open(url,'_blank'); } };
ACTIONS.docDel=async d=>{ if(!await confirmDlg('删除该证件文件？',{okText:'删除',danger:true}))return;
  const all=getLS('doc_wallet',[]).filter(x=>x.id!==d.id); setLS('doc_wallet',all); idbDel('wd_'+d.id);
  closeTopOverlay(); renderApp(); toast('已删除'); };

/* ==================== 行程相册 ==================== */
ACTIONS.tripAlbum=async d=>{ const t=DB.trips.find(x=>x.id===d.id); if(!t)return;
  const photos=[];
  const cov=await idbGet('cover_'+t.id); if(cov)photos.push({src:cov,cap:'行程封面'});
  for(const it of itemsOf(t.id)){ if(it.photo)photos.push({src:it.photo,cap:it.title});
    for(const s of (it.subs||[]))if(s.photo)photos.push({src:s.photo,cap:it.title+' · '+(s.title||'')}); }
  for(const j of DB.journal.filter(x=>x.tripId===t.id))
    for(const p of (j.photos||[])){ const dd=await idbGet('jp_'+p.id); if(dd)photos.push({src:dd,cap:'日记 · '+j.title,live:p.live}); }
  const m=openSheet(`<h2>行程相册 · ${esc(t.title)}</h2><div class="tiny" style="margin-bottom:8px">共 ${photos.length} 张（条目 / 子项 / 日记 / 封面）</div>
   <div class="album-grid">${photos.map((p,i)=>`<img src="${p.src}" data-ai="${i}" alt="${esc(p.cap)}">`).join('')}</div>
   ${photos.length?'':'<div class="album-empty">还没有照片 —— 给条目、日记添加照片后会自动出现在这里</div>'}`);
  m.root.querySelectorAll('.album-grid img').forEach(img=>img.onclick=()=>albumViewer(photos,Number(img.dataset.ai))); };
function albumViewer(photos,i){
  const isVid=p=>(p.src||'').startsWith('data:video')||p.live;
  const m=openModal(`<h2 style="font-size:14px">${esc(photos[i].cap)}${isVid(photos[i])?' 📹':''}</h2>
   ${isVid(photos[i])?`<video id="alBig" src="${photos[i].src}" style="width:100%;border-radius:12px" controls playsinline></video>`
     :`<img id="alBig" src="${photos[i].src}" style="width:100%;border-radius:12px">`}
   <div class="row mt8" style="gap:6px"><button class="btn small" id="alPrev">${I('chevL',14)}上一张</button>
     <span class="tiny" style="flex:1;text-align:center" id="alIdx">${i+1} / ${photos.length}</span>
     <button class="btn small" id="alNext">下一张${I('chevR',14)}</button></div>
   <div class="row mt8" style="justify-content:flex-end;gap:8px">
     <button class="btn small" id="alDl">${I('down',14)}保存原图</button>
     <button class="btn small" data-act="closeOverlay">关闭</button></div>`);
  const show=n=>{ i=(n+photos.length)%photos.length; const p=photos[i];
    const wrap=m.el.querySelector('#alBig').parentNode;
    const anew=isVid(p)?`<video id="alBig" src="${p.src}" style="width:100%;border-radius:12px" controls playsinline></video>`
      :`<img id="alBig" src="${p.src}" style="width:100%;border-radius:12px">`;
    m.el.querySelector('#alBig').outerHTML=anew;
    m.el.querySelector('h2').textContent=p.cap+(isVid(p)?' 📹':''); m.el.querySelector('#alIdx').textContent=(i+1)+' / '+photos.length; };
  m.el.querySelector('#alPrev').onclick=()=>show(i-1);
  m.el.querySelector('#alNext').onclick=()=>show(i+1);
  const onKey=ev=>{ if(ev.key==='ArrowLeft')show(i-1); else if(ev.key==='ArrowRight')show(i+1); };
  document.addEventListener('keydown',onKey);
  const _oc=m.close; m.close=()=>{ document.removeEventListener('keydown',onKey); _oc(); };
  m.el.querySelector('#alDl').onclick=()=>download((photos[i].cap||'photo').replace(/[\\/:*?"<>|]/g,'_')+'.png',photos[i].src,'image/png'); }

/* ==================== 年度旅行回顾 ==================== */
function yearReviewCanvas(year){
  const c=document.createElement('canvas'); c.width=1080; c.height=1620; const x=c.getContext('2d');
  drawConstellationBG(x,1080,1620,'year-'+year);
  x.textAlign='center'; x.fillStyle='#fff';
  x.font='600 44px -apple-system,PingFang SC,sans-serif'; x.fillText('星轨绘卷 · '+year+' 年度旅行回顾',540,130);
  const trips=DB.trips.filter(t=>!t.archived&&(t.startDate.slice(0,4)===String(year)||t.endDate.slice(0,4)===String(year)));
  let tripDays_=0,spend=0,km=0,itemCnt=0; const countries=new Set();
  for(const t of trips){ const s=Math.max(t.startDate,year+'-01-01'),e=Math.min(t.endDate,year+'-12-31');
    tripDays_+=Math.max(0,diffDays(s,e)+1); spend+=tripSpend(t.id).total; itemCnt+=itemsOf(t.id).length;
    const cName=detectCountry(t.destination||''); if(cName)countries.add(cName);
    for(let d=0;d<tripDays(t);d++){ const pts=itemsOfDay(t.id,d).filter(x=>x.lat!=null)
        .sort((a,b)=>(a.time?toMin(a.time):9999)-(b.time?toMin(b.time):9999));
      for(let i2=0;i2<pts.length-1;i2++){ const k3=haversine(pts[i2],pts[i2+1]); if(k3)km+=k3; } } }
  const stats=[['旅程',trips.length+' 次'],['国家/地区',countries.size+' 个'],['在路上',tripDays_+' 天'],
    ['总公里',Math.round(km).toLocaleString('zh-CN')+' 千米'],['总花费',fmtMoney(Math.round(spend),'CNY')],['条目',itemCnt+' 条']];
  stats.forEach(([k2,v],i2)=>{ const bx=90+i2%3*310,by=230+Math.floor(i2/3)*180;
    x.fillStyle='rgba(255,255,255,.09)'; x.fillRect(bx,by,290,150);
    x.textAlign='center';
    x.fillStyle='#FFD166'; x.font='700 34px -apple-system,PingFang SC,sans-serif'; x.fillText(v,bx+145,by+72);
    x.fillStyle='rgba(255,255,255,.75)'; x.font='24px -apple-system,PingFang SC,sans-serif'; x.fillText(k2,bx+145,by+116); });
  x.fillStyle='#fff'; x.font='600 32px -apple-system,PingFang SC,sans-serif'; x.textAlign='left';
  x.fillText('今年的足迹',90,680);
  let y=740;
  const list=trips.sort((a,b)=>a.startDate<b.startDate?-1:1).slice(0,9);
  if(!list.length){ x.fillStyle='rgba(255,255,255,.6)'; x.font='26px -apple-system,sans-serif';
    x.fillText('这一年还没有行程 —— 去规划下一趟吧',90,y); }
  for(const t of list){ x.fillStyle='rgba(255,255,255,.1)';
    x.fillRect(90,y-36,900,64); x.beginPath(); x.fillStyle=DAY_COLORS[list.indexOf(t)%DAY_COLORS.length];
    x.arc(126,y-4,10,0,7); x.fill();

/* ==================== 行程手账（参考 ache-life-to-comic 手账漫画形态） ==================== */
const ZHANG_F='"Kaiti SC","STKaiti","KaiTi","DFKai-SB",serif';

function zhangWrap(x,txt,cx,y,maxW,lh,maxLines,font,color){
  x.font=font; x.fillStyle=color; x.textAlign='left';
  let line='',rows=0;
  for(const ch of String(txt)){
    if(ch==='\n'||x.measureText(line+ch).width>maxW){
      x.fillText(line,cx,y+rows*lh); rows++; line=(ch==='\n'?'':ch);
      if(rows>=maxLines){ if(line)x.fillText(line.slice(0,Math.max(0,line.length-1))+'…',cx,y+rows*lh); return rows+1; }
    } else line+=ch;
  }
  if(line){ x.fillText(line,cx,y+rows*lh); rows++; }
  return rows;
}
function zhangTape(x,cx,cy,w,h,color,rot){
  x.save(); x.translate(cx,cy); x.rotate(rot); x.fillStyle=color;
  x.fillRect(-w/2,-h/2,w,h);
  x.globalAlpha=.25; x.fillStyle='#fff'; x.fillRect(-w/2,-h/2,w,h/3);
  x.restore();
}
function zhangMat(x,img,cx,cy,w,h,rot,cap,capColor){
  x.save(); x.translate(cx,cy); x.rotate(rot);
  x.shadowColor='rgba(40,40,60,.18)'; x.shadowBlur=16; x.shadowOffsetY=5;
  x.fillStyle='#fff'; x.fillRect(-w/2-13,-h/2-13,w+26,h+52);
  x.shadowColor='transparent'; x.shadowBlur=0; x.shadowOffsetY=0;
  if(img){ const iw=img.width,ih=img.height,sc=Math.max(w/iw,h/ih);
    x.save(); x.beginPath(); x.rect(-w/2,-h/2,w,h); x.clip();
    x.drawImage(img,-w/2+(w-iw*sc)/2,-h/2+(h-ih*sc)/2,iw*sc,ih*sc); x.restore(); }
  else { x.fillStyle='#EEE9E0'; x.fillRect(-w/2,-h/2,w,h);
    x.fillStyle='#C9C2B4'; x.font='26px '+ZHANG_F; x.textAlign='center'; x.fillText('照片',0,8); }
  if(cap){ x.fillStyle=capColor; x.font='26px '+ZHANG_F; x.textAlign='center'; x.fillText(cap,0,h/2+34); }
  x.restore();
}
function zhangSeal(x,cx,cy,txt){
  x.save(); x.translate(cx,cy);
  x.fillStyle='#C0554A'; x.beginPath();
  if(x.roundRect)x.roundRect(-34,-34,68,68,10); else x.rect(-34,-34,68,68);
  x.fill();
  x.fillStyle='#fff'; x.font='700 30px '+ZHANG_F; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(txt,0,2); x.textBaseline='alphabetic'; x.restore();
}
async function zhangLoadPhotos(tasks){
  const imgs={};
  for(const t of tasks){ try{
    let src=t.src;
    if(!src&&t.jpid)src=await idbGet('jp_'+t.jpid);
    if(src){ const img=new Image(); await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=src;}); imgs[t.key]=img; }
  }catch(e){} }
  return imgs;
}

function aiTripSanitize(j,dest,days){ const out={title:String(j.title||dest+' '+days+' 日行程').slice(0,40),
    destination:String(j.destination||dest).slice(0,60),currency:CURS.includes(j.currency)?j.currency:detectCurrency(dest)||'CNY',
    days:[]};
  const arr=Array.isArray(j.days)?j.days:[];
  for(let i=0;i<days;i++){ const d=arr[i]||{}; const items=[];
    for(const it of (Array.isArray(d.items)?d.items.slice(0,12):[])){
      const ty=['transport','hotel','sight','food','activity','shopping','other'].includes(it.type)?it.type:'other';
      const time=/^([01]\d|2[0-3]):[0-5]\d$/.test(it.time||'')?it.time:'';
      items.push({type:ty,title:String(it.title||'').slice(0,50),time,cost:Math.max(0,Number(it.cost)||0),
        address:String(it.address||'').slice(0,80),note:String(it.note||'').slice(0,80)}); }
    out.days.push({items}); }
  return out; }

async function aiTripGen(m){ const dest=m.el.querySelector('#aiDest').value.trim();
  if(!dest){ toast('请填写目的地'); return; }
  const days=clamp(Number(m.el.querySelector('#aiDays').value)||4,1,15);
  const start=m.el.querySelector('#aiStart').value||addDays(todayStr(),14);
  const pref=m.el.querySelector('#aiPref').value.trim();
  const key=localStorage.getItem('ai_key'), endpoint=localStorage.getItem('ai_endpoint')||'https://api.openai.com/v1/chat/completions',
    model=localStorage.getItem('ai_model')||'gpt-4o-mini';
  const btn=m.el.querySelector('#aiGo'); btn.disabled=true; btn.textContent='生成中…';
  try{ const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,temperature:0.6,messages:[
        {role:'system',content:'你是旅行规划助手。只输出严格 JSON，不要任何解释或代码块标记。最外层对象含 title、destination、currency、days 四个字段；days 是数组，每项含 items 数组；items 每项含 type（取值 transport、hotel、sight、food、activity、shopping、other 之一）、title、time（HH:MM 或空串）、cost（数字）、address、note（一句话）。days 长度必须等于指定天数，每天 3 到 8 条，必须包含交通与住宿。'},
        {role:'user',content:`目的地：${dest}\n天数：${days} 天\n出发日期：${start}\n偏好：${pref||'无'}`}]})});
    const j=await r.json();
    const raw=(j.choices[0].message.content||'').replace(/```json|```/g,'').trim();
    const data=aiTripSanitize(JSON.parse(raw),dest,days);
    m.close();
    const rows=data.days.map((d2,i2)=>`<div class="trip-sec-title">第 ${i2+1} 天（${d2.items.length} 条）</div>
      ${d2.items.map(it=>`<div class="tiny" style="padding:2px 0">${it.time?it.time+' ':''}${esc(it.title)}${it.cost?' · ¥'+it.cost:''}</div>`).join('')}`).join('');
    const sm=openModal(`<h2>AI 草稿预览 · ${esc(data.title)}</h2>
